[workspace]
members = [".", "lib/*"]
resolver = "2"

[package]
name = "andromeda"
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]
build = "build.rs"

[dependencies]
andromeda-extractor = { path = "lib/andromeda-extractor" }
async-trait = "0.1.89"
axum = "0.8.8"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
futures = "0.3.32"
clap-themes = "0.1.3"
confique = { version = "0.4.0", features = ["toml"] }
demurgos_headers = "0.4.1"
geo = "0.32.0"
geojson = "1.0.0"
mime = "0.3.17"
indexmap = { version = "2.13.0", features = ["serde"] }
json-ld-engine = { path = "lib/json-ld-engine" }
json-ld-expandable = { path = "lib/json-ld-expandable" }
mediatype = "0.21.0"
ngsi-ld-error = { path = "lib/ngsi-ld-error" }
ngsi-ld-query = { path = "lib/ngsi-ld-query" }
ngsi-ld-types = { path = "lib/ngsi-ld-types" }
parse_link_header = "0.4.0"
percent-encoding = "2.3.2"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
shadow-rs = "1.7.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["normalize-path"] }
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
url = { version = "2.5.8", features = ["serde"] }
urn = { version = "0.7.0", features = ["serde"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[build-dependencies]
shadow-rs = "1.7.1"

[dev-dependencies]
futures = "0.3.32"
libtest-mimic = "0.8.2"
pretty_assertions = "1.4.1"
urlencoding = "2.1.3"

[[test]]
name = "integration"
path = "tests/main.rs"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
