[workspace]
members = [".", "crates/*", "tools/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false
authors = ["Matej Škvarč <matej@skvarc.com>"]
repository = "https://github.com/mskvarc/andromeda"
homepage = "https://andromeda.skvarc.com"

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_qualifications = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arc_with_non_send_sync = "deny"
await_holding_lock = "deny"
branches_sharing_code = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cloned_instead_of_copied = "warn"
disallowed_methods = "deny"
expect_used = "deny"
future_not_send = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
missing_docs_in_private_items = "deny"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"
unnecessary_self_imports = "warn"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"

[package]
name = "andromeda"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "A standards-compliant NGSI-LD context broker (ETSI GS CIM 009)"

[lints]
workspace = true

[dependencies]
andromeda-broker-composition.workspace = true
andromeda-configuration.workspace = true
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap-themes = "0.1.3"
tokio = { version = "1.54.1", features = ["full"] }

# jemalloc does not build for MSVC, where mimalloc stays the global allocator.
[target.'cfg(target_env = "msvc")'.dependencies]
mimalloc = "0.1.52"

# Background threads purge freed memory off the allocating threads.
[target.'cfg(not(any(target_env = "msvc", target_env = "musl")))'.dependencies]
tikv-jemallocator = { version = "0.7.0", features = ["background_threads"] }

# jemalloc has no background thread support on musl.
[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = { version = "0.7.0", default-features = false }

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# The shipped image's build. The symbol table is a quarter of the binary and nothing in production reads it; local
# release builds keep it for profilers, and a rebuild of the same commit with `--release` symbolises a dist binary's
# addresses.
[profile.dist]
inherits = "release"
strip = "symbols"

