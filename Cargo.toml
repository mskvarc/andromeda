[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]

[workspace.lints.clippy]
absolute_paths = "deny"
allow_attributes_without_reason = "deny"
arc_with_non_send_sync = "deny"
await_holding_lock = "deny"
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
expect_used = "deny"
future_not_send = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"
unnecessary_self_imports = "warn"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_enum_match_arm = "deny"
wildcard_dependencies = "warn"
wildcard_imports = "warn"

# Deferred until the existing invariant checks and low-level numeric conversions
# have been reviewed and expressed without these deliberate patterns.
# unreachable = "deny"
# cast_possible_truncation = "deny"
# cast_sign_loss = "deny"
# cast_possible_wrap = "deny"

[package]
name = "andromeda"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
andromeda-broker-composition.workspace = true
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap-themes = "0.1.3"
mimalloc = "0.1.52"
shadow-rs = "2.0.0"
tokio = { version = "1.53.1", features = ["full"] }

[build-dependencies]
shadow-rs = "2.0.0"

[dev-dependencies]
andromeda-context-commit.workspace = true
andromeda-entity.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-notification.workspace = true
andromeda-postgresql-attribute-dictionary.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-context-store.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-temporal-store.workspace = true
andromeda-tenancy.workspace = true
andromeda-test-client.workspace = true
andromeda-test-fixtures.workspace = true
andromeda-test-harness.workspace = true
andromeda-test-mocks.workspace = true
andromeda-unit-catalog.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
pretty_assertions = "1.4.1"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
serde_json = "1.0.151"
serial_test = "4.0.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
urlencoding = "2.1.3"
uuid = { version = "1.24.1", features = ["fast-rng", "serde", "v4", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
debug = true

