[workspace]
members = [".", "crates/*", "lib/andromeda-test-common"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]

[workspace.dependencies]
andromeda-domain = { path = "crates/andromeda-domain" }
andromeda-geometry = { path = "crates/andromeda-geometry" }
andromeda-query = { path = "crates/andromeda-query" }
andromeda-test-common = { path = "lib/andromeda-test-common" }

[workspace.lints.clippy]
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
expect_used = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"

[package]
name = "andromeda"
version.workspace = true
edition.workspace = true
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
andromeda-domain.workspace = true
andromeda-geometry.workspace = true
andromeda-query.workspace = true
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
backon = "1.6.0"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap-themes = "0.1.3"
compact_str = { version = "0.9.0", features = ["serde"] }
confique = { version = "0.4.0", features = ["toml"] }
contextual = "0.1.6"
dashmap = { version = "6.1.0", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from", "into"] }
futures = "0.3.32"
geo = "0.33.1"
geojson = "1.0.0"
headers = "0.4.1"
indexmap = { version = "2.14.0", features = ["serde"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
jsonld = { version = "0.22.0", features = ["expandable-serde-json", "expandable-chrono", "reqwest", "serde", "serde-json", "vocab"] }
jsonld-core = "0.22.0"
jsonld-syntax = { version = "0.22.0", features = ["serde-json"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
mimalloc = "0.1.50"
moka = { version = "0.12.15", features = ["future"] }
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
problem_details = { version = "0.9.0", features = ["axum"] }
rdfx = "0.24.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
rstar = "0.12.2"
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
sea-query = { version = "0.32.7", features = ["backend-postgres", "with-chrono"] }
sea-query-binder = { version = "0.7.0", features = ["runtime-tokio", "sqlx-postgres", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
shadow-rs = "2.0.0"
sonic-rs = "0.5.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.2"
tower = { version = "0.5.3", features = ["util"] }
tower-helmet = "0.3.0"
tower-http = { version = "0.6.8", features = ["compression-full", "cors", "decompression-full", "normalize-path", "request-id", "sensitive-headers", "timeout", "trace", "util"] }
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.23.1", features = ["fast-rng", "serde", "v4"] }

[build-dependencies]
shadow-rs = "2.0.0"

[dev-dependencies]
andromeda-test-common.workspace = true
futures = "0.3.32"
pretty_assertions = "1.4.1"
serial_test = "3.4.0"
urlencoding = "2.1.3"

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
debug = true
