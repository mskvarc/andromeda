[workspace]
members = [".", "lib/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]

[package]
name = "andromeda"
version.workspace = true
edition.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
backon = "1.6.0"
bytes = "1.11.1"
cefact-units = { version = "0.1.0", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap-themes = "0.1.3"
compact_str = { version = "0.9.0", features = ["serde"] }
confique = { version = "0.4.0", features = ["toml"] }
contextual = "0.1.6"
dashmap = { version = "6.1.0", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from"] }
ed25519-dalek = "2.2.0"
futures = "0.3.32"
geo = "0.33.0"
geojson = "1.0.0"
geozero = { version = "0.15.1", default-features = false, features = ["with-wkb", "with-geo", "with-geojson", "with-postgis-sqlx"] }
headers = "0.4.1"
indexmap = { version = "2.14.0", features = ["serde"] }
iref = { version = "4.0.0", features = ["serde"] }
# Alias required: json-ld 0.21.x depends on iref v3, while we use iref v4 elsewhere.
iref3 = { package = "iref", version = "3.2.2" }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
json-ld = "0.21.4"
json-ld-expandable = { path = "lib/json-ld-expandable" }
json-syntax = { version = "0.12.5", features = ["serde_json"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.21.0"
mimalloc = "0.1.50"
mime = "0.3.17"
moka = { version = "0.12.15", features = ["future"] }
multibase = "0.9.2"
ngsi-ld-vocabulary = { path = "lib/ngsi-ld-vocabulary" }
oxrdf = "0.2.4"
p256 = "0.13.2"
p384 = "0.13.1"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
problem_details = { version = "0.9.0", features = ["axum"] }
rdf-canon = "0.15.3"
rdf-types = "0.22.5"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
rstar = "0.12.2"
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
sea-query = { version = "0.32.7", features = ["backend-postgres"] }
sea-query-binder = { version = "0.7.0", features = ["sqlx-postgres", "runtime-tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
serde_with = "3.18.0"
sha2 = "0.11.0"
shadow-rs = "1.7.1"
sonic-rs = "0.5.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
static-iref = "3.0.0"
static-regular-grammar = "2.0.2"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
toml = "0.9.12"
tower = { version = "0.5.3", features = ["util"] }
tower-helmet = "0.3.0"
tower-http = { version = "0.6.8", features = ["compression-full", "cors", "decompression-full", "normalize-path", "request-id", "sensitive-headers", "timeout", "trace", "util"] }
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.8.0", features = ["serde"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[build-dependencies]
shadow-rs = "1.7.1"

[dev-dependencies]
andromeda-test-common = { path = "lib/andromeda-test-common" }
futures = "0.3.32"
pretty_assertions = "1.4.1"
serial_test = "3.4.0"
urlencoding = "2.1.3"

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
debug = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
get_unwrap = "deny"
wildcard_dependencies = "warn"
wildcard_imports = "warn"
used_underscore_binding = "warn"
missing_const_for_fn = "warn"
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
# unnecessary_self_imports = "warn"
redundant_clone = "warn"
# pub_use = "warn"
needless_collect = "warn"
map_unwrap_or = "deny"
