[workspace]
members = [".", "lib/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]

[package]
name = "andromeda"
version.workspace = true
edition.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
axum-health = { version = "0.1.2", features = ["sqlx"] }
backon = "1.6.0"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
clap-themes = "0.1.3"
confique = { version = "0.4.0", features = ["toml"] }
contextual = "0.1.6"
dashmap = { version = "6.1.0", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from"] }
futures = "0.3.32"
geo = "0.32.0"
geojson = "1.0.0"
headers = "0.4.1"
indexmap = { version = "2.13.1", features = ["serde"] }
iref = { version = "4.0.0", features = ["serde"] }
# Alias required: json-ld 0.21.x depends on iref v3, while we use iref v4 elsewhere.
iref3 = { package = "iref", version = "3.2.2" }
json-ld = "0.21.4"
json-ld-expandable = { path = "lib/json-ld-expandable" }
json-syntax = { version = "0.12.5", features = ["serde_json"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.21.0"
mime = "0.3.17"
moka = { version = "0.12.15", features = ["future"] }
ngsi-ld-vocabulary = { path = "lib/ngsi-ld-vocabulary" }
percent-encoding = "2.3.2"
problem_details = { version = "0.9.0", features = ["axum"] }
rdf-types = "0.22.5"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
shadow-rs = "1.7.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
static-iref = "3.0.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["normalize-path"] }
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
urn = { version = "0.7.0", features = ["serde"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[build-dependencies]
shadow-rs = "1.7.1"

[dev-dependencies]
futures = "0.3.32"
libtest-mimic = "0.8.2"
pretty_assertions = "1.4.1"
serial_test = "3.2.0"
urlencoding = "2.1.3"

[[test]]
name = "integration"
path = "tests/main.rs"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[package.metadata.cargo-machete]
ignored = ["static-iref"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
get_unwrap = "deny"
wildcard_dependencies = "warn"
wildcard_imports = "warn"
used_underscore_binding = "warn"
missing_const_for_fn = "warn"
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
# unnecessary_self_imports = "warn"
redundant_clone = "warn"
# pub_use = "warn"
needless_collect = "warn"
map_unwrap_or = "deny"
