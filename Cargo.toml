[workspace]
members = [".", "crates/*", "lib/andromeda-layer-guard", "lib/andromeda-test-common"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]

[workspace.dependencies]
andromeda-delivery = { path = "crates/andromeda-delivery" }
andromeda-health = { path = "crates/andromeda-health" }
andromeda-jsonld = { path = "crates/andromeda-jsonld" }
andromeda-layer-guard = { path = "lib/andromeda-layer-guard" }
andromeda-ngsi-ld-geometry = { path = "crates/andromeda-ngsi-ld-geometry" }
andromeda-ngsi-ld-http-headers = { path = "crates/andromeda-ngsi-ld-http-headers" }
andromeda-ngsi-ld-lexicon = { path = "crates/andromeda-ngsi-ld-lexicon" }
andromeda-ngsi-ld-model = { path = "crates/andromeda-ngsi-ld-model" }
andromeda-ngsi-ld-problem-details = { path = "crates/andromeda-ngsi-ld-problem-details" }
andromeda-ngsi-ld-query = { path = "crates/andromeda-ngsi-ld-query" }
andromeda-ngsi-ld-render = { path = "crates/andromeda-ngsi-ld-render" }
andromeda-ngsi-ld-request = { path = "crates/andromeda-ngsi-ld-request" }
andromeda-ngsi-ld-representation = { path = "crates/andromeda-ngsi-ld-representation" }
andromeda-ngsi-ld-vocabulary = { path = "crates/andromeda-ngsi-ld-vocabulary" }
andromeda-postgresql-context-query = { path = "crates/andromeda-postgresql-context-query" }
andromeda-postgresql-encoding = { path = "crates/andromeda-postgresql-encoding" }
andromeda-postgresql-query = { path = "crates/andromeda-postgresql-query" }
andromeda-postgresql-temporal-query = { path = "crates/andromeda-postgresql-temporal-query" }
andromeda-spatial-index = { path = "crates/andromeda-spatial-index" }
andromeda-tenancy = { path = "crates/andromeda-tenancy" }
andromeda-test-common = { path = "lib/andromeda-test-common" }

[workspace.lints.clippy]
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
expect_used = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"

[package]
name = "andromeda"
version.workspace = true
edition.workspace = true
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
andromeda-delivery.workspace = true
andromeda-health.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-http-headers.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-problem-details.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-render.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-postgresql-context-query.workspace = true
andromeda-postgresql-encoding.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-temporal-query.workspace = true
andromeda-spatial-index.workspace = true
andromeda-tenancy.workspace = true
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap-themes = "0.1.3"
compact_str = { version = "0.9.0", features = ["serde"] }
confique = { version = "0.4.0", features = ["toml"] }
dashmap = { version = "6.1.0", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from", "into", "is_variant"] }
futures = "0.3.32"
geo = "0.33.1"
geojson = "1.0.0"
headers = "0.4.1"
indexmap = { version = "2.14.0", features = ["serde"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
jsonld = { version = "0.22.0", features = ["expandable-serde-json", "expandable-chrono", "reqwest", "serde", "serde-json", "vocab"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
mimalloc = "0.1.50"
moka = { version = "0.12.15", features = ["future"] }
percent-encoding = "2.3.2"
problem_details = { version = "0.9.0", features = ["axum"] }
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
sea-query = { version = "0.32.7", features = ["backend-postgres", "with-chrono"] }
sea-query-binder = { version = "0.7.0", features = ["runtime-tokio", "sqlx-postgres", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
shadow-rs = "2.0.0"
sonic-rs = "0.5.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.2"
tower = { version = "0.5.3", features = ["util"] }
tower-helmet = "0.3.0"
tower-http = { version = "0.6.8", features = ["compression-full", "cors", "decompression-full", "normalize-path", "request-id", "sensitive-headers", "timeout", "trace", "util"] }
tower-layer = "0.3.3"
typed-builder = "0.23.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.23.1", features = ["fast-rng", "serde", "v4"] }

[build-dependencies]
shadow-rs = "2.0.0"

[dev-dependencies]
andromeda-test-common.workspace = true
futures = "0.3.32"
pretty_assertions = "1.4.1"
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
serial_test = "3.4.0"
urlencoding = "2.1.3"

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
debug = true
