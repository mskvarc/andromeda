[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
absolute_paths = "deny"
allow_attributes_without_reason = "deny"
arc_with_non_send_sync = "deny"
await_holding_lock = "deny"
branches_sharing_code = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cloned_instead_of_copied = "warn"
expect_used = "deny"
future_not_send = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"
unnecessary_self_imports = "warn"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"

[package]
name = "andromeda"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
andromeda-broker-composition.workspace = true
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap-themes = "0.1.3"
mimalloc = "0.1.52"
shadow-rs = "2.0.0"
tokio = { version = "1.53.2", features = ["full"] }

[build-dependencies]
shadow-rs = "2.0.0"

[dev-dependencies]
andromeda-context-commit.workspace = true
andromeda-context-space.workspace = true
andromeda-entity.workspace = true
andromeda-http-headers.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-notification.workspace = true
andromeda-postgresql-atomic-write.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-context-store.workspace = true
andromeda-postgresql-name-dictionary.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-temporal-query.workspace = true
andromeda-postgresql-temporal-store.workspace = true
andromeda-temporal.workspace = true
andromeda-tenancy.workspace = true
andromeda-test-client.workspace = true
andromeda-test-fixtures.workspace = true
andromeda-test-harness.workspace = true
andromeda-test-mocks.workspace = true
andromeda-unit-catalog.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
jsonld = { version = "0.23.5", features = ["serde-json"] }
jsonld-syntax = { version = "0.23.5", features = ["serde-json"] }
pretty_assertions = "1.4.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1.15.1"
sea-query = { version = "1.0.2", features = ["backend-postgres"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_norway = "0.9.42"
serial_test = "4.0.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.27.0", features = ["fast-rng", "serde", "v4", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

