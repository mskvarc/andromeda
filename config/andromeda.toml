[andromeda]
host = "0.0.0.0"
port = 1056

[database]
url = "postgres://postgres:postgres@localhost:5432/postgres"
max_connections = 5

[jsonld]
allow_remote_contexts = true
timeout_seconds = 30
max_redirects = 5
max_context_bytes = 2000000
cache_capacity = 1024
cache_ttl_seconds = 3600

[jsonld.preload_contexts]
"https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite-compound.jsonld" = "../lib/json-ld-engine/src/context/ngsi-ld-test-suite-compound.jsonld"
"https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/main/resources/jsonld-contexts/ngsi-ld-test-suite-compound.jsonld" = "../lib/json-ld-engine/src/context/ngsi-ld-test-suite-compound.jsonld"

[multitenancy]
enabled = true
tenant_db_prefix = "andromeda_tenant"
runtime_idle_ttl_seconds = 900
runtime_max_cached = 64
janitor_interval_seconds = 30

[performance]
# If omitted, defaults to min(database.max_connections, 25)
# batch_concurrency = 5
