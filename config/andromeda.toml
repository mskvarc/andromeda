[server]
host = "0.0.0.0"
port = 1056

[http]
request_timeout_secs = 30
response_compression = "enabled"
request_decompression = "enabled"
cors = "permissive"
max_request_body_bytes = 67108864

[database]
url = "postgres://postgres:postgres@localhost:5432/postgres"
max_connections = 64
preload_name_dictionaries = true
context_hit_flush_secs = 5

[database.maintenance]
mode = "automatic"
profile = "conservative"

[jsonld]
allow_remote_contexts = true
timeout_seconds = 30
max_redirects = 5
max_context_bytes = 2000000
cache_capacity = 1024
cache_ttl_seconds = 3600
preload_contexts = {}

[temporal]
default_last_n = 19
expiration_check_interval_secs = 30
intent_retry_max_secs = 300
intent_stuck_after_attempts = 10
# Override the schema defaults (7-day chunks, columnstore after 30 days);
# columnstore_after_days must be at least chunk_interval_days.
# chunk_interval_days = 7
# columnstore_after_days = 30

[tenancy]
enabled = true
tenant_db_prefix = "andromeda_tenant"
tenant_max_connections = 32
runtime_idle_ttl_seconds = 900
runtime_max_cached = 64
janitor_interval_seconds = 30

[info]
source_id = "urn:ngsi-ld:ContextSourceIdentity:andromeda"
source_alias = "andromeda"
# Raw JSON returned verbatim as `contextSourceExtras` (Table 5.2.40-1); never
# interpreted as JSON-LD. Environment: ANDROMEDA_INFO_SOURCE_EXTRAS='{"region":"eu"}'
# source_extras = { region = "eu-west" }
# The origin other brokers reach this one at. Required for subscription
# forwarding (clauses 5.8.1.4, 5.8.6): forwarded subscriptions notify back here.
# advertised_url = "http://broker-a:1056"

[entity]
# If omitted, defaults to min(database.max_connections, 25)
# batch_concurrency = 5
batch_chunk_size = 512
batch_large_threshold = 512
batch_prepare_blocking_threshold = 128
# batch_async_side_effect_threshold = 512
expiry_batch_size = 1000
pending_side_effects_dead_letter_after_secs = 604800
pending_side_effects_cleanup_interval_secs = 300

[federation]
forward_concurrency = 16

[postgresql_write]
bulk_mode = "unnest"

[snapshot]
default_lifetime_secs = 3600
maximum_lifetime_secs = 2592000
capture_page_size = 250
preparation_concurrency = 4
scoped_operation_wait_secs = 30
preparation_lease_secs = 30

[notification_delivery]
enabled = false
max_attempts = 5
base_backoff_secs = 5
poll_interval_secs = 1
batch_size = 50
concurrency = 20
lease_secs = 30
error_max_chars = 1024
cleanup_after_secs = 86400
cleanup_interval_secs = 300
dead_letter_after_secs = 604800
orphan_event_after_secs = 86400

[notifications.sse]
channel_buffer_size = 64
keep_alive_interval_secs = 15

[notifications.ws]
channel_buffer_size = 64
ping_interval_secs = 30

[spatial]
rebuild_interval_secs = 1800

[observability]
log_level = "info"
# Metrics exposure: "disabled" or "prometheus" (serves GET /metrics in the text exposition format).
metrics = "disabled"

# NGSI-LD Data Integrity (ETSI GS CIM 019 v1.2.1) verification.
#
# Static mapping of verification-method URIs to multibase-encoded
# public keys. Used by the in-memory StaticResolver at broker startup.
# Leave the map empty to rely on HTTPS dereferencing.
[provenance]
verification_methods = {}
https_resolver_enabled = true
