[package]
name = "json-ld-engine"
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]
description = "Standalone JSON-LD processing engine for NGSI-LD"

[dependencies]
async-trait = "0.1.89"
contextual = "0.1.6"
dashmap = { version = "6.1.0", features = ["inline"] }
iref = "3.2.2"
json-ld = "0.21.4"
json-syntax = { version = "0.12.5", features = ["serde_json"] }
moka = { version = "0.12.14", features = ["future"] }
once_cell = "1.21.4"
rdf-types = "0.22.5"
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
