[package]
name = "ngsi-ld-error"
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]
description = "NGSI-LD error types and RFC 7807 Problem Details responses (ETSI GS CIM 009)"

[dependencies]
axum = "0.8.8"
problem_details = { version = "0.9.0", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
