[package]
name = "json-ld-expandable"
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]
description = "Derive macro for JSON-LD expandable types"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }

[dev-dependencies]
serde_json = "1.0.149"
trybuild = { version = "1.0.116", features = ["diff"] }
