[package]
name = "andromeda-extractor"
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]
description = "Axum extractors for NGSI-LD API"

[dependencies]
axum = "0.8.8"
json-ld-engine = { path = "../json-ld-engine" }
mediatype = "0.21.0"
ngsi-ld-error = { path = "../ngsi-ld-error" }
ngsi-ld-query = { path = "../ngsi-ld-query" }
parse_link_header = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
