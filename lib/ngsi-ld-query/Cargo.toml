[package]
name = "ngsi-ld-query"
version = "0.1.0"
edition = "2024"
authors = ["Matej Škvarč <matej.skvarc@senlab.io>"]
description = "NGSI-LD query parameter types, parser, and evaluation"

[dependencies]
ngsi-ld-types = { path = "../ngsi-ld-types" }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
percent-encoding = "2"
thiserror = "2.0.18"
url = { version = "2.5.8", features = ["serde"] }
urn = { version = "0.7.0", features = ["serde"] }

[dev-dependencies]
serde_urlencoded = "0.7.1"
