[package]
name = "ngsi-ld-vocabulary"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Proc-macro that generates typed NGSI-LD vocabulary constants from local JSON-LD context files"

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
iref = "4.0.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
serde_json = "1.0.149"
static-iref = "3.0.0"
syn = "2.0.117"

[dev-dependencies]
trybuild = { version = "1.0.116", features = ["diff"] }
