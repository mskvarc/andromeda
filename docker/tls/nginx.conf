events {}

http {
    # Plaintext listener, present only to send clients to the TLS one. ETSI GS
    # CIM 009 v1.9.1 clause 6.2: "HTTP without TLS is not recommended."
    server {
        listen 8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/broker.crt;
        ssl_certificate_key /etc/nginx/certs/broker.key;

        # Clause 6.2: "TLS version 1.2 as defined by IETF RFC 5246 shall be
        # supported." TLS 1.3 is offered alongside it; 1.0 and 1.1 are omitted
        # because IETF RFC 8996 deprecates them.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Meaningful only on the connection this proxy terminates, so it is set
        # here rather than by the broker.
        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 64m;

        location / {
            proxy_pass http://broker:1056;
            proxy_http_version 1.1;

            # The broker takes the authority half of its origin from `Host`, so
            # the client's value is passed through rather than rewritten to the
            # upstream address.
            proxy_set_header Host $host;

            # `proxy_set_header` REPLACES the field rather than appending to it,
            # which is what makes ANDROMEDA_HTTP_FORWARDED_HEADERS=trusted safe:
            # a client-supplied element can never survive into the leftmost
            # position the broker reads. IETF RFC 7239 defines `Forwarded`;
            # `X-Forwarded-Proto` is set beside it for components that predate
            # the RFC.
            proxy_set_header Forwarded "proto=$scheme;host=$host";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Notification streams are long-lived; do not buffer them.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
