# One Andromeda broker behind a TLS-terminating reverse proxy.
#
# ETSI GS CIM 009 v1.9.1 clause 6.2 requires the API to support HTTP over TLS
# with at least TLS 1.2 (IETF RFC 5246). Andromeda serves plaintext HTTP and
# meets the clause at the deployment: nginx holds the certificate, terminates
# the client's TLS connection, and forwards to the broker's plaintext listener
# over the compose network. See docs/tls-deployment.md.
#
# The broker publishes NO host port. That is the point: only the terminator is
# reachable, which is the precondition that makes trusting the forwarded fields
# safe. Publishing the broker would both make the TLS requirement vacuous and
# hand any client control of the scheme in the broker's persisted @context URLs.
#
# Certificate (not committed -- key material does not belong in a repository):
#   mkdir -p docker/tls/certs
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout docker/tls/certs/broker.key -out docker/tls/certs/broker.crt \
#     -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#
# Bring up:
#   docker compose -f docker/tls/docker-compose.tls.yaml up -d --build
#   curl -k https://127.0.0.1:8443/ngsi-ld/v1/info/sourceIdentity
name: andromeda-tls

services:
  postgres:
    build:
      context: ../postgresql
    image: andromeda-tls-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  broker:
    build:
      context: ../..
      dockerfile: docker/andromeda/Dockerfile
    image: andromeda-tls:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__HOST: "0.0.0.0"
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
      ANDROMEDA__TENANCY__ENABLED: "true"
      ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
      # Safe here only because this service publishes no host port, so nothing
      # but the terminator can set these fields, and because nginx.conf REPLACES
      # them rather than appending to whatever a client sent.
      ANDROMEDA__HTTP__FORWARDED_HEADERS: "trusted"
      # The origin peers reach this broker at, which is the terminator's.
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "https://127.0.0.1:8443"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:tls-broker"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "tls-broker"

  terminator:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
