name: andromeda-snapshot

x-postgres-base: &postgres-base
  build:
    context: ../../../images/postgresql
  image: andromeda-snapshot-postgres:latest
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
    # A TimescaleDB scheduler per tenant database, plus their running policy jobs.
    TS_TUNE_MAX_BG_WORKERS: "128"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 40

x-broker-base: &broker-base
  build:
    context: ../../../..
    dockerfile: docker/images/andromeda/Dockerfile
  image: andromeda-snapshot:latest
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # The ETSI test-suite contexts are served from the repository: forge outages
  # would otherwise make every run depend on an external host.
  volumes:
    - ../../../../tests/contexts:/etc/andromeda/test-contexts:ro
  environment: &broker-env
    ANDROMEDA__JSONLD__PRELOAD_CONTEXTS: '{"https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite.jsonld":"/etc/andromeda/test-contexts/ngsi-ld-test-suite.jsonld","https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite-compound.jsonld":"/etc/andromeda/test-contexts/ngsi-ld-test-suite-compound.jsonld"}'
    ANDROMEDA__SERVER__HOST: "0.0.0.0"
    ANDROMEDA__TENANCY__ENABLED: "true"
    ANDROMEDA__NOTIFICATIONS__DELIVERY__MODE: "durable"
    # First retry must fit the test deadline.
    ANDROMEDA__NOTIFICATIONS__DELIVERY__BASE_BACKOFF: "1s"
    ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
    ANDROMEDA__DATABASE__MAX_CONNECTIONS: "8"
    ANDROMEDA__TENANCY__TENANT_MAX_CONNECTIONS: "2"
    ANDROMEDA__TENANCY__RUNTIME_IDLE_TTL: "60s"
    ANDROMEDA__TENANCY__RUNTIME_MAX_CACHED: "4"
    ANDROMEDA__TENANCY__JANITOR_INTERVAL: "1s"
    ANDROMEDA__TEMPORAL__EXPIRATION_CHECK_INTERVAL: "1s"
    ANDROMEDA__TEMPORAL__DEFAULT_LAST_N: "1000"
    ANDROMEDA__TEMPORAL__MAX_LAST_N: "1000"
    ANDROMEDA__SNAPSHOT__DEFAULT_LIFETIME: "1h"
    ANDROMEDA__SNAPSHOT__MAXIMUM_LIFETIME: "30days"
    ANDROMEDA__SNAPSHOT__CAPTURE_PAGE_SIZE: "250"
    ANDROMEDA__SNAPSHOT__PREPARATION_CONCURRENCY: "4"
    ANDROMEDA__SNAPSHOT__PREPARATION_LEASE: "30s"
    # Lease reclaim must fit the test wait; far below the 30s lease.
    ANDROMEDA__SNAPSHOT__PREPARATION_RECOVERY: "2s"
    ANDROMEDA__SNAPSHOT__SCOPED_OPERATION_WAIT: "30s"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

# snapshot-primary and snapshot-replica write one database. The spatial index's
# default watermark mode is the one that stays exact across replicas; it is
# pinned here so a change of default cannot silently weaken this stack
# (docs/spatial-index-consistency.md).
x-primary-env: &primary-env
  <<: *broker-env
  ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_primary"
  ANDROMEDA__SPATIAL__CONSISTENCY: "watermark"
  ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-primary"
  ANDROMEDA__IDENTITY__SOURCE_ALIAS: "snapshot-primary"

services:
  # Five brokers share this server, each holding up to 8 platform plus
  # 4 x 2 tenant connections (80), beside the harness's own pools and the
  # Snapshot preparation sessions: more than the image default of 100 holds.
  snapshot-postgres-primary:
    <<: *postgres-base
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./initdb/primary:/docker-entrypoint-initdb.d:ro
      - snapshot-postgres-primary-data:/var/lib/postgresql
    ports:
      - "5481:5432"

  snapshot-postgres-remote:
    <<: *postgres-base
    volumes:
      - ./initdb/remote:/docker-entrypoint-initdb.d:ro
      - snapshot-postgres-remote-data:/var/lib/postgresql
    ports:
      - "5482:5432"

  snapshot-primary:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *primary-env
      ANDROMEDA__SERVER__PORT: "1081"
      ANDROMEDA__SNAPSHOT__SCOPED_OPERATION_WAIT: "2s"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-primary:1081"
    ports:
      - "1081:1081"

  snapshot-replica:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
      snapshot-primary:
        condition: service_healthy
    environment:
      <<: *primary-env
      ANDROMEDA__SERVER__PORT: "1082"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-replica:1082"
    ports:
      - "1082:1082"

  snapshot-remote:
    <<: *broker-base
    depends_on:
      snapshot-postgres-remote:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1083"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@snapshot-postgres-remote:5432/snapshot_remote"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-remote"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "snapshot-remote"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-remote:1083"
    ports:
      - "1083:1083"

  snapshot-nonmultitenant:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1084"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_nonmultitenant"
      ANDROMEDA__TENANCY__ENABLED: "false"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-nonmultitenant"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "snapshot-nonmultitenant"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-nonmultitenant:1084"
    ports:
      - "1084:1084"

  snapshot-quota:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1085"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_quota"
      ANDROMEDA__TENANCY__ENABLED: "false"
      ANDROMEDA__SNAPSHOT__TENANT_COUNT_QUOTA: "3"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-quota"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "snapshot-quota"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-quota:1085"
    ports:
      - "1085:1085"

  # Deferred temporal history over the primary database: the live branch queues
  # its history, a Snapshot branch records it in the write's transaction.
  snapshot-deferred:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
      snapshot-primary:
        condition: service_healthy
    environment:
      <<: *primary-env
      # Not 1086: the xtask host broker's management plane binds it.
      ANDROMEDA__SERVER__PORT: "1088"
      ANDROMEDA__TEMPORAL__APPEND_MODE: "deferred"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-deferred:1088"
    ports:
      - "1088:1088"

volumes:
  snapshot-postgres-primary-data:
  snapshot-postgres-remote-data:
