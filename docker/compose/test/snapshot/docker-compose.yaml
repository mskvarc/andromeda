# Isolated topology for the complete Snapshot acceptance suite.
name: andromeda-snapshot

x-postgres-base: &postgres-base
  build:
    context: ../../../images/postgresql
  image: andromeda-snapshot-postgres:latest
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 40

x-broker-base: &broker-base
  build:
    context: ../../../..
    dockerfile: docker/images/andromeda/Dockerfile
  image: andromeda-snapshot:latest
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &broker-env
    ANDROMEDA__SERVER__HOST: "0.0.0.0"
    ANDROMEDA__TENANCY__ENABLED: "true"
    ANDROMEDA__NOTIFICATIONS__DELIVERY__MODE: "durable"
    # Acceptance tests assert a failed status notification is retried within a
    # bounded wait. The production 5s base backoff doubles to 10s on the first
    # retry, which the test's deadline cannot absorb under CI load; a 1s base
    # keeps the first retry near 2s without changing the exponential shape.
    ANDROMEDA__NOTIFICATIONS__DELIVERY__BASE_BACKOFF_SECS: "1"
    ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
    ANDROMEDA__DATABASE__MAX_CONNECTIONS: "8"
    ANDROMEDA__TENANCY__TENANT_MAX_CONNECTIONS: "2"
    ANDROMEDA__TENANCY__RUNTIME_IDLE_TTL_SECS: "60"
    ANDROMEDA__TENANCY__RUNTIME_MAX_CACHED: "4"
    ANDROMEDA__TENANCY__JANITOR_INTERVAL_SECS: "1"
    ANDROMEDA__TEMPORAL__EXPIRATION_CHECK_INTERVAL_SECS: "1"
    ANDROMEDA__TEMPORAL__DEFAULT_LAST_N: "1000"
    ANDROMEDA__SNAPSHOT__DEFAULT_LIFETIME_SECS: "3600"
    ANDROMEDA__SNAPSHOT__MAXIMUM_LIFETIME_SECS: "2592000"
    ANDROMEDA__SNAPSHOT__CAPTURE_PAGE_SIZE: "250"
    ANDROMEDA__SNAPSHOT__PREPARATION_CONCURRENCY: "4"
    ANDROMEDA__SNAPSHOT__PREPARATION_LEASE_SECS: "30"
    # The preparation sweep is also the recovery poll that reclaims a
    # preparation whose lease has expired (e.g. a replica that died mid-capture).
    # A foreign broker's lease expiry is only discoverable by polling, so the
    # reclamation test can only pass as fast as this cadence. The production 30s
    # default cannot meet the test's bounded reclaim wait; 2s reclaims promptly
    # and, being far below the 30s lease, never steals a live preparation.
    ANDROMEDA__SNAPSHOT__PREPARATION_RECOVERY_SECS: "2"
    ANDROMEDA__SNAPSHOT__SCOPED_OPERATION_WAIT_SECS: "30"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

x-primary-env: &primary-env
  <<: *broker-env
  ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_primary"
  ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-primary"
  ANDROMEDA__IDENTITY__SOURCE_ALIAS: "snapshot-primary"

services:
  snapshot-postgres-primary:
    <<: *postgres-base
    volumes:
      - ./initdb/primary:/docker-entrypoint-initdb.d:ro
      - snapshot-postgres-primary-data:/var/lib/postgresql
    ports:
      - "5481:5432"

  snapshot-postgres-remote:
    <<: *postgres-base
    volumes:
      - ./initdb/remote:/docker-entrypoint-initdb.d:ro
      - snapshot-postgres-remote-data:/var/lib/postgresql
    ports:
      - "5482:5432"

  snapshot-primary:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *primary-env
      ANDROMEDA__SERVER__PORT: "1081"
      ANDROMEDA__SNAPSHOT__SCOPED_OPERATION_WAIT_SECS: "2"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-primary:1081"
    ports:
      - "1081:1081"

  snapshot-replica:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
      snapshot-primary:
        condition: service_healthy
    environment:
      <<: *primary-env
      ANDROMEDA__SERVER__PORT: "1082"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-replica:1082"
    ports:
      - "1082:1082"

  snapshot-remote:
    <<: *broker-base
    depends_on:
      snapshot-postgres-remote:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1083"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@snapshot-postgres-remote:5432/snapshot_remote"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-remote"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "snapshot-remote"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-remote:1083"
    ports:
      - "1083:1083"

  snapshot-nonmultitenant:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1084"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_nonmultitenant"
      ANDROMEDA__TENANCY__ENABLED: "false"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-nonmultitenant"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "snapshot-nonmultitenant"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-nonmultitenant:1084"
    ports:
      - "1084:1084"

  snapshot-quota:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1085"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_quota"
      ANDROMEDA__TENANCY__ENABLED: "false"
      ANDROMEDA__SNAPSHOT__TENANT_COUNT_QUOTA: "3"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-quota"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "snapshot-quota"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://snapshot-quota:1085"
    ports:
      - "1085:1085"

volumes:
  snapshot-postgres-primary-data:
  snapshot-postgres-remote-data:
