# QUIC terminates TLS at the endpoint, so the broker holds the cert; TCP stays plaintext.
name: andromeda-http3

services:
  postgres:
    build:
      context: ../../../images/postgresql
    image: andromeda-http3-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # A TimescaleDB scheduler per tenant database, plus their running policy jobs.
      TS_TUNE_MAX_BG_WORKERS: "128"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  broker:
    build:
      context: ../../../..
      dockerfile: docker/images/andromeda/Dockerfile
    image: andromeda-http3:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1056:1056/tcp"
      - "1056:1056/udp"
    # The ETSI test-suite contexts are served from the repository: forge outages
    # would otherwise make every run depend on an external host.
    command: ["--configuration", "/etc/andromeda/andromeda.toml"]
    volumes:
      - ./certs:/etc/andromeda/certs:ro
      - ../../../../tests/contexts:/etc/andromeda/test-contexts:ro
      - ../preloaded-contexts.toml:/etc/andromeda/andromeda.toml:ro
    environment:
      ANDROMEDA__SERVER__HOST: "0.0.0.0"
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
      ANDROMEDA__TENANCY__MODE: "enabled"
      ANDROMEDA__OBSERVABILITY__LOG__LEVEL: "info"
      ANDROMEDA__SERVER__HTTP3__MODE: "enabled"
      ANDROMEDA__TLS__CERTIFICATE: "/etc/andromeda/certs/broker.crt"
      ANDROMEDA__TLS__PRIVATE_KEY: "/etc/andromeda/certs/broker.key"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:http3-broker"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "http3-broker"
    healthcheck:
      # localhost resolves to ::1 first.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1056/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
