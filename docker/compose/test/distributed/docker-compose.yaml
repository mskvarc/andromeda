name: andromeda-distributed

x-postgres-base: &postgres-base
  build:
    context: ../../../images/postgresql
  image: andromeda-distributed-postgres:latest
  # postgres-a serves broker-a and its replica broker-a2: 2 x (16 platform +
  # tenants x 8) with the default tenant, the four leased test tenants and the
  # tenant-specific suites' tenants live at once, plus the harness pools.
  command: ["postgres", "-c", "max_connections=400"]
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
    # A TimescaleDB scheduler per tenant database, plus their running policy jobs.
    TS_TUNE_MAX_BG_WORKERS: "128"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 40

x-broker-base: &broker-base
  build:
    context: ../../../..
    dockerfile: docker/images/andromeda/Dockerfile
  image: andromeda-distributed:latest
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # The ETSI test-suite contexts are served from the repository: forge outages
  # would otherwise make every run depend on an external host.
  volumes:
    - ../../../../tests/contexts:/etc/andromeda/test-contexts:ro
  environment: &broker-env
    ANDROMEDA__JSONLD__PRELOAD_CONTEXTS: '{"https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite.jsonld":"/etc/andromeda/test-contexts/ngsi-ld-test-suite.jsonld","https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite-compound.jsonld":"/etc/andromeda/test-contexts/ngsi-ld-test-suite-compound.jsonld"}'
    ANDROMEDA__SERVER__HOST: "0.0.0.0"
    ANDROMEDA__SERVER__PORT: "1056"
    ANDROMEDA__TENANCY__ENABLED: "true"
    ANDROMEDA__NOTIFICATIONS__DELIVERY__MODE: "durable"
    ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
    ANDROMEDA__DATABASE__MAX_CONNECTIONS: "16"
    ANDROMEDA__TENANCY__TENANT_MAX_CONNECTIONS: "8"
    ANDROMEDA__IDENTITY__SOURCE_EXTRAS: '{"deployment":"distop"}'
    ANDROMEDA__TEMPORAL__EXPIRATION_CHECK_INTERVAL: "5s"
  healthcheck:
    # localhost resolves to ::1 first.
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1056/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

# broker-a2 replicates broker-a: same identity, same database. Two processes
# write one database; the spatial index's default watermark mode is the one that
# stays exact across replicas, and it is pinned here so a change of default
# cannot silently weaken this stack (docs/spatial-index-consistency.md).
x-broker-a-env: &broker-a-env
  <<: *broker-env
  ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-a:5432/broker_a"
  ANDROMEDA__SPATIAL__CONSISTENCY: "watermark"
  ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-a"
  ANDROMEDA__IDENTITY__SOURCE_ALIAS: "broker-a"

services:
  postgres-a:
    <<: *postgres-base
    volumes:
      - ./initdb/a:/docker-entrypoint-initdb.d:ro
      - postgres-a-data:/var/lib/postgresql
    ports:
      - "5442:5432"

  postgres-b:
    <<: *postgres-base
    volumes:
      - ./initdb/b:/docker-entrypoint-initdb.d:ro
      - postgres-b-data:/var/lib/postgresql
    ports:
      - "5443:5432"

  postgres-c:
    <<: *postgres-base
    volumes:
      - ./initdb/c:/docker-entrypoint-initdb.d:ro
      - postgres-c-data:/var/lib/postgresql
    ports:
      - "5444:5432"

  broker-a:
    <<: *broker-base
    depends_on:
      postgres-a:
        condition: service_healthy
    environment:
      <<: *broker-a-env
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://broker-a:1056"
    ports:
      - "1061:1056"

  broker-a2:
    <<: *broker-base
    depends_on:
      postgres-a:
        condition: service_healthy
      # Avoid racing broker-a on first-boot migration.
      broker-a:
        condition: service_healthy
    environment:
      <<: *broker-a-env
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://broker-a2:1056"
    ports:
      - "1064:1056"

  broker-b:
    <<: *broker-base
    depends_on:
      postgres-b:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-b:5432/broker_b"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-b"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "broker-b"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://broker-b:1056"
    ports:
      - "1062:1056"

  broker-c:
    <<: *broker-base
    depends_on:
      postgres-c:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-c:5432/broker_c"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-c"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "broker-c"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "http://broker-c:1056"
    ports:
      - "1063:1056"

volumes:
  postgres-a-data:
  postgres-b-data:
  postgres-c-data:
