name: andromeda-extensions

x-broker-base: &broker-base
  build:
    context: ../../../..
    dockerfile: docker/images/andromeda/Dockerfile
  image: andromeda-extensions:latest
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    extensions-postgres:
      condition: service_healthy
  # The ETSI test-suite contexts are served from the repository: forge outages
  # would otherwise make every run depend on an external host.
  volumes:
    - ../../../../tests/contexts:/etc/andromeda/test-contexts:ro
  environment: &broker-env
    ANDROMEDA__JSONLD__PRELOAD_CONTEXTS: '{"https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite.jsonld":"/etc/andromeda/test-contexts/ngsi-ld-test-suite.jsonld","https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite-compound.jsonld":"/etc/andromeda/test-contexts/ngsi-ld-test-suite-compound.jsonld"}'
    ANDROMEDA__SERVER__HOST: "0.0.0.0"
    ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@extensions-postgres:5432/postgres"
    ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

services:
  extensions-postgres:
    build:
      context: ../../../images/postgresql
    image: andromeda-extensions-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # A TimescaleDB scheduler per tenant database, plus their running policy jobs.
      TS_TUNE_MAX_BG_WORKERS: "128"
    ports:
      - "5491:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  # Small bounds make TooManyResults reachable.
  extensions-enabled:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1091"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY: "enabled"
      ANDROMEDA__EXTENSIONS__PURGE_DATASET_SCOPE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_LINKED_RETRIEVAL: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY_MAX_MATCHES: "2"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING_MAX_GROUPS: "3"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:extensions-enabled"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "extensions-enabled"
    ports:
      - "1091:1091"

  # conformance_mode must override the flags.
  extensions-conformance:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1092"
      ANDROMEDA__EXTENSIONS__CONFORMANCE_MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY: "enabled"
      ANDROMEDA__EXTENSIONS__PURGE_DATASET_SCOPE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_LINKED_RETRIEVAL: "enabled"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:extensions-conformance"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "extensions-conformance"
    ports:
      - "1092:1092"
