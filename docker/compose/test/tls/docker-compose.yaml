name: andromeda-tls

services:
  postgres:
    build:
      context: ../../../images/postgresql
    image: andromeda-tls-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  broker:
    build:
      context: ../../../..
      dockerfile: docker/images/andromeda/Dockerfile
    image: andromeda-tls:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__HOST: "0.0.0.0"
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
      ANDROMEDA__TENANCY__ENABLED: "true"
      ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
      # Safe only because no host port is published and nginx replaces these headers.
      ANDROMEDA__HTTP__FORWARDED_HEADERS: "trusted"
      ANDROMEDA__IDENTITY__ADVERTISED_URL: "https://127.0.0.1:8443"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:tls-broker"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "tls-broker"

  terminator:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
