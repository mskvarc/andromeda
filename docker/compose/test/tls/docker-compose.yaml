# Both clause 6.2 models: brokers terminating TLS natively, and one behind nginx.
# ./certs is committed test material (see docs/tls-deployment.md).
name: andromeda-tls

# The ETSI test-suite contexts are served from the repository: forge outages
# would otherwise make every run depend on an external host.
x-test-contexts-mount: &test-contexts-mount ../../../../tests/contexts:/etc/andromeda/test-contexts:ro

x-broker-base: &broker-base
  build:
    context: ../../../..
    dockerfile: docker/images/andromeda/Dockerfile
  image: andromeda-tls:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  command: ["--configuration", "/etc/andromeda/andromeda.toml"]
  volumes:
    - *test-contexts-mount
    - ../preloaded-contexts.toml:/etc/andromeda/andromeda.toml:ro
  environment: &broker-env
    ANDROMEDA__SERVER__HOST: "0.0.0.0"
    ANDROMEDA__SERVER__PORT: "1056"
    ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
    # Four brokers share the default max_connections.
    ANDROMEDA__DATABASE__MAX_CONNECTIONS: "8"
    ANDROMEDA__OBSERVABILITY__LOG__LEVEL: "info"

# A native-TLS broker presenting the shared identity mounted at /etc/andromeda/tls.
x-native-env: &native-env
  <<: *broker-env
  ANDROMEDA__SERVER__TRANSPORT: "tls"
  ANDROMEDA__TLS__CERTIFICATE: "/etc/andromeda/tls/broker.crt"
  ANDROMEDA__TLS__PRIVATE_KEY: "/etc/andromeda/tls/broker.key"
  ANDROMEDA__TLS__RELOAD_SETTLE_AFTER: "500ms"

services:
  postgres:
    build:
      context: ../../../images/postgresql
    image: andromeda-tls-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # A TimescaleDB scheduler per tenant database, plus their running policy jobs.
      TS_TUNE_MAX_BG_WORKERS: "128"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  # Behind the terminator: publishes no port, so trusting the forwarded fields is safe.
  broker:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__TENANCY__MODE: "enabled"
      # Safe only because no host port is published and nginx replaces these headers.
      ANDROMEDA__HTTP__FORWARDED__TRUST: "any"
      ANDROMEDA__SERVER__PUBLIC_URL: "https://127.0.0.1:8443"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:tls-broker"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "tls-broker"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1056/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  terminator:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

  # TLS 1.2 floor, optional client certificates, and a TLS management listener.
  native-broker:
    <<: *broker-base
    environment:
      <<: *native-env
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__MODE: "optional"
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__CA: "/etc/andromeda/tls/client-ca.crt"
      ANDROMEDA__MANAGEMENT__TRANSPORT: "tls"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:tls-native-broker"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "tls-native-broker"
    ports:
      - "1156:1056"
      - "1186:1086"
    volumes:
      - *test-contexts-mount
      - ./certs:/etc/andromeda/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/etc/andromeda/tls/ca.crt https://localhost:1056/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # TLS 1.3 only, and a client certificate from the client CA is required.
  mutual-broker:
    <<: *broker-base
    environment:
      <<: *native-env
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__MODE: "required"
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__CA: "/etc/andromeda/tls/client-ca.crt"
      ANDROMEDA__TLS__MINIMUM_PROTOCOL_VERSION: "tls1.3"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:tls-mutual-broker"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "tls-mutual-broker"
    ports:
      - "1157:1056"
    volumes:
      - *test-contexts-mount
      - ./certs:/etc/andromeda/tls:ro
    healthcheck:
      # The plaintext management listener answers without a client certificate.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1086/readyz >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # Reads its own copy of the identity, which the suite rewrites to rotate it.
  rotating-broker:
    <<: *broker-base
    environment:
      <<: *native-env
      ANDROMEDA__TLS__CERTIFICATE: "/etc/andromeda/tls/tls.crt"
      ANDROMEDA__TLS__PRIVATE_KEY: "/etc/andromeda/tls/tls.key"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:tls-rotating-broker"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "tls-rotating-broker"
    ports:
      - "1158:1056"
    volumes:
      - *test-contexts-mount
      - ./certs/rotating:/etc/andromeda/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1086/readyz >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
