events {}

http {
    server {
        listen 8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/broker.crt;
        ssl_certificate_key /etc/nginx/certs/broker.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 64m;

        location / {
            proxy_pass http://broker:1056;
            proxy_http_version 1.1;

            # $host drops the port from broker-minted URLs.
            proxy_set_header Host $http_host;

            # Replaces, never appends: client values cannot reach the broker.
            proxy_set_header Forwarded "proto=$scheme;host=$http_host";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Notification streams.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
