name: andromeda-base

x-broker-base: &broker-base
  build:
    context: ../../../..
    dockerfile: docker/images/andromeda/Dockerfile
  image: andromeda-base:latest
  restart: unless-stopped
  profiles:
    - broker
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
  environment: &broker-env
    ANDROMEDA__SERVER__HOST: "0.0.0.0"
    ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
    ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
    # Small enough to hit the 206 cut, forwards without lastN and backwards
    # with a lastN above the maximum.
    ANDROMEDA__TEMPORAL__DEFAULT_LAST_N: "19"
    ANDROMEDA__TEMPORAL__MAX_LAST_N: "19"
    # Tracked by EXPIRY_SWEEP_INTERVAL in tests/expiration.
    ANDROMEDA__TEMPORAL__EXPIRATION_CHECK_INTERVAL: "1s"
    # Broker share: 2 x (16 + 4 x 4) = 64 of max_connections.
    ANDROMEDA__DATABASE__MAX_CONNECTIONS: "16"
    ANDROMEDA__TENANCY__TENANT_MAX_CONNECTIONS: "4"
    ANDROMEDA__TENANCY__RUNTIME_IDLE_TTL: "60s"
    ANDROMEDA__TENANCY__RUNTIME_MAX_CACHED: "4"
    ANDROMEDA__TENANCY__JANITOR_INTERVAL: "1s"
    # Harness suspends tenants before dropping their databases.
    ANDROMEDA__EXTENSIONS__TENANT_MANAGEMENT: "enabled"
  healthcheck:
    # localhost resolves to ::1 first.
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

services:
  postgres:
    build:
      context: ../../../images/postgresql
    image: andromeda-base-postgres:latest
    # Parallel suites each provision a private tenant.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    ports:
      - "1883:1883"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
        ]
      interval: 2s
      timeout: 5s
      retries: 10

  mosquitto-auth:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto_with_auth.conf"]
    ports:
      - "9883:9883"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
          "-p",
          "9883",
          "-u",
          "user_with_password",
          "-P",
          "password",
        ]
      interval: 2s
      timeout: 5s
      retries: 10

  broker:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1056"
    ports:
      - "1056:1056"

  # Required by tests/regression/forwarded_protocol_origin.rs.
  broker-trusted:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1057"
      ANDROMEDA__HTTP__FORWARDED_HEADERS: "trusted"
    ports:
      - "1057:1057"
