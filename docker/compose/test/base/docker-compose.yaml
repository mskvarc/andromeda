# Base integration tier: shared infrastructure plus the two host-facing brokers
# every non-distributed suite runs against.
#
# The infrastructure services (postgres, mosquitto, mosquitto-auth) are
# unprofiled and always start. The two brokers sit behind `profiles: [broker]`,
# so a plain `up` brings up only the infrastructure for a host-broker dev loop,
# and `--profile broker up` brings up the containerized brokers as well:
#
#   docker compose -f docker/compose/test/base/docker-compose.yaml --profile broker up --build -d --wait
#   ANDROMEDA_TEST_BROKER_URL=http://127.0.0.1:1056/ngsi-ld/v1/ \
#   ANDROMEDA_TEST_TRUSTED_PROXY_BROKER_URL=http://127.0.0.1:1057/ngsi-ld/v1/ \
#   ANDROMEDA_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres \
#   ANDROMEDA_TEST_CALLBACK_HOST=host.docker.internal \
#   cargo test --test entity -- --test-threads=1
#   docker compose -f docker/compose/test/base/docker-compose.yaml --profile broker down -v
#
# `cargo xtask itest --stack base` drives this lifecycle end to end.
name: andromeda-base

x-broker-base: &broker-base
  build:
    context: ../../../..
    dockerfile: docker/images/andromeda/Dockerfile
  image: andromeda-base:latest
  restart: unless-stopped
  profiles:
    - broker
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
  environment: &broker-env
    ANDROMEDA__SERVER__HOST: "0.0.0.0"
    ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
    ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
    # The tier pins default_last_n to 19 so the temporal-pagination regressions
    # (SYSTEM_LAST_N_CAP) exercise the 206/Content-Range cut; the broker's own
    # default is a larger production page.
    ANDROMEDA__TEMPORAL__DEFAULT_LAST_N: "19"
    # The expiry sweep runs on this interval; the base default is 30s, which
    # would make the expiration suite's worker tests wait a whole sweep. 1s keeps
    # them fast without changing behaviour: the sweep never removes anything
    # before its expiresAt, it only shortens the latency after expiry. The
    # EXPIRY_SWEEP_INTERVAL constant in tests/expiration/main.rs tracks this.
    ANDROMEDA__TEMPORAL__EXPIRATION_CHECK_INTERVAL_SECS: "1"
    # Two brokers share this one Postgres, whose default is max_connections=100.
    # The broker's own defaults (database.max_connections=32,
    # tenancy.tenant_max_connections=16) would let the pair plus the harness pools
    # exhaust the server once the multitenancy suites cache a few tenant runtimes,
    # surfacing as PoolTimedOut across the back half of the tier. Bounding the main
    # pool and the cached tenant runtimes keeps 2 x (16 + 4 x 4) well under 100.
    ANDROMEDA__DATABASE__MAX_CONNECTIONS: "16"
    ANDROMEDA__TENANCY__TENANT_MAX_CONNECTIONS: "4"
    ANDROMEDA__TENANCY__RUNTIME_IDLE_TTL_SECS: "60"
    ANDROMEDA__TENANCY__RUNTIME_MAX_CACHED: "4"
    ANDROMEDA__TENANCY__JANITOR_INTERVAL_SECS: "1"
    # The tenant-management extension (non-standard) backs the tenant_management
    # suite and the multitenancy tenant-collection assertion; the cleanup between
    # runs suspends tenants through it to close their pools before the databases
    # are dropped.
    ANDROMEDA__EXTENSIONS__TENANT_MANAGEMENT: "enabled"
  healthcheck:
    # 127.0.0.1, not localhost: the broker listens on IPv4 0.0.0.0, but localhost
    # resolves to IPv6 ::1 first in the image, giving a false "connection refused".
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

services:
  postgres:
    build:
      context: ../../../images/postgresql
    image: andromeda-base-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    ports:
      - "1883:1883"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
        ]
      interval: 2s
      timeout: 5s
      retries: 10

  mosquitto-auth:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto_with_auth.conf"]
    ports:
      - "9883:9883"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
          "-p",
          "9883",
          "-u",
          "user_with_password",
          "-P",
          "password",
        ]
      interval: 2s
      timeout: 5s
      retries: 10

  # Broker under test on 1056.
  broker:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1056"
    ports:
      - "1056:1056"

  # Trusted-edge half on 1057: identical to `broker` but treats forwarding
  # headers as trusted. `tests/regression/forwarded_protocol_origin.rs` drives
  # both halves and fails rather than skips when this one is absent.
  broker-trusted:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1057"
      ANDROMEDA__HTTP__FORWARDED_HEADERS: "trusted"
    ports:
      - "1057:1057"
