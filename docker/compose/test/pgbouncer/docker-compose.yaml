# 3 pooled brokers + 1 direct baseline.
name: andromeda-pgbouncer

x-broker-env: &broker-env
  ANDROMEDA__SERVER__HOST: "0.0.0.0"
  # Provisioning, migration and maintenance bypass the pooler.
  ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
  ANDROMEDA__DATABASE__MAX_CONNECTIONS: "16"
  ANDROMEDA__TENANCY__RUNTIME_IDLE_TTL: "120s"
  ANDROMEDA__TENANCY__JANITOR_INTERVAL: "5s"
  # Re-wake must be observable within a test.
  ANDROMEDA__TENANCY__MIN_DORMANCY: "3s"
  ANDROMEDA__EXTENSIONS__TENANT_MANAGEMENT: "enabled"
  # Suites scrape GET /metrics on the published data-plane port.
  ANDROMEDA__MANAGEMENT__MODE: "merged"
  ANDROMEDA__MANAGEMENT__METRICS: "prometheus"
  ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
  # Every broker here writes the same tenant databases, so the spatial index
  # runs in watermark mode (docs/spatial-index-consistency.md).
  ANDROMEDA__SPATIAL__CONSISTENCY: "watermark"

# Pooled tenant pools size from the pooler section, not tenancy.
x-pooled-env: &pooled-env
  ANDROMEDA__DATABASE__POOLER__URL: "postgres://postgres:postgres@pgbouncer:6432/postgres"
  ANDROMEDA__DATABASE__POOLER__TENANT_MAX_CONNECTIONS: "2"

x-broker-features: &broker-features
  ANDROMEDA__ATOMIC_WRITE__BULK_MODE: "copy-staging"
  ANDROMEDA__NOTIFICATIONS__DELIVERY__MODE: "durable"
  ANDROMEDA__DATABASE__MAINTENANCE__MODE: "automatic"
  ANDROMEDA__DATABASE__MAINTENANCE__PROFILE: "responsive"

services:
  postgres:
    build:
      context: ../../../images/postgresql
    image: andromeda-pgbouncer-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    # One Timescale scheduler per tenant database.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "max_worker_processes=512"
      - "-c"
      - "timescaledb.max_background_workers=400"
    ports:
      - "5467:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  # Image env config lacks max_prepared_statements.
  pgbouncer:
    image: pgbouncer/pgbouncer:1.25.2
    entrypoint: ["/opt/pgbouncer/pgbouncer"]
    command: ["/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6467:6432"
    healthcheck:
      # localhost resolves to ::1 first.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  broker:
    build:
      context: ../../../..
      dockerfile: docker/images/andromeda/Dockerfile
    image: andromeda-pgbouncer:latest
    restart: unless-stopped
    profiles: [broker]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: [*broker-env, *broker-features, *pooled-env]
      ANDROMEDA__SERVER__PORT: "1067"
      PGAPPNAME: "broker"
      ANDROMEDA__TENANCY__RUNTIME_MAX_CACHED: "32"
    ports:
      - "1067:1067"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # Pooled replica: shared backend budget.
  broker-replica:
    image: andromeda-pgbouncer:latest
    restart: unless-stopped
    profiles: [broker]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: [*broker-env, *broker-features, *pooled-env]
      ANDROMEDA__SERVER__PORT: "1068"
      PGAPPNAME: "broker-replica"
      ANDROMEDA__TENANCY__RUNTIME_MAX_CACHED: "32"
    ports:
      - "1068:1068"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # Every tenant resident: idle-tenant cost.
  broker-wide:
    image: andromeda-pgbouncer:latest
    restart: unless-stopped
    profiles: [broker]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: [*broker-env, *pooled-env]
      ANDROMEDA__SERVER__PORT: "1069"
      PGAPPNAME: "broker-wide"
      ANDROMEDA__TENANCY__RUNTIME_MAX_CACHED: "1000"
    ports:
      - "1069:1069"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  # Un-pooled baseline.
  broker-direct:
    image: andromeda-pgbouncer:latest
    restart: unless-stopped
    profiles: [broker]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1070"
      PGAPPNAME: "broker-direct"
      # Un-pooled, each tenant pool is a real backend pool.
      ANDROMEDA__TENANCY__TENANT_MAX_CONNECTIONS: "4"
      ANDROMEDA__TENANCY__RUNTIME_MAX_CACHED: "32"
    ports:
      - "1070:1070"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
