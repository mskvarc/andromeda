[databases]
;; One pool per tenant database, all as postgres.
* = host=postgres port=5432 user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

pool_mode = transaction

auth_type = any
admin_users = postgres
stats_users = postgres

max_client_conn = 5000

default_pool_size = 2
min_pool_size = 0
reserve_pool_size = 1
reserve_pool_timeout = 3

server_idle_timeout = 5

;; Production sizing: docs/pgbouncer-deployment.md.
;; Fleet-wide cap: every database shares user postgres.
max_user_connections = 120

;; Per-database backstop, not the global cap.
max_db_connections = 20

;; Small to force eviction.
max_prepared_statements = 32

;; search_path deliberately absent: rejected, never silently dropped.
ignore_startup_parameters = extra_float_digits,IntervalStyle,DateStyle,TimeZone,client_encoding

;; Long enough to absorb a provisioning burst and a short PAUSE: a transaction
;; queued behind a saturated pool waits for a server connection instead of being
;; shed, which is what keeps a never-touched tenant from being starved while the
;; global cap is held by resident tenants. Overload beyond it is still shed
;; (broker answers 503 + Retry-After).
query_wait_timeout = 15
