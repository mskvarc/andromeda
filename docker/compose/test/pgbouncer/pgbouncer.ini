;; PgBouncer configuration for the transaction-pooling test tier.
;;
;; Mounted read-only into the official pgbouncer/pgbouncer image, which is run
;; against this file directly (the compose file overrides the image entrypoint
;; so its env-var config generation is bypassed). The image's env interface has
;; no knob for max_prepared_statements, which the broker needs, so the whole
;; file is supplied verbatim instead.

[databases]
;; One wildcard routes every database name a client asks for to PostgreSQL under
;; the same name. The broker creates a PostgreSQL database per named tenant at
;; runtime and addresses it by name, so this entry serves every tenant with no
;; reload and no per-tenant configuration. A PostgreSQL connection is bound to
;; one database, so the pooler keeps a separate transaction pool per database;
;; the forced `user=postgres` is the single shared login every tenant database
;; uses (auth_type = any below ignores the client-supplied user).
* = host=postgres port=5432 user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
;; Run as uid 70 (the image's postgres user); /tmp is writable for the socket.
unix_socket_dir = /tmp

;; Transaction pooling: a server backend is leased per transaction and returned
;; at commit, so many client connections multiplex onto few backends. The
;; broker's request path is transaction-scoped and safe under this mode;
;; provisioning, migration and maintenance bypass the pooler and reach PostgreSQL
;; directly, because each keeps session state a per-transaction backend breaks.
pool_mode = transaction

;; `any` accepts every client without a password and connects to PostgreSQL as
;; the forced `user=postgres` in the wildcard above; PostgreSQL trusts that
;; connection on the internal test network. `admin_users`/`stats_users` let the
;; test drive the admin console (SHOW POOLS/SERVERS, PAUSE/RESUME/RECONNECT/KILL)
;; on the `pgbouncer` pseudo-database, published on host port 6467.
auth_type = any
admin_users = postgres
stats_users = postgres

;; Client connections the pooler accepts. The broker opens up to
;; database.max_connections + cached_tenants * tenant_max_connections of these;
;; they are cheap because they multiplex onto the small server pools below.
max_client_conn = 5000

;; Server connections per (user, database) pair, i.e. per tenant database. This
;; is the multiplexing ratio: the broker opens up to tenant_max_connections
;; client connections to a tenant's pool, but the pooler serves them from at most
;; this many PostgreSQL backends. Kept small because a tenant rarely has more than
;; a couple of transactions in flight at once, so a broker's backend demand is
;; bounded by active_tenants * default_pool_size rather than by its client count.
default_pool_size = 2
min_pool_size = 0
reserve_pool_size = 1
reserve_pool_timeout = 3

;; A tenant evicted from the broker's runtime cache closes its client connections;
;; a short server-idle timeout then releases that tenant's PostgreSQL backends
;; promptly, so idle tenants do not hold backends. Every cached tenant used to
;; issue background SQL forever, which pinned a backend per tenant and defeated
;; this timeout; the dormant-tenant and quiet-idle work stop that, so a short
;; timeout now actually releases backends.
server_idle_timeout = 5

;; Production sizing (backend budget, why max_user_connections is the ceiling,
;; raising runtime_max_cached in pooled mode) is in docs/pgbouncer-deployment.md;
;; the values here are tuned small to stress the pooler within a test's lifetime.
;;
;; GLOBAL server-connection ceiling. Every tenant database is served as the one
;; forced login `user=postgres`, so `max_user_connections` -- the cap on server
;; connections for a single (user) across ALL databases -- is the true fleet-wide
;; backend cap for this deployment. It is the ceiling the tier proves the broker
;; stays under: with it set below the un-pooled request demand, the pooler is what
;; keeps the fleet's PostgreSQL backends bounded as the tenant count grows.
max_user_connections = 120

;; Per-database ceiling on server connections: a backstop above
;; default_pool_size + reserve_pool_size so no single tenant database can
;; monopolise the shared `max_user_connections` budget above. This is a
;; per-database limit, NOT the global cap.
max_db_connections = 20

;; Protocol-level prepared-statement tracking (PgBouncer >= 1.21). sqlx uses
;; server-side prepared statements and caches them per connection; without this
;; the cached statement would be missing on the next transaction's backend under
;; transaction pooling. Deliberately small here so the tier exercises statement
;; eviction and re-preparation rather than a cache large enough to never evict.
max_prepared_statements = 32

;; Formatting-only GUCs some clients send at startup; ignored so the pooler does
;; not reject the connection. search_path is deliberately not ignored: the broker
;; qualifies snapshot-schema access explicitly and never relies on a forwarded
;; search_path being dropped silently.
ignore_startup_parameters = extra_float_digits,IntervalStyle,DateStyle,TimeZone,client_encoding

;; A client whose transaction cannot be assigned a server backend within this
;; many seconds is disconnected rather than left to hang, so pool saturation
;; surfaces to the broker as a fast, classifiable failure.
query_wait_timeout = 15
