# The ETSI test-suite contexts every test broker reads from the mounted
# repository copy instead of downloading them, so a forge outage does not
# fail a run. A list of tables is set in a configuration file only.

[[jsonld.preloaded_contexts]]
url = "https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite.jsonld"
path = "/etc/andromeda/test-contexts/ngsi-ld-test-suite.jsonld"

[[jsonld.preloaded_contexts]]
url = "https://forge.etsi.org/rep/cim/ngsi-ld-test-suite/-/raw/develop/resources/jsonld-contexts/ngsi-ld-test-suite-compound.jsonld"
path = "/etc/andromeda/test-contexts/ngsi-ld-test-suite-compound.jsonld"
