services:
  postgres:
    image: ${ANDROMEDA_POSTGRES_IMAGE:-andromeda-postgresql:local}
    build:
      context: ../../images/postgresql
    # The broker's default database.url names the image's default role and database with this password.
    environment:
      POSTGRES_PASSWORD: andromeda
    # ETSI keeps many tenant pools alive.
    command: ["postgres", "-c", "max_connections=300"]
    # Dynamic shared memory grows with the tenant databases; Docker's default is 64 MB.
    shm_size: 1gb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andromeda"]
      interval: 2s
      timeout: 5s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    ports:
      - "1883:1883"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
        ]
      interval: 2s
      timeout: 5s
      retries: 10

  mosquitto-auth:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto_with_auth.conf"]
    ports:
      - "9883:9883"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
          "-p",
          "9883",
          "-u",
          "user_with_password",
          "-P",
          "password",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
