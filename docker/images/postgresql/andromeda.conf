# Fixed server policy, the same on every machine. Included after the values
# timescaledb-tune writes and before postgresql.auto.conf, so ALTER SYSTEM
# overrides it. Sets nothing the tuner derives from memory, CPUs, connections
# or disk, which it would otherwise silently undo.

# Reporting and logging
# %d names the database, and with one database per tenant, the tenant.
log_line_prefix = '%m [%p] %q%u@%d '
log_autovacuum_min_duration = 0
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_min_duration_statement = 1s
lc_messages = 'C'

# Statistics
# Generated statements are longer than the 1kB default.
track_activity_query_size = 8kB
track_io_timing = on
track_wal_io_timing = on
# Entries are kept per database, so one database per tenant multiplies the
# statements tracked. About 8MB of shared memory.
pg_stat_statements.max = 20000

# Storage
# Costs for solid-state storage, the only storage the image is tuned for.
random_page_cost = 1.1
effective_io_concurrency = 256
maintenance_io_concurrency = 256

# Write-ahead log
wal_compression = lz4
# Fewer timed checkpoints, each followed by a burst of full-page images.
checkpoint_timeout = 15min

# Autovacuum
autovacuum_vacuum_cost_limit = 3000
# The launcher visits every database once per nap, so with one database per
# tenant its cost grows with the tenants. With 300 idle tenant databases the
# tuner's 10s keeps the launcher starting workers without pause, and 1min cuts
# its CPU by a third to a half. A delivery queue under steady load then peaks
# under 10% larger, with the same delivery latency.
autovacuum_naptime = 1min

# Connections and sessions
# Slots only superusers and members of pg_use_reserved_connections may take,
# so an administrative or maintenance role still connects once a broker's
# pools hold every other slot.
reserved_connections = 3
idle_in_transaction_session_timeout = 10min
# Closes a forgotten interactive or tooling session before it holds a slot,
# reserved ones included, indefinitely. The broker's pools close a connection
# idle for 30 seconds and a transaction pooler's default server_idle_timeout is
# 10 minutes, so neither reaches it.
idle_session_timeout = 1h
# Cancels a statement whose client has gone instead of running it to the end.
client_connection_check_interval = 2s

# TimescaleDB
timescaledb.telemetry_level = off
