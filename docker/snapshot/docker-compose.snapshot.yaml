# Isolated topology for the complete Snapshot acceptance suite.
name: andromeda-snapshot

x-postgres-base: &postgres-base
  build:
    context: ../postgresql
  image: andromeda-snapshot-postgres:latest
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 40

x-broker-base: &broker-base
  build:
    context: ../..
    dockerfile: docker/andromeda/Dockerfile
  image: andromeda-snapshot:latest
  command: ["run"]
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &broker-env
    ANDROMEDA_SERVER_HOST: "0.0.0.0"
    ANDROMEDA_TENANCY_ENABLED: "true"
    ANDROMEDA_NOTIFICATION_DELIVERY_ENABLED: "true"
    ANDROMEDA_OBSERVABILITY_LOG_LEVEL: "info"
    ANDROMEDA_DATABASE_MAX_CONNECTIONS: "8"
    ANDROMEDA_TENANCY_TENANT_MAX_CONNECTIONS: "2"
    ANDROMEDA_TENANCY_RUNTIME_IDLE_TTL_SECONDS: "60"
    ANDROMEDA_TENANCY_RUNTIME_MAX_CACHED: "4"
    ANDROMEDA_TENANCY_JANITOR_INTERVAL_SECONDS: "1"
    ANDROMEDA_TEMPORAL_EXPIRATION_CHECK_INTERVAL_SECS: "1"
    ANDROMEDA_TEMPORAL_DEFAULT_LAST_N: "1000"
    ANDROMEDA_SNAPSHOT_DEFAULT_LIFETIME_SECS: "3600"
    ANDROMEDA_SNAPSHOT_MAXIMUM_LIFETIME_SECS: "2592000"
    ANDROMEDA_SNAPSHOT_CAPTURE_PAGE_SIZE: "250"
    ANDROMEDA_SNAPSHOT_PREPARATION_CONCURRENCY: "4"
    ANDROMEDA_SNAPSHOT_PREPARATION_LEASE_SECS: "30"
    ANDROMEDA_SNAPSHOT_SCOPED_OPERATION_WAIT_SECS: "30"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA_SERVER_PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

x-primary-env: &primary-env
  <<: *broker-env
  ANDROMEDA_DATABASE_URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_primary"
  ANDROMEDA_INFO_SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-primary"
  ANDROMEDA_INFO_SOURCE_ALIAS: "snapshot-primary"

services:
  snapshot-postgres-primary:
    <<: *postgres-base
    volumes:
      - ./initdb/primary:/docker-entrypoint-initdb.d:ro
      - snapshot-postgres-primary-data:/var/lib/postgresql/data
    ports:
      - "5481:5432"

  snapshot-postgres-remote:
    <<: *postgres-base
    volumes:
      - ./initdb/remote:/docker-entrypoint-initdb.d:ro
      - snapshot-postgres-remote-data:/var/lib/postgresql/data
    ports:
      - "5482:5432"

  snapshot-primary:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *primary-env
      ANDROMEDA_SERVER_PORT: "1081"
      ANDROMEDA_SNAPSHOT_SCOPED_OPERATION_WAIT_SECS: "2"
      ANDROMEDA_INFO_ADVERTISED_URL: "http://snapshot-primary:1081"
    ports:
      - "1081:1081"

  snapshot-replica:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
      snapshot-primary:
        condition: service_healthy
    environment:
      <<: *primary-env
      ANDROMEDA_SERVER_PORT: "1082"
      ANDROMEDA_INFO_ADVERTISED_URL: "http://snapshot-replica:1082"
    ports:
      - "1082:1082"

  snapshot-remote:
    <<: *broker-base
    depends_on:
      snapshot-postgres-remote:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA_SERVER_PORT: "1083"
      ANDROMEDA_DATABASE_URL: "postgres://postgres:postgres@snapshot-postgres-remote:5432/snapshot_remote"
      ANDROMEDA_INFO_SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-remote"
      ANDROMEDA_INFO_SOURCE_ALIAS: "snapshot-remote"
      ANDROMEDA_INFO_ADVERTISED_URL: "http://snapshot-remote:1083"
    ports:
      - "1083:1083"

  snapshot-nonmultitenant:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA_SERVER_PORT: "1084"
      ANDROMEDA_DATABASE_URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_nonmultitenant"
      ANDROMEDA_TENANCY_ENABLED: "false"
      ANDROMEDA_INFO_SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-nonmultitenant"
      ANDROMEDA_INFO_SOURCE_ALIAS: "snapshot-nonmultitenant"
      ANDROMEDA_INFO_ADVERTISED_URL: "http://snapshot-nonmultitenant:1084"
    ports:
      - "1084:1084"

  snapshot-quota:
    <<: *broker-base
    depends_on:
      snapshot-postgres-primary:
        condition: service_healthy
    environment:
      <<: *broker-env
      ANDROMEDA_SERVER_PORT: "1085"
      ANDROMEDA_DATABASE_URL: "postgres://postgres:postgres@snapshot-postgres-primary:5432/snapshot_quota"
      ANDROMEDA_TENANCY_ENABLED: "false"
      ANDROMEDA_SNAPSHOT_TENANT_COUNT_QUOTA: "3"
      ANDROMEDA_INFO_SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:snapshot-quota"
      ANDROMEDA_INFO_SOURCE_ALIAS: "snapshot-quota"
      ANDROMEDA_INFO_ADVERTISED_URL: "http://snapshot-quota:1085"
    ports:
      - "1085:1085"

volumes:
  snapshot-postgres-primary-data:
  snapshot-postgres-remote-data:
