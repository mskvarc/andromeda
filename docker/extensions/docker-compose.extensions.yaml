# Isolated topology for the extensions integration suite (`cargo test --test extensions`).
#
# Two brokers over one Postgres:
#   - extensions-enabled  (host :1091): both extensions on, a small delete bound
#   - extensions-conformance (host :1092): conformance_mode on AND the flags on,
#     to prove the hard override wins (the gate module targets it)
#
#   docker compose -f docker/extensions/docker-compose.extensions.yaml up --build -d
#   ANDROMEDA_TEST_BROKER_URL=http://127.0.0.1:1091/ngsi-ld/v1 \
#   ANDROMEDA_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5491/postgres \
#   ANDROMEDA_TEST_CALLBACK_HOST=127.0.0.1 \
#   ANDROMEDA_TEST_CONFORMANCE_BROKER_URL=http://127.0.0.1:1092/ngsi-ld/v1 \
#   cargo test --test extensions -- --test-threads=1
#   docker compose -f docker/extensions/docker-compose.extensions.yaml down -v
name: andromeda-extensions

x-broker-base: &broker-base
  build:
    context: ../..
    dockerfile: docker/andromeda/Dockerfile
  image: andromeda-extensions:latest
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    extensions-postgres:
      condition: service_healthy
  environment: &broker-env
    ANDROMEDA__SERVER__HOST: "0.0.0.0"
    ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@extensions-postgres:5432/postgres"
    ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${ANDROMEDA__SERVER__PORT}/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

services:
  extensions-postgres:
    build:
      context: ../postgresql
    image: andromeda-extensions-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5491:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  # Both extensions enabled; a deliberately small delete bound so the
  # TooManyResults case is drillable (the suite seeds three history instants).
  extensions-enabled:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1091"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY: "enabled"
      ANDROMEDA__EXTENSIONS__PURGE_DATASET_SCOPE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY_MAX_MATCHES: "2"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:extensions-enabled"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "extensions-enabled"
    ports:
      - "1091:1091"

  # conformance_mode forces every extension off even though the flags are on:
  # the gate module asserts the route is absent, datasetId is rejected, and
  # nothing is advertised.
  extensions-conformance:
    <<: *broker-base
    environment:
      <<: *broker-env
      ANDROMEDA__SERVER__PORT: "1092"
      ANDROMEDA__EXTENSIONS__CONFORMANCE_MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY: "enabled"
      ANDROMEDA__EXTENSIONS__PURGE_DATASET_SCOPE: "enabled"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:extensions-conformance"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "extensions-conformance"
    ports:
      - "1092:1092"
