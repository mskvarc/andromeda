# One Andromeda broker serving HTTP/3 natively alongside HTTP/1.1 and HTTP/2.
#
# Unlike the TLS tier (docker/tls/), which terminates TLS in an nginx proxy in
# front of a plaintext broker, HTTP/3 cannot be proxied to a plaintext hop:
# QUIC (RFC 9114) has no cleartext mode and always terminates TLS 1.3 at the
# endpoint. The broker therefore holds the certificate and serves HTTP/3 itself.
#
# HTTP/3 shares the TCP listener's port NUMBER, not its socket: HTTP/1.1 and
# HTTP/2 run over TCP:1056 and HTTP/3 runs over QUIC on UDP:1056. Both are
# published so the host test client reaches either transport on port 1056. While
# HTTP/3 is served, the TCP responses carry an `Alt-Svc: h3=":1056"` header
# advertising the QUIC endpoint. See docs/http3.md.
#
# Certificate (not committed -- key material does not belong in a repository).
# The SANs must cover the names and address the client verifies against, and the
# leaf must be marked CA:FALSE: a client that trusts the self-signed leaf
# directly rejects a CA-marked certificate presented as an end entity.
#   mkdir -p docker/http3/certs
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout docker/http3/certs/broker.key -out docker/http3/certs/broker.crt \
#     -subj "/CN=localhost" \
#     -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
#     -addext "basicConstraints=critical,CA:FALSE"
#
# Bring up:
#   docker compose -f docker/http3/docker-compose.http3.yaml up -d --build --wait
# Then run the suite from the repository root:
#   cargo test --test http3 -- --test-threads=1
# Tear down:
#   docker compose -f docker/http3/docker-compose.http3.yaml down --volumes --remove-orphans
name: andromeda-http3

services:
  postgres:
    build:
      context: ../postgresql
    image: andromeda-http3-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40

  broker:
    build:
      context: ../..
      dockerfile: docker/andromeda/Dockerfile
    image: andromeda-http3:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # HTTP/1.1 and HTTP/2 over TCP, and HTTP/3 over QUIC on the same UDP port.
      - "1056:1056/tcp"
      - "1056:1056/udp"
    volumes:
      - ./certs:/etc/andromeda/certs:ro
    environment:
      ANDROMEDA__SERVER__HOST: "0.0.0.0"
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
      ANDROMEDA__TENANCY__ENABLED: "true"
      ANDROMEDA__OBSERVABILITY__LOG_LEVEL: "info"
      # Serve the native QUIC/HTTP/3 listener from the mounted certificate.
      ANDROMEDA__HTTP3__MODE: "enabled"
      ANDROMEDA__HTTP3__CERTIFICATE_PATH: "/etc/andromeda/certs/broker.crt"
      ANDROMEDA__HTTP3__PRIVATE_KEY_PATH: "/etc/andromeda/certs/broker.key"
      ANDROMEDA__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:http3-broker"
      ANDROMEDA__IDENTITY__SOURCE_ALIAS: "http3-broker"
    healthcheck:
      # 127.0.0.1, not localhost: the broker listens on IPv4 0.0.0.0, but localhost
      # resolves to IPv6 ::1 first in the image, giving a false "connection refused".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1056/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
