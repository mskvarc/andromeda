[build]
# -Zhigher-ranked-assumptions lets the trait solver use the lifetime relations a higher-ranked bound implies, which
# proving Send for futures that borrow their arguments needs. Only the old solver implements it, so
# -Znext-solver=coherence keeps the next-generation solver to coherence checking, as on stable; without it nightly falls
# back to the old solver crate by crate and warns for each.
# reqwest compiles its http3 feature, which the test suite's HTTP/3 client uses, only under the reqwest_unstable cfg. It
# is set for the whole workspace: feature unification gives every build that includes the suite the same reqwest.
rustflags = ["-Zhigher-ranked-assumptions", "-Znext-solver=coherence", "--cfg", "reqwest_unstable"]
