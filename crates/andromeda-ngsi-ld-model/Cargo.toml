[package]
name = "andromeda-ngsi-ld-model"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-json-literal.workspace = true
andromeda-native-stack.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-problem-details.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
cefact-units = { version = "1.0.0", features = ["serde"] }
chrono = "0.4.45"
compact_str = { version = "0.10.0", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "deref_mut", "display", "from", "into"] }
geo = "0.33.1"
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = { version = "0.23.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "raw_value"] }
serde_with = "3.24.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
typed-builder = "0.23.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-test-allocator.workspace = true
andromeda-test-fixtures.workspace = true
pretty_assertions = "1.4.1"
