[package]
name = "andromeda-delivery"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Getting a notification from this broker to whoever asked for it"

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-health.workspace = true
andromeda-http-headers.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-outbound-http.workspace = true
andromeda-retry.workspace = true
andromeda-telemetry.workspace = true
async-trait = "0.1.92"
chrono = "0.4.45"
dashmap = { version = "6.2.1", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["display"] }
headers = "0.4.2"
humantime = "2.4.0"
iri-rs = "4.1.0"
reqwest = { version = "0.13.5", features = ["json"] }
rumqttc = { version = "0.25.1", features = ["use-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
secrecy = "0.10.3"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
typed-builder = "0.23.2"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.0", features = ["fast-rng", "v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
bytes = "1.12.1"
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread"] }
