[package]
name = "andromeda-delivery"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-health.workspace = true
andromeda-http-headers.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
async-trait = "0.1.92"
backon = "1.6.0"
bytes = "1.12.1"
dashmap = { version = "6.2.1", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["display"] }
headers = "0.4.1"
ip_network = "0.4.1"
iri-rs = "3.4.1"
mediatype = "0.23.0"
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.4", features = ["json"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
rustls = { version = "0.23.43", default-features = false, features = ["std"] }
secrecy = "0.10.3"
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.1", features = ["fast-rng", "v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
