[package]
name = "andromeda-postgresql-temporal-query"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-context-space.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-unit-catalog.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
sea-query = { version = "1.0.2", features = ["backend-postgres", "with-chrono"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-representation.workspace = true
pretty_assertions = "1.4.1"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
