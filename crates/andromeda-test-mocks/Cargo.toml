[package]
name = "andromeda-test-mocks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-http-headers.workspace = true
axum = "0.8.9"
bytes = "1.12.1"
dashmap = { version = "6.2.1", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["into"] }
http = "1.5.0"
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
typed-builder = "0.23.2"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
reqwest = "0.13.5"
