[package]
name = "andromeda-postgresql-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Shared PostgreSQL connection-pool tuning and driver-error classification"

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-retry = { workspace = true, features = ["tokio"] }
andromeda-tenancy.workspace = true
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "deref_mut"] }
sea-query = { version = "1.0.2", features = ["backend-postgres"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }
url = "2.5.8"

[features]
test-support = []

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
