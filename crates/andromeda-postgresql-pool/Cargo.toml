[package]
name = "andromeda-postgresql-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-retry = { workspace = true, features = ["tokio"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
sea-query = { version = "1.0.2", features = ["backend-postgres"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }

[features]
test-support = []

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
