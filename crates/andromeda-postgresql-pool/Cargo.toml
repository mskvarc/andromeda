[package]
name = "andromeda-postgresql-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-persistence-failure.workspace = true
andromeda-postgresql-seaquery.workspace = true
derive_more = { version = "2.1.1", features = ["deref", "deref_mut", "into"] }
sea-query = { version = "1.0.2", features = ["backend-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["sync", "time"] }

[features]
test-support = []

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt", "time"] }
