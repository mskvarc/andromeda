[package]
name = "andromeda-domain"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
cefact-units = { version = "0.1.0", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
compact_str = { version = "0.9.0", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "deref_mut", "display", "from", "into"] }
geo = "0.33.1"
geojson = "1.0.0"
indexmap = { version = "2.14.0", features = ["serde"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
jsonld = { version = "0.22.0", features = ["expandable-serde-json", "expandable-chrono", "serde", "serde-json"] }
jsonld-expandable-core = { version = "0.22.0", features = ["chrono", "serde-json"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = { version = "0.23.0", features = ["serde"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.18.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
typed-builder = "0.23.2"
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.23.1", features = ["fast-rng", "serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
