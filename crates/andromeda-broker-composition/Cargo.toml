async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
compact_str = { version = "0.9.0", features = ["serde"] }
confique = { version = "0.4.0", features = ["toml"] }
dashmap = { version = "6.1.0", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["as_ref", "debug", "deref", "display", "from", "into", "is_variant"] }
futures = "0.3.32"
geo = "0.33.1"
geojson = "1.0.0"
indexmap = { version = "2.14.0", features = ["serde"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
jsonld = { version = "0.22.0", features = ["expandable-serde-json", "expandable-chrono", "reqwest", "serde", "serde-json", "vocab"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
moka = { version = "0.12.15", features = ["future"] }
percent-encoding = "2.3.2"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
sea-query = { version = "0.32.7", features = ["backend-postgres", "with-chrono"] }
sea-query-binder = { version = "0.7.0", features = ["runtime-tokio", "sqlx-postgres", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
shadow-rs = "2.0.0"
sonic-rs = "0.5.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
typed-builder = "0.23.2"
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.23.1", features = ["fast-rng", "serde", "v4"] }

[build-dependencies]
shadow-rs = "2.0.0"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serial_test = "3.4.0"
