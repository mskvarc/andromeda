[package]
name = "andromeda-configuration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The broker configuration: its schema, layered loading and validation"

[lints]
workspace = true

[dependencies]
bytesize = { version = "2.7.0", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["as_ref", "display", "from", "into"] }
enumset = { version = "1.1.15", features = ["serde"] }
etcetera = "0.11.0"
figment2 = { version = "0.11.5", features = ["env", "toml"] }
humantime-serde = "1.1.1"
ipnet = "2.12.2"
iri-rs = { version = "4.1.1", features = ["serde", "static"] }
schemars = { version = "1.2.3", features = ["url2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
textwrap = { version = "0.16.4", default-features = false }
thiserror = "2.0.21"
toml = { version = "1.2.1", features = ["preserve_order"] }
toml_edit = "0.25.19"
url = { version = "2.5.8", features = ["serde"] }
url-macro = "0.2.5"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serial_test = "4.0.1"
temp-env = "0.3.6"
tempfile = "3.27.0"
