[package]
name = "andromeda-postgresql-seaquery"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The PostgreSQL adapter of sea-query: the one crate that spells SQL and hands it to the driver"

[lints]
workspace = true

[dependencies]
derive_more = { version = "2.1.1", features = ["display"] }
sea-query = { version = "1.0.2", features = ["backend-postgres", "postgres-array", "thread-safe", "with-bigdecimal", "with-chrono", "with-uuid"] }
sqlx = { version = "0.9.0", features = ["bigdecimal", "chrono", "postgres", "runtime-tokio", "uuid"] }
sqlx-core = "0.9.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
