[package]
name = "andromeda-postgresql-attribute-dictionary"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
async-trait = "0.1.89"
dashmap = { version = "6.1.0", features = ["inline"] }
sea-query = { version = "0.32.7", features = ["backend-postgres", "postgres-array", "with-chrono", "with-json", "with-uuid"] }
sea-query-binder = { version = "0.7.0", features = ["postgres-array", "runtime-tokio", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
thiserror = "2.0.18"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.52.1", features = ["macros", "rt"] }
