[package]
name = "andromeda-ngsi-ld-compaction"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
chrono = "0.4.45"
dashmap = { version = "6.2.1", features = ["inline"] }
indexmap = "2.14.2"
iri-rs = "3.4.1"
jsonld = { version = "0.23.5", features = ["serde-json"] }
jsonld-syntax = { version = "0.23.5", features = ["serde-json"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-test-allocator.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
