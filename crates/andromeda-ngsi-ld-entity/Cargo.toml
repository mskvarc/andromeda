[package]
name = "andromeda-ngsi-ld-entity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The typed, context-independent model of an NGSI-LD entity"

[lints]
workspace = true

[dependencies]
andromeda-json-literal.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
cefact-units = "1.0.0"
chrono = "0.4.45"
compact_str = "0.10.0"
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from", "into", "into_iterator"] }
hashbrown = { version = "0.17.1", default-features = false }
indexmap = "2.14.2"
iri-rs = "4.1.0"
langtag = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
typed-builder = "0.23.2"

[dev-dependencies]
allocation-counter = "0.8.1"
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
