[package]
name = "andromeda-ngsi-ld-entity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-json-literal.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-unit-catalog.workspace = true
chrono = "0.4.45"
compact_str = "0.10.0"
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from", "into", "into_iterator"] }
indexmap = "2.14.2"
iri-rs = "3.4.1"
langtag = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "raw_value"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
typed-builder = "0.23.2"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-test-allocator.workspace = true
andromeda-test-fixtures.workspace = true
pretty_assertions = "1.4.1"
