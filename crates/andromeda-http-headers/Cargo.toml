[package]
name = "andromeda-http-headers"
version.workspace = true
edition.workspace = true
license = "EUPL-1.2 AND MIT"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The typed NGSI-LD HTTP header set, and the values those headers carry"

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
chrono = "0.4.45"
