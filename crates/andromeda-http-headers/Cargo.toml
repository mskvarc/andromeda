headers = "0.4.2"
http = "1.5.0"
httpdate = "1.0.3"
indexmap = "2.14.2"
iri-rs = "4.1.1"
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
