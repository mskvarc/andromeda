[package]
name = "andromeda-http-headers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
chrono = "0.4.45"
derive_more = { version = "2.1.1", features = ["constructor", "display", "from", "into"] }
headers = "0.4.1"
http = "1.5.0"
httpdate = "1.0.3"
iri-rs = "3.4.1"
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
rfc7239 = "0.1.3"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
