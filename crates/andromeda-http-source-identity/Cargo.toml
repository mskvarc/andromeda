[package]
name = "andromeda-http-source-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-extensions.workspace = true
andromeda-http-context-registry.workspace = true
andromeda-http-extraction.workspace = true
andromeda-http-response.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-render.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-tenancy.workspace = true
axum = "0.8.9"
chrono = "0.4.45"
futures = "0.3.34"
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-context-registry.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-tenancy = { workspace = true, features = ["resident-tenancy"] }
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
