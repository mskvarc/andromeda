[package]
name = "andromeda-http-source-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-extensions.workspace = true
andromeda-http-context-registry.workspace = true
andromeda-http-extraction.workspace = true
andromeda-http-response.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-render.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-tenancy.workspace = true
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
iri-rs = { version = "3.4.1", features = ["static"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
toml-comment = "0.3.0"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-context-registry.workspace = true
andromeda-test-harness.workspace = true
pretty_assertions = "1.4.1"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
