[package]
name = "andromeda-health"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-lexicon.workspace = true
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
andromeda-layer-guard.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
