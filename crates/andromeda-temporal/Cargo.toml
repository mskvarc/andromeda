[package]
name = "andromeda-temporal"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-context-commit.workspace = true
andromeda-entity.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-render.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
async-lock = "3.4.2"
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
confique = { version = "0.4.0", features = ["toml"] }
derive_more = { version = "2.1.1", features = ["display"] }
indexmap = { version = "2.14.0", features = ["serde"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.52.1", features = ["macros", "rt"] }
