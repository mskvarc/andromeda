[package]
name = "andromeda-temporal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-configuration-scalars.workspace = true
andromeda-context-commit.workspace = true
andromeda-context-space.workspace = true
andromeda-entity.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-render.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-telemetry.workspace = true
async-lock = "3.4.2"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["display"] }
indexmap = { version = "2.14.2", features = ["serde"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
toml-comment = "0.3.0"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
