[package]
name = "andromeda-registration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Context-source registration policy (ETSI GS CIM 009 clause 5.9)"

[lints]
workspace = true

[dependencies]
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-compaction.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-persistence-failure.workspace = true
chrono = "0.4.45"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
iri-rs = { version = "4.1.0", features = ["serde", "static"] }
mediatype = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
typed-builder = "0.23.2"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-ngsi-ld-representation.workspace = true
pretty_assertions = "1.4.1"
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
url = "2.5.8"
