[package]
name = "andromeda-registration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-request.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
mediatype = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
thiserror = "2.0.21"
typed-builder = "0.23.2"
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.26.1", features = ["fast-rng", "serde", "v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
