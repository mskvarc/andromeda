[package]
name = "andromeda-postgresql-name-dictionary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-postgresql-pool.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-telemetry.workspace = true
async-trait = "0.1.92"
chrono = "0.4.45"
moka = { version = "0.12.16", features = ["sync"] }
sea-query = { version = "1.0.2", features = ["backend-postgres", "postgres-array", "with-bigdecimal", "with-chrono", "with-uuid"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
