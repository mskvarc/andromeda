[package]
name = "andromeda-ngsi-ld-render"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-http-headers.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
chrono = { version = "0.4.44", features = ["serde"] }
geojson = "1.0.0"
indexmap = { version = "2.14.0", features = ["serde"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
langtag = { version = "1.1.0", features = ["serde"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
urn-rs = { version = "0.9.2", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
