[package]
name = "andromeda-http-extraction"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-context-space.workspace = true
andromeda-http-headers.workspace = true
andromeda-http-response.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-problem-details.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-tenancy.workspace = true
axum = "0.8.9"
form_urlencoded = "1.2.2"
futures = "0.3.34"
headers = "0.4.2"
iri-rs = { version = "3.4.1", features = ["static"] }
mediatype = "0.23.0"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
allocation-counter = "0.8.1"
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
