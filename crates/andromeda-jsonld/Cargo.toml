[package]
name = "andromeda-jsonld"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-configuration-scalars.workspace = true
andromeda-http-headers.workspace = true
andromeda-json-literal.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-persistence-failure.workspace = true
async-trait = "0.1.92"
backon = { version = "1.6.0", features = ["tokio-sleep"] }
dashmap = { version = "6.2.1", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["debug", "deref", "display", "from"] }
headers = "0.4.2"
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
jsonld = { version = "0.25.0", features = ["expandable-chrono", "reqwest", "serde", "vocab"] }
jsonld-core = "0.25.0"
jsonld-syntax = "0.25.0"
jstrict = "0.16.0"
mediatype = "0.23.0"
moka = { version = "0.12.16", features = ["future"] }
rdfx = "0.24.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
toml = "1.1.8"
toml-comment = "0.3.0"
tracing = "0.1.44"
typed-builder = "0.23.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
