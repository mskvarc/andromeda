[package]
name = "andromeda-ngsi-ld-query"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-json-literal.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
base64 = "0.23.1"
chrono = "0.4.45"
derive_more = { version = "2.1.1", features = ["deref", "display", "from", "into"] }
icu_collator = { version = "2.4.0", features = ["unstable"] }
iri-rs = { version = "4.1.0", features = ["serde", "static"] }
langtag = { version = "1.1.0", features = ["serde"] }
regex = "1.13.1"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
typed-builder = "0.23.2"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.1", features = ["full"] }
