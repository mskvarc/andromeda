[package]
name = "andromeda-ngsi-ld-query"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
chrono = { version = "0.4.44", features = ["serde"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
langtag = { version = "1.1.0", features = ["serde"] }
percent-encoding = "2.3.2"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
typed-builder = "0.23.2"
urn-rs = { version = "0.9.2", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tokio = { version = "1.52.1", features = ["full"] }
