[package]
name = "andromeda-federation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-configuration-scalars.workspace = true
andromeda-context-space.workspace = true
andromeda-entity-map.workspace = true
andromeda-http-headers.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-compaction.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-expansion.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-problem-details.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-render.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-registration.workspace = true
andromeda-telemetry.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = { version = "6.2.1", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["is_variant"] }
futures = "0.3.34"
headers = "0.4.2"
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
mediatype = "0.23.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt"] }
toml = "1.1.6"
toml-comment = "0.3.0"
tracing = "0.1.44"
typed-builder = "0.23.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-test-mocks.workspace = true
bytes = "1.12.1"
pretty_assertions = "1.4.1"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
