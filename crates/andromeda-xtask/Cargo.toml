[package]
name = "andromeda-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
iri-rs = { version = "3.4.1", features = ["static"] }
open = "5.4.4"
reqwest = { version = "0.13.5", features = ["blocking"] }
roxmltree = "0.21.1"
serde_json = "1.0.151"
thiserror = "2.0.20"
