[package]
name = "andromeda-http-stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-http-extraction.workspace = true
andromeda-http-headers.workspace = true
andromeda-http-response.workspace = true
andromeda-http-tenancy.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-problem-details.workspace = true
andromeda-telemetry.workspace = true
axum = "0.8.9"
axum-helmet = "1.0.2"
axum-server-timing = "3.0.1"
enumset = { version = "1.1.15", features = ["serde"] }
headers = "0.4.2"
http-body = "1.1.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-full", "cors", "csrf", "decompression-full", "normalize-path", "request-id", "sensitive-headers", "trace"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
futures = "0.3.34"
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
toml = "1.2.1"
