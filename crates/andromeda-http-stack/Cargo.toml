[package]
name = "andromeda-http-stack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-configuration-scalars.workspace = true
andromeda-http-extraction.workspace = true
andromeda-http-headers.workspace = true
andromeda-http-tenancy.workspace = true
axum = "0.8.9"
axum-helmet = "1.0.2"
axum-prometheus = "0.10.1"
axum-server-timing = "3.0.1"
enumset = { version = "1.1.14", features = ["serde"] }
headers = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
toml-comment = "0.3.0"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-full", "cors", "csrf", "decompression-full", "normalize-path", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
