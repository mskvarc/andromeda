[package]
name = "andromeda-ngsi-ld-number"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Exact JSON numbers in the NGSI-LD value family (ETSI GS CIM 009 clause 4.6.3)"

[lints]
workspace = true

[dependencies]
bigdecimal = { version = "0.4.11", features = ["serde-json"] }
derive_more = { version = "2.1.1", features = ["display", "from"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0.21"
zmij = "1.0.23"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
