[package]
name = "andromeda-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Process-wide metrics facade for the broker"

[lints]
workspace = true

[dependencies]
dashmap = { version = "6.2.1", features = ["inline"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
metrics-util = { version = "0.20.4", default-features = false }
parking_lot = "0.13.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
