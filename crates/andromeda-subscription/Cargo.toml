[package]
name = "andromeda-subscription"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Subscription policy for ETSI GS CIM 009 clauses 5.8 and 5.11"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
andromeda-context-commit.workspace = true
andromeda-context-space.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-linked-retrieval.workspace = true
andromeda-ngsi-ld-compaction.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-retry.workspace = true
andromeda-spatial-index.workspace = true
andromeda-telemetry.workspace = true
andromeda-tenancy.workspace = true
async-trait = "0.1.92"
chrono = "0.4.45"
dashmap = { version = "6.2.1", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["display", "is_variant"] }
futures = "0.3.34"
iri-rs = { version = "4.1.0", features = ["serde", "static"] }
langtag = { version = "1.1.0", features = ["serde"] }
parking_lot = "0.13.0"
rustc-hash = "2.1.3"
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-retry = { workspace = true, features = ["test-support"] }
pretty_assertions = "1.4.1"
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
