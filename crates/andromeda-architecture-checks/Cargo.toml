[package]
name = "andromeda-architecture-checks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The architecture gates every workspace crate is held to"

[lib]
path = "src/lib.rs"

[dependencies]
andromeda-ngsi-ld-vocabulary.workspace = true
packageurl = "0.7.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.10", features = ["full", "visit"] }
thiserror = "2.0.21"
toml_edit = "0.25.20"
url = "2.5.9"
walkdir = "2.5.1"

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = "1.4.1"
