[package]
name = "andromeda-postgresql-atomic-write"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-context-commit.workspace = true
andromeda-context-space.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-postgresql-attribute-instance.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-context-store.workspace = true
andromeda-postgresql-name-dictionary.workspace = true
andromeda-postgresql-pool.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-postgresql-temporal-store.workspace = true
andromeda-telemetry.workspace = true
andromeda-temporal.workspace = true
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["from"] }
sea-query = { version = "1.0.2", features = ["backend-postgres", "postgres-array", "with-bigdecimal", "with-chrono", "with-json", "with-uuid"] }
sea-query-sqlx = { version = "0.9.1", features = ["postgres-array", "runtime-tokio", "sqlx-postgres", "with-bigdecimal", "with-chrono", "with-json", "with-uuid"] }
sqlx = { version = "0.9.0", features = ["bigdecimal", "runtime-tokio", "postgres", "json", "chrono", "uuid"] }
tokio = { version = "1.53.2", features = ["time"] }
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-ngsi-ld-number.workspace = true
pretty_assertions = "1.4.1"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt", "test-util", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }
