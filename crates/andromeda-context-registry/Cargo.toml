[package]
name = "andromeda-context-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-persistence-failure.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["debug", "display"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
moka = { version = "0.12.16", features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_json_canonicalizer = "0.3.2"
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.2", features = ["macros", "rt", "time"] }
uuid = "1.27.0"
