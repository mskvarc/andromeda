[package]
name = "andromeda-postgresql-maintenance"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-context-store.workspace = true
andromeda-postgresql-pool.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-telemetry.workspace = true
andromeda-tenancy.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
sea-query = { version = "1.0.2", features = ["backend-postgres", "with-chrono"] }
sea-query-sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlx-postgres", "with-chrono"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros"] }
tokio-util = "0.7.19"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
