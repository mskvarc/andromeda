[package]
name = "andromeda-postgresql-stored-values"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The codes, keys and encodings Andromeda's PostgreSQL schema persists rows by"

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-postgresql-schema.workspace = true
bigdecimal = "0.4.11"
