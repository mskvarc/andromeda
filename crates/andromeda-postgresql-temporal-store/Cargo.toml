[package]
name = "andromeda-postgresql-temporal-store"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-entity.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-postgresql-encoding.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-temporal-query.workspace = true
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["sync"] }
tracing = "0.1.44"
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
andromeda-layer-guard.workspace = true
pretty_assertions = "1.4.1"
