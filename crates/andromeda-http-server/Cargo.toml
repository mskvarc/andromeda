[package]
name = "andromeda-http-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
confique = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["net", "sync", "time"] }
tower = "0.5.3"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
reqwest = "0.13.2"
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
