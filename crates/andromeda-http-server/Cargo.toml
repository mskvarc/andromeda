[package]
name = "andromeda-http-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-configuration-scalars.workspace = true
andromeda-server-tls.workspace = true
axum = { version = "0.8.9", features = ["http2"] }
headers = "0.4.2"
hyper = "1.11.1"
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tls-listener = { version = "0.11.2", default-features = false, features = ["rustls-aws-lc", "tokio-net"] }
tokio = { version = "1.53.2", features = ["net", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
toml = "1.1.6"
toml-comment = "0.3.0"
tower = "0.5.3"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-test-tls.workspace = true
pretty_assertions = "1.4.1"
reqwest = { version = "0.13.5", features = ["http2"] }
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
