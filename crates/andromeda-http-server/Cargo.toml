[package]
name = "andromeda-http-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-server-tls.workspace = true
axum = { version = "0.8.9", features = ["http2"] }
headers = "0.4.2"
humantime = "2.4.0"
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
thiserror = "2.0.21"
tls-listener = { version = "0.11.2", default-features = false, features = ["rustls-aws-lc", "tokio-net"] }
tokio = { version = "1.54.1", features = ["net", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tower = "0.5.3"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-server-tls = { workspace = true, features = ["test-identity"] }
pretty_assertions = "1.4.1"
reqwest = { version = "0.13.5", features = ["http2"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
