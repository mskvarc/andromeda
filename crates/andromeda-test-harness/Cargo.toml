[package]
name = "andromeda-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-postgresql-pool.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-tenancy.workspace = true
andromeda-test-client.workspace = true
andromeda-test-fixtures.workspace = true
andromeda-test-mocks.workspace = true
async-trait = "0.1.92"
chrono = "0.4.45"
dashmap = { version = "6.2.1", features = ["inline"] }
futures = "0.3.34"
http = "1.5.0"
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
reqwest = { version = "0.13.5", features = ["json"] }
sea-query = { version = "1.0.2", features = ["backend-postgres", "postgres-array", "thread-safe"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "sync", "time"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
