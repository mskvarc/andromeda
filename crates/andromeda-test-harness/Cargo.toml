[package]
name = "andromeda-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-test-client.workspace = true
futures = "0.3.34"
http = "1.5.0"
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
