[package]
name = "andromeda-postgresql-context-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "PostgreSQL-backed context store for the NGSI-LD context broker"

[lints]
workspace = true

[dependencies]
andromeda-component-report.workspace = true
andromeda-configuration.workspace = true
andromeda-context-commit.workspace = true
andromeda-context-registry.workspace = true
andromeda-context-space.workspace = true
andromeda-entity.workspace = true
andromeda-entity-map.workspace = true
andromeda-health.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-notification.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-posted-query.workspace = true
andromeda-postgresql-attribute-instance.workspace = true
andromeda-postgresql-branch.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-collation.workspace = true
andromeda-postgresql-context-query.workspace = true
andromeda-postgresql-encoding.workspace = true
andromeda-postgresql-name-dictionary.workspace = true
andromeda-postgresql-pool.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-registration.workspace = true
andromeda-retry = { workspace = true, features = ["tokio"] }
andromeda-snapshot.workspace = true
andromeda-subscription.workspace = true
andromeda-subscription-forwarding.workspace = true
andromeda-telemetry.workspace = true
andromeda-tenancy.workspace = true
async-trait = "0.1.92"
chrono = "0.4.45"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "display", "is_variant"] }
futures = "0.3.34"
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
iri-rs = { version = "4.1.0", features = ["serde", "static"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
sea-query = { version = "1.0.2", features = ["backend-postgres", "postgres-array", "with-chrono", "with-uuid"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-postgresql-pool = { workspace = true, features = ["test-support"] }
cefact-units = "1.0.0"
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["full"] }
