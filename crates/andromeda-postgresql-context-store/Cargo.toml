[package]
name = "andromeda-postgresql-context-store"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-component-report.workspace = true
andromeda-context-commit.workspace = true
andromeda-context-registry.workspace = true
andromeda-entity.workspace = true
andromeda-health.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-notification.workspace = true
andromeda-postgresql-context-query.workspace = true
andromeda-postgresql-encoding.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-registration.workspace = true
andromeda-snapshot.workspace = true
andromeda-spatial-index.workspace = true
andromeda-subscription.workspace = true
andromeda-tenancy.workspace = true
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
confique = "0.4.0"
dashmap = { version = "6.1.0", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["is_variant"] }
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
sea-query = { version = "0.32.7", features = ["backend-postgres", "with-chrono"] }
sea-query-binder = { version = "0.7.0", features = ["runtime-tokio", "sqlx-postgres", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sonic-rs = "0.5.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["sync"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.52.1", features = ["full"] }
