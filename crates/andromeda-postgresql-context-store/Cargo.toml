[package]
name = "andromeda-postgresql-context-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-component-report.workspace = true
andromeda-context-commit.workspace = true
andromeda-context-registry.workspace = true
andromeda-entity.workspace = true
andromeda-health.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-notification.workspace = true
andromeda-postgresql-attribute-dictionary.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-context-query.workspace = true
andromeda-postgresql-encoding.workspace = true
andromeda-postgresql-query.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-registration.workspace = true
andromeda-snapshot.workspace = true
andromeda-subscription.workspace = true
andromeda-tenancy.workspace = true
andromeda-unit-catalog.workspace = true
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
confique = "0.4.0"
derive_more = { version = "2.1.1", features = ["display", "is_variant"] }
hex = "0.4.3"
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
langtag = { version = "1.1.0", features = ["serde"] }
mediatype = "0.23.0"
sea-query = { version = "1.0.2", features = ["backend-postgres", "postgres-array", "with-chrono", "with-json", "with-uuid"] }
sea-query-sqlx = { version = "0.9.1", features = ["postgres-array", "runtime-tokio", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sonic-rs = "0.5.8"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.1", features = ["full"] }
