[package]
name = "andromeda-ngsi-ld-request"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-http-headers.workspace = true
andromeda-linked-retrieval.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
chrono = "0.4.45"
derive_more = { version = "2.1.1", features = ["display"] }
iri-rs = "3.4.1"
iso8601-duration = { version = "0.2.0", features = ["serde"] }
langtag = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
toml-comment = "0.3.0"
typed-builder = "0.23.2"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
