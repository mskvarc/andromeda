[package]
name = "andromeda-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-configuration-scalars.workspace = true
andromeda-context-commit.workspace = true
andromeda-context-space.workspace = true
andromeda-entity.workspace = true
andromeda-federation.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-expansion.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-problem-details.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-temporal.workspace = true
chrono = "0.4.45"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "time"] }
toml = "1.1.6"
toml-comment = "0.3.0"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
indexmap = "2.14.2"
pretty_assertions = "1.4.1"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "test-util", "time"] }
