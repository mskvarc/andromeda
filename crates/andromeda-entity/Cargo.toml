[package]
name = "andromeda-entity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-context-commit.workspace = true
andromeda-context-space.workspace = true
andromeda-federation.workspace = true
andromeda-jsonld.workspace = true
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-spatial-index.workspace = true
andromeda-subscription.workspace = true
andromeda-telemetry.workspace = true
andromeda-tenancy.workspace = true
async-lock = "3.4.2"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = { version = "6.2.1", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["as_ref", "display", "is_variant"] }
futures = "0.3.34"
geo = "0.33.1"
indexmap = { version = "2.14.2", features = ["serde"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
jsonld = { version = "0.22.1", features = ["expandable-serde-json", "expandable-chrono", "reqwest", "serde", "serde-json", "vocab"] }
langtag = "1.1.0"
moka = { version = "0.12.16", features = ["future"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
toml-comment = "0.3.0"
tracing = "0.1.44"
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.26.1", features = ["fast-rng", "serde", "v4"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
async-trait = "0.1.92"
pretty_assertions = "1.4.1"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
