[package]
name = "andromeda-tenancy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[dependencies]
andromeda-configuration-scalars.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-telemetry.workspace = true
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["clock"] }
dashmap = { version = "6.2.1", features = ["inline"] }
derive_more = { version = "2.1.1", features = ["as_ref", "display", "from", "into"] }
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
toml = "1.1.6"
toml-comment = "0.3.0"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
