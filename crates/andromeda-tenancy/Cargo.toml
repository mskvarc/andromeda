[package]
name = "andromeda-tenancy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "One broker, many tenants, and the runtime each of them gets"

[lints]
workspace = true

[features]
# The resident tenant runtime cache route tests resolve their leases through.
resident-tenancy = ["dep:tokio-util"]

[dependencies]
andromeda-configuration.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-task-runtime.workspace = true
andromeda-telemetry.workspace = true
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["clock"] }
dashmap = { version = "6.2.1", features = ["inline"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", optional = true }
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util = "0.7.20"
