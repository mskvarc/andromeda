[package]
name = "andromeda-subscription-forwarding"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The distributed side of subscriptions (ETSI GS CIM 009 clauses 5.8.1.4, 5.8.2.4, 5.8.5.4 and 5.8.6)"

[lints]
workspace = true

[dependencies]
andromeda-context-space.workspace = true
andromeda-delivery.workspace = true
andromeda-entity.workspace = true
andromeda-federation.workspace = true
andromeda-json-literal.workspace = true
andromeda-jsonld.workspace = true
andromeda-linked-retrieval.workspace = true
andromeda-ngsi-ld-compaction.workspace = true
andromeda-ngsi-ld-entity.workspace = true
andromeda-ngsi-ld-expansion.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-render.workspace = true
andromeda-ngsi-ld-representation.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-persistence-failure.workspace = true
andromeda-registration.workspace = true
andromeda-subscription.workspace = true
andromeda-tenancy.workspace = true
chrono = "0.4.45"
futures = "0.3.34"
indexmap = "2.14.2"
lockable = { version = "0.2.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
typed-builder = "0.23.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-configuration.workspace = true
andromeda-context-commit.workspace = true
async-trait = "0.1.92"
http = "1.5.0"
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
wiremock = "0.6.5"
