[package]
name = "andromeda-ngsi-ld-lexicon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
andromeda-configuration.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
cefact-units = "1.0.0"
chrono = "0.4.45"
compact_str = { version = "0.10.0", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from", "from_str", "into"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
iso8601-duration = "0.2.0"
rdfx = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
static-regular-grammar = "2.0.2"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v5", "v7"] }
xsd-rs = "0.10.0"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
