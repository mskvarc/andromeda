[package]
name = "andromeda-ngsi-ld-lexicon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-vocabulary.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
compact_str = { version = "0.10.0", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from", "from_str", "into"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
serde = { version = "1.0.229", features = ["derive"] }
static-regular-grammar = "2.0.2"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
urn-rs = { version = "0.9.2", features = ["serde"] }
uuid = { version = "1.27.0", features = ["serde", "v4", "v5", "v7"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
pretty_assertions = "1.4.1"
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
