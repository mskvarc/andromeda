[package]
name = "andromeda-retry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
tokio = ["dep:tokio"]

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "from"] }
fastrand = "2.5.0"
futures = "0.3.34"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"], optional = true }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "time"] }
