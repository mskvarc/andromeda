[package]
name = "andromeda-server-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# `toml` is used only through the `toml-comment` derive, which expands to
# `toml::Value` at the call site; cargo-machete cannot see that macro-generated
# use and would otherwise report the dependency as unused.
[package.metadata.cargo-machete]
ignored = ["toml"]

[lints]
workspace = true

[features]
# Throwaway authorities, identities and identity files for tests that
# complete real TLS handshakes.
test-identity = ["dep:rcgen", "dep:tempfile"]

[dependencies]
andromeda-configuration-scalars.workspace = true
notify-debouncer-full = "0.7.0"
rcgen = { version = "0.14.10", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync"] }
toml = "1.1.8"
toml-comment = "0.3.0"
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
rcgen = "0.14.10"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
