[package]
name = "andromeda-server-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Throwaway authorities, identities and identity files for tests that
# complete real TLS handshakes.
test-identity = ["dep:rcgen", "dep:tempfile"]

[dependencies]
andromeda-configuration.workspace = true
notify-debouncer-full = "0.7.0"
rcgen = { version = "0.14.10", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1.15.1"
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
