[package]
name = "andromeda-postgresql-query"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-postgresql-encoding.workspace = true
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["from"] }
sea-query = { version = "0.32.7", features = ["backend-postgres", "with-chrono"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
andromeda-layer-guard.workspace = true
iri-rs = { version = "3.4.0", features = ["serde", "static"] }
pretty_assertions = "1.4.1"
