[package]
name = "andromeda-postgresql-query"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The PostgreSQL spelling of the NGSI-LD query languages"

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-postgresql-encoding.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
andromeda-postgresql-stored-form.workspace = true
andromeda-postgresql-stored-values.workspace = true
cefact-units = "1.0.0"
chrono = "0.4.45"
iri-rs = { version = "4.1.1", features = ["serde", "static"] }
sea-query = { version = "1.0.2", features = ["backend-postgres", "with-bigdecimal", "with-chrono"] }
strum = "0.28.0"
thiserror = "2.0.21"
typed-builder = "0.23.2"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-ngsi-ld-query = { workspace = true, features = ["test-support"] }
andromeda-postgresql-seaquery = { workspace = true, features = ["test-support"] }
andromeda-q-corpus.workspace = true
insta = "1.49.0"
langtag = "1.1.0"
pretty_assertions = "1.4.1"
regex = "1.13.2"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

# Snapshot assertions reach insta through a macro that expands in this crate, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["insta"]
