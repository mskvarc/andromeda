[package]
name = "andromeda-postgresql-query"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-geometry.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-number.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-vocabulary.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-encoding.workspace = true
andromeda-postgresql-schema.workspace = true
andromeda-postgresql-seaquery.workspace = true
bigdecimal = "0.4.11"
chrono = "0.4.45"
derive_more = { version = "2.1.1", features = ["from"] }
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
sea-query = { version = "1.0.2", features = ["backend-postgres", "with-bigdecimal", "with-chrono", "with-json"] }
thiserror = "2.0.21"
typed-builder = "0.23.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serde_json = "1.0.151"
