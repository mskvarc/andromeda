[package]
name = "andromeda-task-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
compact_str = "0.10.0"
dashmap = "6.2.1"
derive_more = { version = "2.1.1", features = ["display"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
