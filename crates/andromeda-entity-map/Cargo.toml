[package]
name = "andromeda-entity-map"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-ngsi-ld-model.workspace = true
andromeda-ngsi-ld-query.workspace = true
andromeda-ngsi-ld-request.workspace = true
andromeda-persistence-failure.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
iso8601-duration = { version = "0.2.0", features = ["chrono", "serde"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
pretty_assertions = "1.4.1"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
