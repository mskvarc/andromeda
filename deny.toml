# Permissive-only allow list.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Zlib", "Unicode-3.0", "EUPL-1.2"]

# Mozilla root-cert bundle; CDLA covers data, not code.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Public-domain dedication; the file watcher behind TLS certificate reload.
[[licenses.exceptions]]
name = "notify"
allow = ["CC0-1.0"]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is unmaintained, which the advisory reports in place of a vulnerability. Only the procedural macros of static-automata-macros, static-regular-grammar and str-newtype-derive use it, so it runs while the broker compiles and none of its code is in the binary. The newest releases of static-automata-macros and static-regular-grammar still depend on it." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is unmaintained, which the advisory reports in place of a vulnerability. rumqttc 0.25.1, the only crate linking it, calls it only to read certificate files for a TlsConfiguration::Simple, and the broker never builds one, handing rumqttc a ready rustls client configuration instead." },
    # An id ignore covers every version of the crate, so these five hold only while every rustls-webpki in Cargo.lock other than 0.102.8 is 0.103.16 or later, the first release fixing all five.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 compares only the first CRL distribution point of a certificate when it checks revocation, so a revoked certificate can pass when unknown revocation status is allowed. The broker never runs that check. rumqttc 0.25.1, the only crate linking rustls-webpki 0.102, names it only as the type of an error variant that nothing constructs and calls none of its functions, and the broker verifies every certificate with rustls-webpki 0.103.16 or later, which is patched, and with no revocation lists." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 ignores name constraints on URI names when it verifies a certificate path, so a misissued certificate can pass a constraint it breaks. The broker never runs that verification. rumqttc 0.25.1, the only crate linking rustls-webpki 0.102, names it only as the type of an error variant that nothing constructs and calls none of its functions, and the broker verifies every certificate with rustls-webpki 0.103.16 or later, which rejects URI name constraints." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 accepts a certificate for a wildcard DNS name under a permitted name constraint the wildcard reaches past when it verifies a certificate path. The broker never runs that verification. rumqttc 0.25.1, the only crate linking rustls-webpki 0.102, names it only as the type of an error variant that nothing constructs and calls none of its functions, and the broker verifies every certificate with rustls-webpki 0.103.16 or later, which is patched." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 panics when it parses a certificate revocation list whose issuing distribution point holds an empty onlySomeReasons bit string. The broker parses no revocation lists. rumqttc 0.25.1, the only crate linking rustls-webpki 0.102, names it only as the type of an error variant that nothing constructs and calls none of its functions, and the broker's certificate checks run on rustls-webpki 0.103.16 or later, which is patched, with no revocation lists." },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 accepts certificate paths through the distrusted emSign intermediates, whose private keys are public, when its trust anchors lead to them. The broker never verifies a path with it. rumqttc 0.25.1, the only crate linking rustls-webpki 0.102, names it only as the type of an error variant that nothing constructs and calls none of its functions, and the broker verifies every certificate with rustls-webpki 0.103.16 or later, which rejects those intermediates." },
    { id = "RUSTSEC-2026-0542", reason = "humantime 2.4.0 is unmaintained, which the advisory reports in place of a vulnerability, on the grounds that it wraps chrono. No maintained release exists." },
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 is unmaintained, which the advisory reports in place of a vulnerability. No maintained release exists." },
]

[bans]
multiple-versions = "warn"
# Every workspace crate is unpublished, so its path dependencies are not wildcards.
allow-wildcard-paths = true
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
