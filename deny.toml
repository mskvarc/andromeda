# Permissive-only allow list.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "EUPL-1.2"]

# Mozilla root-cert bundle; CDLA covers data, not code.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# The LLVM exception only adds permissions to Apache-2.0; build-time archive writer for psm behind stacker.
[[licenses.exceptions]]
name = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

# Public-domain dedication; the file watcher behind TLS certificate reload.
[[licenses.exceptions]]
name = "notify"
allow = ["CC0-1.0"]

# Boost Software License 1.0: permissive, OSI approved; the xxh3 hash behind sub-attribute path keys.
[[licenses.exceptions]]
name = "xxhash-rust"
allow = ["BSL-1.0"]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, build-time only, no upstream upgrade path" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained, now transitive only through rumqttc, blocked on rumqtt#1073" },
    # rumqttc pins ^0.102; fixes only in 0.103. Lift on rumqtt#1067.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki CRL distribution-point matching, no CRLs configured, blocked on rumqtt#1067" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki URI name constraints, blocked on rumqtt#1067" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard-name constraints, blocked on rumqtt#1067" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL parsing panic, no CRLs configured, blocked on rumqtt#1067" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki distrusted emSign intermediates, blocked on rumqtt#1067" },
]

[bans]
multiple-versions = "warn"
# Every workspace crate is unpublished, so its path dependencies are not wildcards.
allow-wildcard-paths = true
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
