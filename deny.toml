# Permissive-only allow list.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Zlib", "Unicode-3.0", "EUPL-1.2"]

# Mozilla root-cert bundle; CDLA covers data, not code.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Public-domain dedication; the file watcher behind TLS certificate reload.
[[licenses.exceptions]]
name = "notify"
allow = ["CC0-1.0"]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, build-time only, no upstream upgrade path" },
    # rumqttc 0.25.1 calls rustls-pemfile only to read a TlsConfiguration::Simple, and MQTT delivery always builds TlsConfiguration::Rustls.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained, reached only through rumqttc's TlsConfiguration::Simple path, which the broker never builds" },
    # rumqttc 0.25.1 requires rustls-webpki ^0.102 but names it only in its TlsError::WebPki variant, which nothing constructs; certificate verification runs on rustls 0.23 and rustls-webpki 0.103.
    # An id ignore covers every version of the crate, so the rustls-webpki 0.103 entry in Cargo.lock must stay at 0.103.16 or later, the first release fixing all five.
    # Remove these five once rumqttc requires rustls-webpki 0.103.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 CRL distribution-point matching, unreachable: rumqttc links 0.102 only for an error type" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 URI name constraints, unreachable: rumqttc links 0.102 only for an error type" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 wildcard-name constraints, unreachable: rumqttc links 0.102 only for an error type" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 CRL parsing panic, unreachable: rumqttc links 0.102 only for an error type" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 distrusted emSign intermediates, unreachable: rumqttc links 0.102 only for an error type" },
]

[bans]
multiple-versions = "warn"
# Every workspace crate is unpublished, so its path dependencies are not wildcards.
allow-wildcard-paths = true
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
