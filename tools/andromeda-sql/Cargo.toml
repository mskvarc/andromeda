[package]
name = "andromeda-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The tooling around the SQL migrations, the schema contract of every release"

[lints]
workspace = true

[dependencies]
andromeda-postgresql-context-store.workspace = true
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
derive_more = { version = "2.1.1", features = ["as_ref", "display", "from_str"] }
gix = { version = "0.90.0", default-features = false, features = ["revision", "sha1"] }
hex = "0.4.3"
iri-rs = { version = "4.1.0", features = ["static"] }
miette = { version = "7.6.0", features = ["fancy-no-backtrace"] }
pg_query = "18.1.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"
url = "2.5.8"
which = "8.0.6"

[dev-dependencies]
andromeda-architecture-checks.workspace = true
andromeda-ngsi-ld-lexicon.workspace = true
andromeda-postgresql-codes.workspace = true
andromeda-postgresql-schema.workspace = true
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
