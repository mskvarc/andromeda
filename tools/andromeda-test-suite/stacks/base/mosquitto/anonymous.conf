# The broker the ETSI MQTT ports name as mqtt_host: anonymous clients allowed on
# every listener, as the suite's mosquitto.conf.
allow_anonymous true

# The default port the endpoints name. The mount point prefixes every topic
# published through this listener, so the observer can tell the port used.
listener 1883
mount_point 1883/

# The non-default port (the suite's mqtt_broker_non_default_port, the variable
# mqtt_non_default_port).
listener 8085
mount_point 8085/

# The observer's own listener: no mount point, so '#' sees every listener.
# No endpoint names it.
listener 1880
