name: test-suite-multi

# Six broker identities, each over its own PostgreSQL server, for the distributed tree. A test registers brokers with
# one another, so every identity a topology names is a broker of its own; a setting that conflicts with no test of the
# identity it is added to shares that identity. The tests run in the runner service on the same network and reach
# every broker by its network name, which is also what a registration endpoint names; no service publishes a host
# port.

x-template: &template
  file: ../templates/docker-compose.yaml

# /info/sourceIdentity carries a deployment-specific member (Table 5.2.40-1), a table the configuration file alone
# sets.
x-configured: &configured
  command: ["--configuration", "/etc/andromeda/andromeda.toml"]
  volumes:
    - ./andromeda.toml:/etc/andromeda/andromeda.toml:ro

services:
  postgres-a:
    extends:
      <<: *template
      service: postgres
  postgres-b:
    extends:
      <<: *template
      service: postgres
  postgres-c:
    extends:
      <<: *template
      service: postgres
  postgres-d:
    extends:
      <<: *template
      service: postgres
  postgres-e:
    extends:
      <<: *template
      service: postgres
  postgres-f:
    extends:
      <<: *template
      service: postgres

  broker-a:
    <<: *configured
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-a:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1061"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-a:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-a"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-a"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-a:1061"

  broker-b:
    <<: *configured
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-b:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1062"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-b:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-b"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-b"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-b:1062"

  broker-c:
    <<: *configured
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-c:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1063"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-c:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-c"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-c"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-c:1063"

  broker-d:
    <<: *configured
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-d:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1064"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-d:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-d"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-d"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-d:1064"

  # Runs the temporal_linked_retrieval extension, which admits a q hop on the temporal operations, and the
  # language-ranges level of q_target_languages; it is the front broker of the files that negotiate that level with
  # the sources a read reaches. Brokers A to D run the specification alone, which the tests using them as sources
  # assert.
  broker-e:
    <<: *configured
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-e:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1065"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-e:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-e"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-e"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-e:1065"
      ANDROMEDA__EXTENSIONS__TEMPORAL_LINKED_RETRIEVAL__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__LEVEL: "language-ranges"

  # Runs the same language-ranges level, so a read reaching it from broker-e negotiates range filtering on both. It
  # gathers at most 5 distinct entities and 15 source rows for one forwarded query, so a test can reach either bound
  # with a handful of entities; the tests of the bounds forward to brokers B to E, so it cannot be one of them.
  broker-f:
    <<: *configured
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-f:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1066"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-f:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-f"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-f"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-f:1066"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__LEVEL: "language-ranges"
      ANDROMEDA__FEDERATION__FORWARDING__MAX_QUERY_ENTITIES: "5"
      ANDROMEDA__FEDERATION__FORWARDING__MAX_QUERY_SOURCE_ROWS: "15"

  runner:
    extends:
      <<: *template
      service: runner
    depends_on:
      broker-a:
        condition: service_healthy
      broker-b:
        condition: service_healthy
      broker-c:
        condition: service_healthy
      broker-d:
        condition: service_healthy
      broker-e:
        condition: service_healthy
      broker-f:
        condition: service_healthy
    env_file: runner.env

volumes:
  target:
    name: test-suite-target
  registry:
    name: test-suite-cargo-registry
