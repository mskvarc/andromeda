# The broker large notifications are published to: anonymous clients allowed.
# Mosquitto announces a 2,000,000 byte maximum packet by default, and an MQTT 5
# publisher holds to it, so this one allows 64 MiB. No other test shares it, as
# its observer holds a message of several MiB for seconds.
allow_anonymous true
max_packet_size 67108864

# The default port the endpoints name, with the same mount point as the other
# brokers.
listener 1883
mount_point 1883/

# The observer's own listener, no mount point. No endpoint names it.
listener 1880
