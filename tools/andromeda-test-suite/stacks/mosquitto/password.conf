# The broker the ETSI MQTT ports name as mqtt_auth_host: the suite's password
# file (user_with_password, password) and anonymous clients refused on the ports
# endpoints name, as the suite's mosquitto_with_user.conf.
password_file /mosquitto/config/mosquitto_pwd

# The default port, credentials required.
listener 1883
listener_allow_anonymous false
mount_point 1883/

# The non-default port, credentials required.
listener 8085
listener_allow_anonymous false
mount_point 8085/

# The observer's own listener, anonymous, no mount point. No endpoint names it.
listener 1880
listener_allow_anonymous true
