name: test-suite-andromeda

# Brokers configured for Andromeda's own behaviour, for the andromeda tree. The front broker runs on the broker's
# defaults with every extension enabled. Settings that conflict with neither the front broker's nor each other's share
# a broker; a broker of its own is kept only for a process-wide mode, or for a setting that changes what another
# broker's tests assert, and its comment names that conflict.
#
# The tests run in the runner service on the same network and reach every broker by its network name; no service
# publishes a host port.

x-template: &template
  file: ../templates/docker-compose.yaml

services:
  postgres:
    extends:
      <<: *template
      service: postgres

  broker:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1071"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker:1071"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__PURGE_DATASET_SCOPE__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_LINKED_RETRIEVAL__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__NEAR_DISTANCE_BAND__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TENANT_MANAGEMENT__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__ACCEPT_LANGUAGE__MODE: "enabled"
      # Bounds small enough for one file's own data to reach the TooManyResults refusal.
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY__MAX_MATCHES: "2"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING__MAX_GROUPS: "3"
      # The position budget of runner.env, so a geometry one position over it stays a small payload.
      ANDROMEDA__REQUEST_LIMITS__MAX_GEOMETRY_POSITIONS: "100000"

  postgres-conformance:
    extends:
      <<: *template
      service: postgres

  # Conformance mode forces every extension off, which no test of another broker can share; the flags stay on to
  # show the mode overrides them.
  broker-conformance:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-conformance:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1072"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-conformance:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-conformance"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-conformance"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-conformance:1072"
      ANDROMEDA__EXTENSIONS__MODE: "conformance"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__PURGE_DATASET_SCOPE__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_LINKED_RETRIEVAL__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__ACCEPT_LANGUAGE__MODE: "enabled"

  postgres-not-recorded:
    extends:
      <<: *template
      service: postgres

  # Leaves Core writes out of the Temporal Evolution, a process-wide history mode the front broker's tests read back
  # from /temporal. Every other setting is the broker default, the extension flags and the position budget included.
  # It advertises no URL of its own, so it mints the origin a request addressed, and believes forwarded fields only
  # from TEST-NET-1 (RFC 5737), a range the runner is never in.
  broker-not-recorded:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-not-recorded:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1073"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-not-recorded:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-not-recorded"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-not-recorded"
      ANDROMEDA__TEMPORAL__HISTORY__CORE_WRITES: "not-recorded"
      ANDROMEDA__HTTP__FORWARDED__TRUST: "proxies"
      ANDROMEDA__HTTP__FORWARDED__PROXIES: "192.0.2.0/24"

  postgres-tls:
    extends:
      <<: *template
      service: postgres

  # Terminates TLS itself on TCP and serves HTTP/3 over QUIC on the same port number, both presenting the shared
  # identity in ./tls, a transport no plain-HTTP test can reach. Client certificates from client-ca.crt are optional,
  # and the management listener terminates TLS too.
  broker-tls:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-tls:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1074"
      ANDROMEDA__SERVER__TRANSPORT: "tls"
      ANDROMEDA__SERVER__HTTP3__MODE: "enabled"
      ANDROMEDA__TLS__CERTIFICATE: "/etc/andromeda/tls/broker.crt"
      ANDROMEDA__TLS__PRIVATE_KEY: "/etc/andromeda/tls/broker.key"
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__MODE: "optional"
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__CA: "/etc/andromeda/tls/client-ca.crt"
      ANDROMEDA__HTTP__SECURITY_HEADERS__STRICT_TRANSPORT_SECURITY__MODE: "enabled"
      ANDROMEDA__MANAGEMENT__PORT: "1075"
      ANDROMEDA__MANAGEMENT__TRANSPORT: "tls"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-tls:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-tls"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-tls"
    volumes:
      - ./tls:/etc/andromeda/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/etc/andromeda/tls/ca.crt https://localhost:1074/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]

  postgres-durable:
    extends:
      <<: *template
      service: postgres

  # Durable notification delivery: every notification is queued in the tenant database and sent by the delivery
  # worker, a process-wide mode under which the live-delivery tests of the front broker would assert another path. A
  # tenant holds at most three Snapshots, and an operation scoped to a Snapshot still preparing waits two seconds for
  # it; the quota is counted per tenant, so every Snapshot test on this broker works in a tenant of its own.
  broker-durable:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-durable:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1076"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-durable:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-durable"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-durable"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-durable:1076"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__MODE: "durable"
      ANDROMEDA__SNAPSHOT__QUOTA__MAX_PER_TENANT: "3"
      ANDROMEDA__SNAPSHOT__PREPARATION__SCOPED_OPERATION_TIMEOUT: "2s"

  postgres-single-tenant:
    extends:
      <<: *template
      service: postgres

  # Multi-tenancy off, so a request naming a tenant is refused: no test that works in a private tenant can run here.
  # Durable delivery with an HTTP notification body limit of 1 KiB, and a queue that polls and retries within a
  # second, so a test sees a failing delivery run out of its four attempts while it waits; the durable broker's tests
  # notify bodies over 1 KiB and wait out its default retries.
  broker-single-tenant:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-single-tenant:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1077"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-single-tenant:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-single-tenant"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-single-tenant"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-single-tenant:1077"
      ANDROMEDA__TENANCY__MODE: "disabled"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__MODE: "durable"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__MAX_HTTP_BODY: "1 KiB"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__POLL_INTERVAL: "100ms"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__MAX_POLL_INTERVAL: "1s"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__MAX_ATTEMPTS: "4"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__RETRY_INTERVAL: "100ms"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__MAX_RETRY_INTERVAL: "1s"

  postgres-edge:
    extends:
      <<: *template
      service: postgres

  # Trusts the Forwarded and X-Forwarded-Proto fields a client sends, as a broker behind a TLS terminator does, so it
  # mints the scheme they name; the front broker's tests mint the origin they addressed. It advertises no URL of its
  # own: a configured apiRoot outranks the request's origin, forwarded scheme included. Collections page by offset
  # unless a client opts into a cursor walk with an empty cursor. It runs the language-ranges level of
  # q_target_languages, which reads a q target language as an RFC 4647 extended range; the front broker keeps the
  # clause 4.9 grammar.
  broker-edge:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-edge:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1078"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-edge:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-edge"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-edge"
      ANDROMEDA__HTTP__FORWARDED__TRUST: "proxies"
      ANDROMEDA__HTTP__FORWARDED__PROXIES: "0.0.0.0/0,::/0"
      ANDROMEDA__EXTENSIONS__CURSOR_PAGINATION__MODE: "available"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__MODE: "language-ranges"
      ANDROMEDA__FEDERATION__FORWARDING__FEDERATED_AGGREGATION: "instances"

  postgres-prefixed:
    extends:
      <<: *template
      service: postgres

  # Advertises an apiRoot under a path prefix on an origin nothing serves, the URL a reverse proxy mounting the broker
  # under /broker would publish, which every URL another broker's tests read would carry. Cursor pagination is off, so
  # collections page by offset alone, where the edge broker offers cursors. It runs the language-tags level of
  # q_target_languages, which admits every RFC 5646 tag as a q target language and conflicts with the edge broker's
  # level; the front broker keeps the clause 4.9 grammar, which Annex C.5.13.2's marque[en-GB] is refused under.
  broker-prefixed:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-prefixed:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1079"
      ANDROMEDA__DATABASE__URL: "postgres://postgres:postgres@postgres-prefixed:5432/postgres"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-prefixed"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-prefixed"
      ANDROMEDA__SERVER__PUBLIC_URL: "https://gw.example.com/broker"
      ANDROMEDA__EXTENSIONS__CURSOR_PAGINATION__MODE: "disabled"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__MODE: "language-tags"

  runner:
    extends:
      <<: *template
      service: runner
    depends_on:
      broker:
        condition: service_healthy
      broker-conformance:
        condition: service_healthy
      broker-not-recorded:
        condition: service_healthy
      broker-tls:
        condition: service_healthy
      broker-durable:
        condition: service_healthy
      broker-single-tenant:
        condition: service_healthy
      broker-edge:
        condition: service_healthy
      broker-prefixed:
        condition: service_healthy
    env_file: runner.env

volumes:
  target:
    name: test-suite-target
  registry:
    name: test-suite-cargo-registry
