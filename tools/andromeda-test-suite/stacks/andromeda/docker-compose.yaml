name: test-suite-andromeda

# Brokers configured for Andromeda's own behaviour, for the andromeda tree. The front broker runs on the broker's
# defaults with every extension enabled. Settings that conflict with neither the front broker's nor each other's share
# a broker; a broker of its own is kept only for a process-wide mode, or for a setting that changes what another
# broker's tests assert, and its comment names that conflict.
#
# The tests run in the runner service on the same network and reach every broker by its network name; no service
# publishes a host port.

x-template: &template
  file: ../templates/docker-compose.yaml

services:
  postgres:
    extends:
      <<: *template
      service: postgres

  broker:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1071"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker:1071"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__PURGE_DATASET_SCOPE__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_LINKED_RETRIEVAL__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__NEAR_DISTANCE_BAND__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TENANT_MANAGEMENT__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__ACCEPT_LANGUAGE__MODE: "enabled"
      # Bounds small enough for one file's own data to reach the TooManyResults refusal.
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY__MAX_MATCHES: "2"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING__MAX_GROUPS: "3"
      # The position budget of runner.env, so a geometry one position over it stays a small payload.
      ANDROMEDA__REQUEST_LIMITS__MAX_GEOMETRY_POSITIONS: "100000"
      # The page ceiling of runner.env: nine entities of 935,000 bytes render past it, eight under it.
      ANDROMEDA__REQUEST_LIMITS__MAX_PAGE_BYTES: "8 MiB"

  postgres-conformance:
    extends:
      <<: *template
      service: postgres

  # Conformance mode forces every extension off, which no test of another broker can share; the flags stay on to
  # show the mode overrides them.
  broker-conformance:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-conformance:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1072"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-conformance:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-conformance"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-conformance"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-conformance:1072"
      ANDROMEDA__EXTENSIONS__MODE: "conformance"
      ANDROMEDA__EXTENSIONS__TEMPORAL_DELETE_BY_QUERY__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__PURGE_DATASET_SCOPE__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_AGGREGATION_GROUPING__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__TEMPORAL_LINKED_RETRIEVAL__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__ACCEPT_LANGUAGE__MODE: "enabled"

  postgres-not-recorded:
    extends:
      <<: *template
      service: postgres

  # Leaves Core writes out of the Temporal Evolution, a process-wide history mode the front broker's tests read back
  # from /temporal. Every other setting is the broker default, the extension flags and the position budget included.
  # It advertises no URL of its own, so it mints the origin a request addressed, and believes forwarded fields only
  # from TEST-NET-1 (RFC 5737), a range the runner is never in.
  broker-not-recorded:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-not-recorded:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1073"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-not-recorded:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-not-recorded"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-not-recorded"
      ANDROMEDA__TEMPORAL__HISTORY__CORE_WRITES: "not-recorded"
      ANDROMEDA__HTTP__FORWARDED__TRUST: "proxies"
      ANDROMEDA__HTTP__FORWARDED__PROXIES: "192.0.2.0/24"

  postgres-tls:
    extends:
      <<: *template
      service: postgres

  # Terminates TLS itself on TCP and serves HTTP/3 over QUIC on the same port number, both presenting the shared
  # identity in ./tls, a transport no plain-HTTP test can reach. Client certificates from client-ca.crt are optional,
  # and the management listener terminates TLS too.
  broker-tls:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-tls:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1074"
      ANDROMEDA__SERVER__TRANSPORT: "tls"
      ANDROMEDA__SERVER__HTTP3__MODE: "enabled"
      ANDROMEDA__TLS__CERTIFICATE: "/etc/andromeda/tls/broker.crt"
      ANDROMEDA__TLS__PRIVATE_KEY: "/etc/andromeda/tls/broker.key"
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__MODE: "optional"
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__CA: "/etc/andromeda/tls/client-ca.crt"
      ANDROMEDA__HTTP__SECURITY_HEADERS__STRICT_TRANSPORT_SECURITY__MODE: "enabled"
      ANDROMEDA__MANAGEMENT__PORT: "1075"
      ANDROMEDA__MANAGEMENT__TRANSPORT: "tls"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-tls:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-tls"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-tls"
    volumes:
      - ./tls:/etc/andromeda/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/etc/andromeda/tls/ca.crt https://localhost:1074/ngsi-ld/v1/health >/dev/null 2>&1 || exit 1"]

  # Copies the initial identities of the brokers whose identity tests rewrite into volumes the runner writes too: the
  # repository is mounted read-only, and a broker reloads the files it watches.
  identity-seed:
    image: busybox:1.37
    volumes:
      - ./tls:/stack-tls:ro
      - mutual-identity:/identities/mutual
      - rotating-identity:/identities/rotating
    command:
      - sh
      - -c
      - >-
        rm -f /identities/mutual/.tls.* /identities/rotating/.tls.* &&
        cp /stack-tls/mutual.crt /identities/mutual/tls.crt && cp /stack-tls/mutual.key /identities/mutual/tls.key &&
        cp /stack-tls/rotating.crt /identities/rotating/tls.crt && cp /stack-tls/rotating.key /identities/rotating/tls.key &&
        chmod 0644 /identities/mutual/tls.crt /identities/mutual/tls.key /identities/rotating/tls.crt /identities/rotating/tls.key

  postgres-mutual:
    extends:
      <<: *template
      service: postgres

  # A TLS 1.3 floor and required client certificates, which refuse the clients of the TLS broker's tests that present
  # none or offer TLS 1.2. Its identity, the leaf mutual.crt for the name broker-mutual, sits in a volume a test
  # overwrites with a broken certificate; the broker refuses that reload and keeps the same identity in service, so no
  # other test of this broker sees it.
  broker-mutual:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-mutual:
        condition: service_healthy
      identity-seed:
        condition: service_completed_successfully
    environment:
      ANDROMEDA__SERVER__PORT: "1080"
      ANDROMEDA__SERVER__TRANSPORT: "tls"
      ANDROMEDA__TLS__CERTIFICATE: "/etc/andromeda/identity/tls.crt"
      ANDROMEDA__TLS__PRIVATE_KEY: "/etc/andromeda/identity/tls.key"
      ANDROMEDA__TLS__RELOAD_SETTLE_AFTER: "500ms"
      ANDROMEDA__TLS__MINIMUM_PROTOCOL_VERSION: "tls1.3"
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__MODE: "required"
      ANDROMEDA__TLS__CLIENT_AUTHENTICATION__CA: "/etc/andromeda/tls/client-ca.crt"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-mutual:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-mutual"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-mutual"
    volumes:
      - ./tls:/etc/andromeda/tls:ro
      - mutual-identity:/etc/andromeda/identity:ro
    healthcheck:
      # The plaintext management listener answers without a client certificate.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1086/readyz >/dev/null 2>&1 || exit 1"]

  postgres-rotating:
    extends:
      <<: *template
      service: postgres

  # Its identity, the leaf rotating.crt or rotated.crt for the name broker-rotating, sits in a volume a test swaps
  # between the two; a test of the certificate another broker presents would see the swap.
  broker-rotating:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-rotating:
        condition: service_healthy
      identity-seed:
        condition: service_completed_successfully
    environment:
      ANDROMEDA__SERVER__PORT: "1081"
      ANDROMEDA__SERVER__TRANSPORT: "tls"
      ANDROMEDA__TLS__CERTIFICATE: "/etc/andromeda/identity/tls.crt"
      ANDROMEDA__TLS__PRIVATE_KEY: "/etc/andromeda/identity/tls.key"
      ANDROMEDA__TLS__RELOAD_SETTLE_AFTER: "500ms"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-rotating:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-rotating"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-rotating"
    volumes:
      - rotating-identity:/etc/andromeda/identity:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1086/readyz >/dev/null 2>&1 || exit 1"]

  postgres-durable:
    extends:
      <<: *template
      service: postgres

  # Durable notification delivery: every notification is queued in the tenant database and sent by the delivery
  # worker, a process-wide mode under which the live-delivery tests of the front broker would assert another path. A
  # tenant holds at most three Snapshots, and an operation scoped to a Snapshot still preparing waits two seconds for
  # it; the quota is counted per tenant, so every Snapshot test on this broker works in a tenant of its own.
  broker-durable:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-durable:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1076"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-durable:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-durable"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-durable"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-durable:1076"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__MODE: "durable"
      ANDROMEDA__SNAPSHOT__QUOTA__MAX_PER_TENANT: "3"
      ANDROMEDA__SNAPSHOT__PREPARATION__SCOPED_OPERATION_TIMEOUT: "2s"

  postgres-single-tenant:
    extends:
      <<: *template
      service: postgres

  # Multi-tenancy off, so a request naming a tenant is refused: no test that works in a private tenant can run here.
  # Durable delivery with a request body limit of 4 KiB and an HTTP notification body limit of 5 KiB, and a queue that
  # polls and retries within a second, so a test sees a failing delivery run out of its four attempts while it waits;
  # the durable broker's tests notify bodies these limits would refuse and wait out its default retries. It fetches no
  # remote @context, so a test sees what a broker without internet access resolves; the front broker's tests serve
  # the @contexts they name.
  broker-single-tenant:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-single-tenant:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1077"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-single-tenant:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-single-tenant"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-single-tenant"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-single-tenant:1077"
      ANDROMEDA__TENANCY__MODE: "disabled"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__MODE: "durable"
      ANDROMEDA__REQUEST_LIMITS__MAX_BODY: "4 KiB"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__MAX_HTTP_BODY: "5 KiB"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__POLL_INTERVAL: "100ms"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__MAX_POLL_INTERVAL: "1s"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__MAX_ATTEMPTS: "4"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__RETRY_INTERVAL: "100ms"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__QUEUE__MAX_RETRY_INTERVAL: "1s"
      ANDROMEDA__JSONLD__FETCH__MODE: "disabled"

  postgres-edge:
    extends:
      <<: *template
      service: postgres

  # Trusts the Forwarded and X-Forwarded-Proto fields a client sends, as a broker behind a TLS terminator does, so it
  # mints the scheme they name; the front broker's tests mint the origin they addressed. It advertises no URL of its
  # own: a configured apiRoot outranks the request's origin, forwarded scheme included. Collections page by offset
  # unless a client opts into a cursor walk with an empty cursor. It runs the language-ranges level of
  # q_target_languages, which reads a q target language as an RFC 4647 extended range; the front broker keeps the
  # clause 4.9 grammar.
  broker-edge:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-edge:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1078"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-edge:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-edge"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-edge"
      ANDROMEDA__HTTP__FORWARDED__TRUST: "proxies"
      ANDROMEDA__HTTP__FORWARDED__PROXIES: "0.0.0.0/0,::/0"
      ANDROMEDA__EXTENSIONS__CURSOR_PAGINATION__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__CURSOR_PAGINATION__FRESH_REQUESTS: "offset"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__LEVEL: "language-ranges"
      ANDROMEDA__FEDERATION__QUERY__AGGREGATION: "instances"

  # Terminates TLS in front of the edge broker, the clause 6.2 model where a proxy meets the requirement for a
  # plaintext broker that believes the forwarded fields the proxy sets. It presents the leaf terminator.crt for the name
  # terminator, and its plaintext listener redirects to its TLS listener.
  terminator:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      broker-edge:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-prefixed:
    extends:
      <<: *template
      service: postgres

  # Advertises an apiRoot under a path prefix on an origin nothing serves, the URL a reverse proxy mounting the broker
  # under /broker would publish, which every URL another broker's tests read would carry. Cursor pagination is off, so
  # collections page by offset alone, where the edge broker offers cursors. It runs the language-tags level of
  # q_target_languages, which admits every RFC 5646 tag as a q target language and conflicts with the edge broker's
  # level; the front broker keeps the clause 4.9 grammar, which Annex C.5.13.2's marque[en-GB] is refused under.
  broker-prefixed:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-prefixed:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1079"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-prefixed:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-prefixed"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-prefixed"
      ANDROMEDA__SERVER__PUBLIC_URL: "https://gw.example.com/broker"
      ANDROMEDA__EXTENSIONS__CURSOR_PAGINATION__MODE: "disabled"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__MODE: "enabled"
      ANDROMEDA__EXTENSIONS__Q_TARGET_LANGUAGES__LEVEL: "language-tags"

  postgres-observed:
    extends:
      <<: *template
      service: postgres

  # Serves its Prometheus metrics on the management port. Only the metrics tests talk to it, since a request from any
  # other test would move the series they read, and a write from one would keep a gauge fresh that they wait to see
  # go untouched.
  broker-observed:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-observed:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1082"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-observed:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-observed"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-observed"
      ANDROMEDA__OBSERVABILITY__METRICS__PROMETHEUS__MODE: "enabled"

  postgres-waker:
    extends:
      <<: *template
      service: postgres

  # Four tenants loaded at once, the default tenant among them, so ten tenants with periodic work keep the waker
  # loading one about every 0.7 s. A woken tenant is protected for one second, so the slots it holds free again in
  # time; at the template's woken lifetime the protected tenants alone would outnumber the slots and wakes would be
  # deferred. The front broker's tests load tenants this residency would keep unloading.
  broker-waker:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-waker:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1083"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-waker:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-waker"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-waker"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-waker:1083"
      ANDROMEDA__TENANCY__RESIDENCY__MAX_RESIDENT: "4"
      ANDROMEDA__TENANCY__RESIDENCY__MIN_WAKE_INTERVAL: "5s"
      ANDROMEDA__TENANCY__RESIDENCY__WOKEN_LIFETIME: "1s"

  postgres-backlog:
    extends:
      <<: *template
      service: postgres

  # Four tenants loaded at once, the default tenant among them, a woken tenant kept loaded for five seconds and an
  # unloaded tenant woken again after one: forty tenants notified every second need forty loads a second from three
  # places, so wakes fall behind and the broker reports them overdue. Its metrics are read whole, so no other test may
  # load tenants on it.
  broker-backlog:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-backlog:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1084"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-backlog:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-backlog"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-backlog"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-backlog:1084"
      ANDROMEDA__OBSERVABILITY__METRICS__PROMETHEUS__MODE: "enabled"
      ANDROMEDA__TENANCY__RESIDENCY__MAX_RESIDENT: "4"
      ANDROMEDA__TENANCY__RESIDENCY__MIN_WAKE_INTERVAL: "1s"
      ANDROMEDA__TENANCY__RESIDENCY__WOKEN_LIFETIME: "5s"

  postgres-roomy:
    extends:
      <<: *template
      service: postgres

  # A five-second woken lifetime and a five-second wait before an unloaded tenant is woken again, with room for forty
  # tenants beside the default one, so forty tenants stay loaded and no wake is overdue. Two connections per tenant keep 41 loaded tenants and the platform pool
  # under the server's max_connections. Its metrics are read whole, so no other test may load tenants on it.
  broker-roomy:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-roomy:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1085"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-roomy:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-roomy"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-roomy"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-roomy:1085"
      ANDROMEDA__OBSERVABILITY__METRICS__PROMETHEUS__MODE: "enabled"
      ANDROMEDA__TENANCY__DATABASES__MAX_CONNECTIONS: "2"
      ANDROMEDA__TENANCY__RESIDENCY__MAX_RESIDENT: "41"
      ANDROMEDA__TENANCY__RESIDENCY__MIN_WAKE_INTERVAL: "5s"
      ANDROMEDA__TENANCY__RESIDENCY__WOKEN_LIFETIME: "5s"

  postgres-overloaded:
    extends:
      <<: *template
      service: postgres

  # The backlog broker's places and wake timings: forty tenants notified every second need forty loads a second from
  # three places, so every place stays taken and the waker has room only as a woken tenant's work drains or its
  # lifetime ends. Its metrics are read whole, so no other test may load tenants on it.
  broker-overloaded:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-overloaded:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1088"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-overloaded:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-overloaded"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-overloaded"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-overloaded:1088"
      ANDROMEDA__OBSERVABILITY__METRICS__PROMETHEUS__MODE: "enabled"
      ANDROMEDA__TENANCY__RESIDENCY__MAX_RESIDENT: "4"
      ANDROMEDA__TENANCY__RESIDENCY__MIN_WAKE_INTERVAL: "1s"
      ANDROMEDA__TENANCY__RESIDENCY__WOKEN_LIFETIME: "5s"

  # Announces a 1 MiB maximum packet in its CONNACK, below broker-oversized's 2 MiB max_mqtt_packet. Only the tests of
  # oversized MQTT notifications publish to it.
  mosquitto-capped:
    image: eclipse-mosquitto:2.1.2-alpine
    command: ["mosquitto", "-c", "/mosquitto/config/capped.conf"]
    volumes:
      - ../mosquitto:/mosquitto/config:ro
    healthcheck:
      # Any $SYS message proves the broker accepts clients.
      test: ["CMD", "mosquitto_sub", "-p", "1883", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  postgres-oversized:
    extends:
      <<: *template
      service: postgres

  # Serves its Prometheus metrics, and only the test of notifications refused for their size talks to it, so the
  # oversized-notification counter it exposes moves only with what that test sends.
  broker-oversized:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-oversized:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1087"
      ANDROMEDA__DATABASE__URL: "postgres://andromeda:andromeda@postgres-oversized:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:broker-oversized"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "broker-oversized"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-oversized:1087"
      ANDROMEDA__OBSERVABILITY__METRICS__PROMETHEUS__MODE: "enabled"
      # A packet limit above mosquitto-capped's 1 MiB, so an MQTT 5 notification between the two is refused under the
      # announced maximum and an MQTT 3.1.1 one, which no server bounds, under max_mqtt_packet. max_mqtt_packet must
      # stay above max_body.
      ANDROMEDA__REQUEST_LIMITS__MAX_BODY: "1800 KiB"
      ANDROMEDA__NOTIFICATIONS__DELIVERY__MAX_MQTT_PACKET: "2 MiB"

  runner:
    extends:
      <<: *template
      service: runner
    depends_on:
      broker:
        condition: service_healthy
      broker-conformance:
        condition: service_healthy
      broker-not-recorded:
        condition: service_healthy
      broker-tls:
        condition: service_healthy
      broker-mutual:
        condition: service_healthy
      broker-rotating:
        condition: service_healthy
      broker-durable:
        condition: service_healthy
      broker-single-tenant:
        condition: service_healthy
      broker-edge:
        condition: service_healthy
      terminator:
        condition: service_healthy
      broker-prefixed:
        condition: service_healthy
      broker-observed:
        condition: service_healthy
      broker-waker:
        condition: service_healthy
      broker-backlog:
        condition: service_healthy
      broker-roomy:
        condition: service_healthy
      broker-overloaded:
        condition: service_healthy
      broker-oversized:
        condition: service_healthy
      mosquitto-capped:
        condition: service_healthy
    volumes:
      - mutual-identity:/identities/mutual
      - rotating-identity:/identities/rotating
    env_file: runner.env

volumes:
  mutual-identity:
  rotating-identity:
  target:
    name: test-suite-target
  registry:
    name: test-suite-cargo-registry
