events {}

http {
    # The compose healthcheck's probe, reachable only from inside the container.
    server {
        listen 127.0.0.1:8081;
        location / {
            return 204;
        }
    }

    server {
        listen 8080;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/tls/terminator.crt;
        ssl_certificate_key /etc/nginx/tls/terminator.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 64m;

        location / {
            proxy_pass http://broker-edge:1078;
            proxy_http_version 1.1;

            # $host would drop the port from the URLs the broker mints.
            proxy_set_header Host $http_host;

            # Set, never appended to: a value the client sent does not reach the broker. A host with a port is not a
            # token, so it is quoted (IETF RFC 7239 section 4).
            proxy_set_header Forwarded "proto=$scheme;host=\"$http_host\"";
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
