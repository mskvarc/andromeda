;; The settings every pooler of the pgbouncer stack shares unless it includes settings-tight.ini instead. Each pooler's
;; own file names the one PostgreSQL server it fronts and includes this one.
;; No user= on the route: every tenant database shares the one login, so a database arriving while
;; max_user_connections is held by idle servers of other databases takes one of them at once.
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
pool_mode = transaction
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = andromeda
stats_users = andromeda
max_client_conn = 5000
default_pool_size = 8
min_pool_size = 0
reserve_pool_size = 2
reserve_pool_timeout = 3
server_idle_timeout = 30
max_user_connections = 120
max_db_connections = 40
max_prepared_statements = 64
ignore_startup_parameters = extra_float_digits,IntervalStyle,DateStyle,TimeZone,client_encoding
;; A transaction queued behind a saturated pool waits this long for a server connection before it is shed, which the
;; broker answers 503 with Retry-After.
query_wait_timeout = 15
