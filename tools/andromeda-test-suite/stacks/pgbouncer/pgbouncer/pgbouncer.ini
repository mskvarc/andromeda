;; The transaction pooler the pgbouncer stack's broker serves every request through.
;; One route for every database and no user= on it: every tenant database shares the one login, so a database
;; arriving while max_user_connections is held by idle servers of other databases takes one of them at once.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
pool_mode = transaction
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
max_client_conn = 5000
default_pool_size = 8
min_pool_size = 0
reserve_pool_size = 2
reserve_pool_timeout = 3
server_idle_timeout = 30
max_user_connections = 120
max_db_connections = 40
max_prepared_statements = 64
ignore_startup_parameters = extra_float_digits,IntervalStyle,DateStyle,TimeZone,client_encoding
query_wait_timeout = 15
