;; The settings of the poolers whose tests need small pools: two server connections per database and one in reserve,
;; servers released five seconds after their last transaction, and a prepared-statement cache small enough for a test
;; to overflow it.
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
pool_mode = transaction
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
max_client_conn = 5000
default_pool_size = 2
min_pool_size = 0
reserve_pool_size = 1
reserve_pool_timeout = 3
server_idle_timeout = 5
max_user_connections = 120
max_db_connections = 20
max_prepared_statements = 32
ignore_startup_parameters = extra_float_digits,IntervalStyle,DateStyle,TimeZone,client_encoding
query_wait_timeout = 15
