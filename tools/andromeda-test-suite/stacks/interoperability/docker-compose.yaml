name: test-suite-interoperability

# Five broker identities, each over a database server of its own, for the interoperability test target: the ETSI
# interoperability cases name five brokers, so none can be merged. The brokers reach one another by their service
# names and the runner reaches each the same way, so a registration endpoint and a hosted @context resolve identically
# for both. No service publishes a host port.

x-template: &template
  file: ../templates/docker-compose.yaml

# Five servers share one host. A server sizes its buffers and its work memory from the memory it sees, so each would
# size itself for the whole host and together they would outgrow it; tuned for 1 GB, they fit beside the brokers on a
# host of 8 GB.
x-postgres: &postgres
  extends:
    <<: *template
    service: postgres
  environment:
    TS_TUNE_MEMORY: 1GB

services:
  postgres-1:
    <<: *postgres

  broker-1:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-1:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__CONNECTION: "postgres://andromeda:andromeda@postgres-1:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:interoperability-1"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "interoperability-1"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-1:1056"

  postgres-2:
    <<: *postgres

  broker-2:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-2:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__CONNECTION: "postgres://andromeda:andromeda@postgres-2:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:interoperability-2"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "interoperability-2"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-2:1056"

  postgres-3:
    <<: *postgres

  broker-3:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-3:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__CONNECTION: "postgres://andromeda:andromeda@postgres-3:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:interoperability-3"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "interoperability-3"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-3:1056"

  postgres-4:
    <<: *postgres

  broker-4:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-4:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__CONNECTION: "postgres://andromeda:andromeda@postgres-4:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:interoperability-4"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "interoperability-4"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-4:1056"

  postgres-5:
    <<: *postgres

  broker-5:
    extends:
      <<: *template
      service: broker
    depends_on:
      postgres-5:
        condition: service_healthy
    environment:
      ANDROMEDA__SERVER__PORT: "1056"
      ANDROMEDA__DATABASE__CONNECTION: "postgres://andromeda:andromeda@postgres-5:5432/andromeda"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ID: "urn:ngsi-ld:ContextSourceIdentity:interoperability-5"
      ANDROMEDA__FEDERATION__IDENTITY__SOURCE_ALIAS: "interoperability-5"
      ANDROMEDA__SERVER__PUBLIC_URL: "http://broker-5:1056"

  runner:
    extends:
      <<: *template
      service: runner
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
      broker-4:
        condition: service_healthy
      broker-5:
        condition: service_healthy
    env_file: runner.env

volumes:
  target:
    name: test-suite-target
  registry:
    name: test-suite-cargo-registry
