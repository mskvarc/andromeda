# The services every stack extends; not a stack of its own. Relative paths resolve from this directory.
#
# Each broker of a stack is an identity over a PostgreSQL server of its own: replicas are not supported, so no two
# brokers share a server, a database or a tenant database.
#
# The images are tagged :local and built from the working tree when missing; `up --build` rebuilds them first.
# ANDROMEDA_IMAGE, ANDROMEDA_POSTGRES_IMAGE and ANDROMEDA_TEST_SUITE_RUNNER_IMAGE name another image, such as a pulled
# release. ANDROMEDA_PULL_POLICY and ANDROMEDA_POSTGRES_PULL_POLICY override when the broker and database images are
# pulled or built.

services:
  postgres:
    image: ${ANDROMEDA_POSTGRES_IMAGE:-andromeda-postgresql:local}
    pull_policy: ${ANDROMEDA_POSTGRES_PULL_POLICY:-missing}
    build:
      context: ../../../../docker/images/postgresql
    # Docker's default 64 MB /dev/shm holds Postgres's dynamic shared memory: the cumulative statistics hash grows
    # with the relations of every tenant database, and a few hundred private tenants fill it.
    shm_size: 1gb
    environment:
      POSTGRES_PASSWORD: andromeda
    # Probed over TCP. The server the entrypoint starts to initialise a new data directory listens on the socket alone,
    # and a broker started against it is refused once that server stops for the real one. Every server of a stack
    # initialises at once, which takes about a minute on a host of two CPUs, so a probe failing in the first two minutes
    # does not count.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U andromeda"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 2m
      start_interval: 1s

  # Only the settings that differ from the broker's defaults, all timings and pool sizes: every behaviour a test reads
  # is the broker's default unless the stack says otherwise.
  broker:
    image: ${ANDROMEDA_IMAGE:-andromeda:local}
    pull_policy: ${ANDROMEDA_PULL_POLICY:-missing}
    build:
      context: ../../../..
      dockerfile: docker/images/andromeda/Dockerfile
    restart: unless-stopped
    environment:
      ANDROMEDA__EXPIRY__SWEEP_INTERVAL: "1s"
      ANDROMEDA__JSONLD__CACHE__HOSTED_REVALIDATION_INTERVAL: "2s"
    healthcheck:
      # Probes the listener the environment configures: the management listener unless a stack disables it.
      test: ["CMD", "andromeda", "health"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  # The repository is mounted read-only; builds go to the target volume, and the registry volume keeps dependencies
  # between runs. Every stack shares both volumes, so a target compiled for one stack serves the others.
  runner:
    image: ${ANDROMEDA_TEST_SUITE_RUNNER_IMAGE:-andromeda-test-suite-runner:local}
    build:
      context: ../runner
      target: toolchain
    profiles: ["runner"]
    working_dir: /andromeda/tools/andromeda-test-suite
    # A mount nested in the read-only checkout needs its mountpoint to exist there already, which a fresh clone's
    # missing target directory does not, so the build goes to a volume outside the checkout.
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - ../../../..:/andromeda:ro
      - target:/target
      - registry:/usr/local/cargo/registry

volumes:
  target:
    name: test-suite-target
  registry:
    name: test-suite-cargo-registry
