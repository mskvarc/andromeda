[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
## [{{ version }}]{% if version is containing("-alpha.") %} 🌱{% elif version is containing("-beta.") %} 🌿{% elif version is containing("-rc.") %} 🏁{% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}
{% if not previous.version %}\
{% if version %}\
Initial release.
{% else %}\
🚧 Work in progress.
{% endif %}
{% else %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group }}
{% for commit in commits %}\
- {% if commit.scope %}`{{ commit.scope }}` — {% endif %}{{ commit.message }}{% if commit.breaking %} ⚠️ **BREAKING**{% endif %}
{% endfor %}
{% endfor %}\
{% endif %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
tag_pattern = "^v[1-9][0-9]*\\."
skip_tags = ""
ignore_tags = "^v1\\.0\\.0-"
sort_commits = "newest"
commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🔧 Refactor" },
    { message = "^style", group = "🎨 Style" },
    { message = "^test", group = "🧪 Tests" },
    { message = "^docs?", group = "📚 Documentation" },
    { message = "^build", group = "🏗️ Build" },
    { message = "^ci", group = "👷 CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "🧹 Chores" },
    { message = ".*", group = "💡 Other" },
]
