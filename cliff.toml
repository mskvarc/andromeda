[changelog]
header = """
# Changelog\n
"""
# Groups named in `internal` are listed only for the release GIT_CLIFF_TAG names, in a collapsed block, so the file keeps
# them for the newest release alone. Past 600 commits that block gives way to a link, which keeps a release body under
# GitHub's 125,000-character limit. Every other group is listed in the order of `commit_parsers`. Breaking commits are
# listed once, under Breaking changes, whatever their type.
body = """
{%- set repository = "https://github.com/mskvarc/andromeda" -%}
{%- set latest = get_env(name="GIT_CLIFF_TAG", default="") -%}
{%- set internal = ["🔧 Refactor", "📚 Documentation", "📦 Dependencies", "🏗️ Build", "👷 CI", "🧪 Tests", "🎨 Style", "🧹 Chores", "💡 Other"] -%}
{%- macro references(commit, repository) -%}
{%- set_global issues = [] -%}
{%- for footer in commit.footers -%}
{%- if footer.token in ["Closes", "Refs", "Fixes", "Resolves"] and footer.separator is containing("#") -%}
{%- set_global issues = issues | concat(with=footer.value) -%}
{%- endif -%}
{%- endfor -%}
{%- if issues | length > 0 %} ({% for issue in issues %}[#{{ issue }}]({{ repository }}/issues/{{ issue }}){% if not loop.last %}, {% endif %}{% endfor %}){% endif -%}
{%- endmacro -%}
{%- macro scope(commit) -%}
{% if commit.scope and commit.scope != "security" and commit.scope is not starting_with("deps") %}**{{ commit.scope }}:** {% endif %}
{%- endmacro -%}
{%- macro entry(commit, repository) -%}
{{ self::scope(commit=commit) }}{{ commit.message }}{{ self::references(commit=commit, repository=repository) }}
{%- endmacro -%}
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]({{ repository }}/{% if previous.version %}compare/{{ previous.version }}...{{ version }}{% else %}releases/tag/{{ version }}{% endif %}){% if version is containing("-alpha.") %} 🌱{% elif version is containing("-beta.") %} 🌿{% elif version is containing("-rc.") %} 🏁{% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]({{ repository }}/compare/{{ previous.version }}...HEAD)
{% endif %}
{% if version and version is containing("-") %}\
> [!WARNING]
> This is a pre-release. Its migrations are not sealed and can still change before the stable release. Don't upgrade a database you want to keep to it.

{% endif %}\
{% if message and message | trim != version %}\
{{ message | trim }}

{% endif %}\
{% if not previous.version %}\
Initial release.
{% else %}\
### Changes
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
#### ⚠️ Breaking changes
{% for commit in breaking %}
- {{ self::scope(commit=commit) }}{{ commit.message }}{% if commit.breaking_description != commit.message %}. {{ commit.breaking_description | indent(prefix="  ", first=false) }}{% endif %}{{ self::references(commit=commit, repository=repository) }}
{%- endfor %}
{% endif %}\
{% set_global internal_count = 0 %}\
{% for entry in commits | filter(attribute="breaking", value=false) | commit_groups(groups=commit_parsers_groups) %}\
{% if entry.group in internal %}\
{% set group_size = entry.commits | length %}{% set_global internal_count = internal_count + group_size %}\
{% else %}
#### {{ entry.group }}
{% for commit in entry.commits %}
- {{ self::entry(commit=commit, repository=repository) }}
{%- endfor %}
{% endif %}\
{% endfor %}\
{% if internal_count > 0 and version == latest %}\
{% if commits | length <= 600 %}
<details>
<summary>Internal changes ({{ internal_count }})</summary>
{% for entry in commits | filter(attribute="breaking", value=false) | commit_groups(groups=commit_parsers_groups) %}\
{% if entry.group in internal %}
#### {{ entry.group }}
{% for commit in entry.commits %}
- {{ self::entry(commit=commit, repository=repository) }}
{%- endfor %}
{% endif %}\
{% endfor %}
</details>
{% else %}
The {{ internal_count }} internal changes are left out of this list. The [commit history]({{ repository }}/commits/{{ version }}) has them.
{% endif %}\
{% endif %}\
{% endif %}
{# A blank line ends every release, so the heading after a `</details>` starts outside its HTML block. #}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[1-9][0-9]*\\."
skip_tags = ""
# A pre-release's commits belong to the stable release that follows it. Only a full run or an explicit range folds them:
# --current, --latest and --unreleased stop at the newest tag of any kind.
ignore_tags = "-(alpha|beta|rc)\\.[0-9]+$"
sort_commits = "newest"
# A bare `@word` (`@context`, `@id`) in a release body is a GitHub mention: it lists that account under the release's
# Contributors. A word opening a code span, a quoted JSON-LD keyword and an email address are left alone.
commit_preprocessors = [{ pattern = '(?m)(^|[^`\w@"])@([A-Za-z][\w-]*)', replace = '${1}`@${2}`' }]
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^[a-z]+\\(security\\)", group = "🔒 Security" },
    { message = "^[a-z]+(\\(.+\\))?: deprecate ", group = "🗑️ Deprecations" },
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🔧 Refactor" },
    { message = "^docs?", group = "📚 Documentation" },
    { message = "^build\\(deps(-dev)?\\)", group = "📦 Dependencies" },
    { message = "^build", group = "🏗️ Build" },
    { message = "^ci", group = "👷 CI" },
    { message = "^test", group = "🧪 Tests" },
    { message = "^style", group = "🎨 Style" },
    { message = "^chore", group = "🧹 Chores" },
    { message = ".*", group = "💡 Other" },
]
