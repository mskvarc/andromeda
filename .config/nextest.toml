# A test that bounds a broker's answer or its notifications by wall-clock time measures the broker alone; on a host of
# two CPUs, the tests running beside it push the broker past the bound, so it runs alone.
[[profile.suite.overrides]]
filter = '''
package(andromeda-test-suite) & binary(~ngsi_ld_)
  & test(/(^|::)(n_css_ntf_9013|n_ntf_trg_9029|n_ntf_trg_9030|n_ntf_trg_9034|n_snp_cre_8126)_/)'''
threads-required = "num-test-threads"

# A pgbouncer test evicts a tenant under the pressure of 40 others and waits up to 150 s to see it dormant, then a
# retry interval that has grown with the eviction, or drives load runs of a minute each over a hundred tenants it
# brings up first; one still running after ten minutes hangs.
[[profile.suite.overrides]]
filter = 'package(andromeda-test-suite) & binary(~pgbouncer_)'
test-group = 'pgbouncer'
slow-timeout = { period = "60s", terminate-after = 10 }

# The metrics test waits six minutes, past the broker's five-minute gauge idle timeout, before its last scrape.
[[profile.suite.overrides]]
filter = 'package(andromeda-test-suite) & binary(=andromeda_observability) & test(/(^|::)a_obs_met_9001_/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The wake backlog tests bring up forty tenants on a broker that keeps four loaded and then watch its wakes for up to a
# minute, and the clone tests first build a Snapshot of 40,000 Entities. On a host of two CPUs each takes two minutes or
# more, so one still running after five minutes hangs.
