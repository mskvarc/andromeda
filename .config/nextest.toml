# The default profile is nextest's own; the profiles below belong to andromeda-test-suite.

[test-groups]
# An exclusive registration conflicts with every exclusive or redirect registration of the same broker that matches its
# entity id and any of its Attributes, whatever the entity type (ETSI GS CIM 009 v1.9.1 clauses 4.3.6.3 and 5.9.2.4), so
# the interoperability cases cannot isolate their registrations from one another and run one at a time.
interoperability = { max-threads = 1 }
# A test that works in a Tenant of its own makes the broker create a database for it and run the migrations in it, and
# the broker keeps 16 tenant runtimes resident. With every test of a tree started at once those provisionings queue on
# the database server for longer than the broker's admission deadline, so the tests that provision tenants run four at
# a time, whatever the parallelism of the rest.
private-tenants = { max-threads = 4 }
# The pgbouncer stack runs thirteen brokers over thirteen PostgreSQL servers beside the runner. One of its tests at a
# time fits a host that holds the whole stack; more than one and the servers of the scale tests, each carrying a
# hundred tenant databases, drive the host past its memory and the brokers die under it.
pgbouncer = { max-threads = 1 }

# Every test runs in a process of its own beside every other, against the stack its test target uses. A failure is
# never retried: an intermittent failure is a defect to find, in the test's isolation or in the broker.
[profile.suite]
retries = 0
fail-fast = false
# The tests wait on the network, not the CPU.
test-threads = 64
# The longest test waits two periodic notifications ten seconds apart; a test still running after two minutes hangs.
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "fail"
final-status-level = "fail"

[[profile.suite.overrides]]
filter = 'binary_id(andromeda-test-suite::interoperability)'
test-group = 'interoperability'

# A pgbouncer test evicts a tenant under the pressure of 40 others and waits up to 150 s to see it dormant, then a
# retry interval that has grown with the eviction, or drives load runs of a minute each over a hundred tenants it
# brings up first; one still running after ten minutes hangs.
[[profile.suite.overrides]]
filter = 'package(andromeda-test-suite) & binary(~pgbouncer_)'
test-group = 'pgbouncer'
slow-timeout = { period = "60s", terminate-after = 10 }

