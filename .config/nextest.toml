# The default profile is nextest's own; the profiles below belong to andromeda-test-suite.

[test-groups]
# An exclusive registration conflicts with every exclusive or redirect registration of the same broker that matches its
# entity id and any of its Attributes, whatever the entity type (ETSI GS CIM 009 v1.9.1 clauses 4.3.6.3 and 5.9.2.4), so
# the interoperability cases cannot isolate their registrations from one another and run one at a time.
interoperability = { max-threads = 1 }
# A test that works in a Tenant of its own makes the broker create a database for it and run the migrations in it, and
# the broker keeps 16 tenant runtimes resident. With every test of the tree started at once those provisionings queue
# on the database server for longer than the broker's request timeout of 30 s, so the tests that provision tenants
# run four at a time (at most twelve tenants), whatever the parallelism of the rest.
andromeda-private-tenants = { max-threads = 4 }

# Every test runs in a process of its own beside every other, against the stack its test target uses. A failure is
# never retried: an intermittent failure is a defect to find, in the test's isolation or in the broker.
[profile.suite]
retries = 0
fail-fast = false
# The tests wait on the network, not the CPU.
test-threads = 64
# The longest test waits two periodic notifications ten seconds apart; a test still running after two minutes hangs.
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "fail"
final-status-level = "fail"

[[profile.suite.overrides]]
filter = 'binary_id(andromeda-test-suite::interoperability)'
test-group = 'interoperability'

[[profile.suite.overrides]]
filter = 'package(andromeda-test-suite) & binary(~andromeda_) & test(/(^|::)(a_css_qry_0009|a_css_qry_0010|a_ctx_exp_0040|a_ctx_exp_0041|a_ctx_srv_0015|a_ent_del_9001|a_inf_ret_9002|a_lim_idn_9012|a_mgt_tnt_0001|a_mgt_tnt_0002|a_mgt_tnt_0003|a_mgt_tnt_0004|a_mgt_tnt_0006|a_mgt_tnt_0007|a_mgt_tnt_0010|a_ntf_trg_9015|a_qry_typ_9003|a_snp_cln_8140|a_snp_cre_8140|a_snp_lim_8140|a_snp_qry_8140|a_sub_qry_0007|a_sub_qry_0008|a_sub_qry_9084|a_tmp_cwh_0029)_/)'
test-group = 'andromeda-private-tenants'

[profile.suite-verdict]
retries = 0
fail-fast = false
test-threads = 64
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.suite-verdict.overrides]]
filter = 'binary_id(andromeda-test-suite::interoperability)'
test-group = 'interoperability'

[[profile.suite-verdict.overrides]]
filter = 'package(andromeda-test-suite) & binary(~andromeda_) & test(/(^|::)(a_css_qry_0009|a_css_qry_0010|a_ctx_exp_0040|a_ctx_exp_0041|a_ctx_srv_0015|a_ent_del_9001|a_inf_ret_9002|a_lim_idn_9012|a_mgt_tnt_0001|a_mgt_tnt_0002|a_mgt_tnt_0003|a_mgt_tnt_0004|a_mgt_tnt_0006|a_mgt_tnt_0007|a_mgt_tnt_0010|a_ntf_trg_9015|a_qry_typ_9003|a_snp_cln_8140|a_snp_cre_8140|a_snp_lim_8140|a_snp_qry_8140|a_sub_qry_0007|a_sub_qry_0008|a_sub_qry_9084|a_tmp_cwh_0029)_/)'
test-group = 'andromeda-private-tenants'

[profile.suite-verdict.junit]
path = "junit.xml"
