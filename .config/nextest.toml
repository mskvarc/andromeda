# The default profile runs the workspace's unit tests, locally and in CI; `suite` and `suite-verdict` belong to
# andromeda-test-suite, and `upgrade` and `upgrade-verdict` to andromeda-upgrade-tests.

# An inheriting profile takes its parent's overrides from nextest 0.9.145 on; an older nextest would run `suite-verdict`
# with no test group at all.
nextest-version = { required = "0.9.145" }

[test-groups]
# An exclusive registration conflicts with every exclusive or redirect registration of the same broker that matches its
# entity id and any of its Attributes, whatever the entity type (ETSI GS CIM 009 v1.9.1 clauses 4.3.6.3 and 5.9.2.4), so
# the interoperability cases cannot isolate their registrations from one another and run one at a time.
interoperability = { max-threads = 1 }
# A test that works in a Tenant of its own makes the broker create a database for it and run the migrations in it, and
# the broker keeps 16 tenant runtimes resident. With every test of a tree started at once those provisionings queue on
# the database server for longer than the broker's admission deadline, so the tests that provision tenants run four at
# a time, whatever the parallelism of the rest.
private-tenants = { max-threads = 4 }
# The pgbouncer stack runs fifteen brokers over fifteen PostgreSQL servers beside the runner. One of its tests at a
# time fits a host that holds the whole stack; more than one and the servers of the scale tests, each carrying a
# hundred tenant databases, drive the host past its memory and the brokers die under it.
pgbouncer = { max-threads = 1 }

# The test targets of andromeda-upgrade-tests rehearse upgrades on a PostgreSQL server, which a unit-test run has none
# of, so every profile but `upgrade` and `upgrade-verdict`, which inherits it, leaves them out and keeps the crate's
# unit tests. A filterset given on the command line narrows this set, never widens it.
[profile.default]
default-filter = 'not (package(andromeda-upgrade-tests) & kind(test))'

# The large geometry test bounds the ratio of two decode times measured in one process; the CPU load of tests running
# beside it skews that ratio, so it runs alone. It is named by its test rather than its binary, because nextest checks
# every binary a filter names against the binaries it knows, and a run from the runner's archive knows only those of the
# suite and the upgrade rehearsals.
[[profile.default.overrides]]
filter = 'package(andromeda-http-extraction) & test(=a_million_position_polygon_body_decodes_without_a_tree)'
threads-required = "num-test-threads"

# Every test runs in a process of its own beside every other, against the stack its test target uses. A failure is
# never retried: an intermittent failure is a defect to find, in the test's isolation or in the broker.
[profile.suite]
retries = 0
fail-fast = false
# The tests wait on the network, not the CPU.
test-threads = 64
# The longest test waits two periodic notifications ten seconds apart; a test still running after two minutes hangs.
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "fail"
final-status-level = "fail"

[[profile.suite.overrides]]
filter = 'binary_id(andromeda-test-suite::interoperability)'
test-group = 'interoperability'

# A test at one of the broker's size bounds (an entity value or geometry position budget, a request body limit, tens of
# thousands of instances, a chain of a thousand Relationships, thousands of federated Entities, tens of tenants loaded
# at once) keeps a broker and its database server busy for seconds of CPU per request. On a host of two CPUs, a test
# running beside it holds its requests past the broker's request deadline, so it runs alone.
[[profile.suite.overrides]]
filter = '''
package(andromeda-test-suite) & binary(~andromeda_) & (
    test(/(^|::)(a_att_del_9234|a_att_del_9235|a_att_del_9236|a_bat_upd_0012|a_fed_qry_9001|a_fed_qry_9002|a_fed_qry_9003|a_fed_qry_9005)_/)
  | test(/(^|::)(a_fed_tmp_9001|a_fed_tmp_9002|a_fed_tmp_9003|a_lim_idn_9010|a_lim_pay_9002|a_lim_pay_9003|a_lim_pay_9004|a_lim_pay_9005)_/)
