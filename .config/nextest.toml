# The verdict run is the suite run plus a JUnit report, so it inherits every setting and override of `suite`.
[profile.suite-verdict]
inherits = "suite"

[profile.suite-verdict.junit]
path = "junit.xml"

# The upgrade rehearsals, on the server `ANDROMEDA_UPGRADE_TESTS__SERVER` names. A failure is never retried and stops
# no other rehearsal, as in the suite. A rehearsal migrates a few databases in seconds; one still running after five
# minutes waits on a lock it will never get.
[profile.upgrade]
default-filter = 'package(andromeda-upgrade-tests)'
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The upgrade tree's run is the rehearsals plus a JUnit report.
[profile.upgrade-verdict]
inherits = "upgrade"

[profile.upgrade-verdict.junit]
path = "junit.xml"
