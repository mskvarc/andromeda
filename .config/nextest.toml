  | test(/(^|::)(a_lim_pay_9017|a_lim_pay_9018|a_lim_pay_9019|a_lim_pay_9020|a_lim_pay_9021|a_lim_pgp_9005|a_lnk_tmp_0016|a_lnk_tmp_0017)_/)
  | test(/(^|::)(a_ntf_trg_0014|a_ntf_trg_0015|a_ntf_trg_0016|a_ntf_trg_0017|a_ntf_trg_0018|a_ntf_trg_9017|a_obs_wbk_9001|a_obs_wbk_9002)_/)
  | test(/(^|::)(a_obs_wbk_9003|a_qry_qlg_9070|a_snp_cln_9170|a_snp_cln_9171)_/)
)'''
threads-required = "num-test-threads"

[[profile.suite.overrides]]
filter = '''
package(andromeda-test-suite) & binary(~distributed_)
  & test(/(^|::)(n_fed_tmp_7435|n_map_qen_8001|n_snp_cre_8163|n_snp_cre_8164)_/)'''
threads-required = "num-test-threads"

