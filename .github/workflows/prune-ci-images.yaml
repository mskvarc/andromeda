name: prune-ci-images

# ci and suite tag a broker image index for each platform and a runner image index for every commit they run, build an
# image only for inputs no image exists for yet, and every build that refreshes a layer cache leaves the cache it
# replaced untagged. A commit's tags stay for thirty days, long enough to release it, and an input image stays until the
# last commit index pointing at it is gone, tagged or not, because two builds of one key at once leave the first
# untagged while commit indexes point at it. The tags of the commit at the head of main stay whatever their age, so that
# commit can be released without going through ci again. An untagged manifest stays at least one day, so a push still in
# flight keeps the manifest it is about to tag. The published andromeda and postgresql packages are never touched: their
# untagged versions are the platform manifests of a release. Each package is pruned by a job of its own, so a failure in
# one leaves the others pruned.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: prune-ci-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: prune (${{ matrix.package }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [andromeda-ci, andromeda-buildcache, postgresql-buildcache]
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ matrix.package }}
    steps:
      # A commit index is tagged <prefix>-<sha> and <prefix>-<sha>-<digest hex>, the second naming the manifest it
      # points at, so the references come from the version list and no manifest is fetched. A kept index without that
      # tag leaves its reference unknown, so no input image or untagged version is deleted then. A failed deletion is
      # reported and the rest go on.
      - name: Delete expired versions
        shell: bash
        run: |
          set -euo pipefail
          commit_cutoff="$(date -u -d '30 days ago' +%s)"
          untagged_cutoff="$(date -u -d '1 day ago' +%s)"
          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "keeping the commit tags of ${main_head}, the head of main"
          if ! gh api --paginate "users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | {id, name, updated: (.updated_at | fromdateiso8601), tags: .metadata.container.tags}' \
            > versions.jsonl 2> list-error.txt; then
            if grep -q 'HTTP 404' list-error.txt; then
              echo "${PACKAGE}: no such package"
              exit 0
            fi
            cat list-error.txt >&2
            exit 1
          fi
          commit_tag='^(broker|broker-amd64|runner)-[0-9a-f]{40}(-[0-9a-f]{64})?$'
          input_tag='^(broker|broker-amd64|runner)-input-[0-9a-f]{64}$'
          main_tag="-${main_head}(-[0-9a-f]{64})?\$"
          references="$(jq -sc --arg commit_tag "$commit_tag" --arg main_tag "$main_tag" --argjson cutoff "$commit_cutoff" '
            [.[] | select(.tags != [] and all(.tags[]; test($commit_tag)) and (.updated >= $cutoff or any(.tags[]; test($main_tag))))]
            | {
                digests: ([.[].tags[] | capture("-(?<hex>[0-9a-f]{64})$").hex | "sha256:" + .] | unique),
                unnamed: [.[] | select(any(.tags[]; test("-[0-9a-f]{64}$")) | not) | .name]
              }' versions.jsonl)"
          unnamed="$(jq -r '.unnamed | join(" ")' <<< "$references")"
          if [ -n "$unnamed" ]; then
            echo "::error::${PACKAGE}: commit indexes without a digest tag, so no input image or untagged version is deleted: ${unnamed}"
          fi
          ids="$(jq -r --arg commit_tag "$commit_tag" --arg main_tag "$main_tag" --arg input_tag "$input_tag" \
            --argjson references "$references" --argjson commit_cutoff "$commit_cutoff" --argjson untagged_cutoff "$untagged_cutoff" '
            select(
              (.tags != [] and all(.tags[]; test($commit_tag)) and (any(.tags[]; test($main_tag)) | not) and .updated < $commit_cutoff)
              or ($references.unnamed == [] and (.tags == [] or all(.tags[]; test($input_tag))) and .updated < $untagged_cutoff
                and (.name | IN($references.digests[]) | not))
            )
            | .id' versions.jsonl)"
          deleted=0
          failed=0
          for id in $ids; do
            if gh api --method DELETE "users/${OWNER}/packages/container/${PACKAGE}/versions/${id}" > /dev/null; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done
          echo "${PACKAGE}: deleted ${deleted} versions, ${failed} deletions failed"
          if [ -n "$unnamed" ] || [ "$failed" -gt 0 ]; then
            exit 1
          fi
