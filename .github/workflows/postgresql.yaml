name: postgresql

# Weekly, so the published image picks up the base image's and the apt packages' fixes. ci shellchecks the scripts.
on:
  push:
    branches: [master]
    paths:
      - docker/images/postgresql/**
      - .github/workflows/postgresql.yaml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: postgresql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The build record docker/build-push-action uploads is an artifact, and artifacts count against storage.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [tsl, apache]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
        platform: [linux/amd64, linux/arm64]

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/postgresql
      BUILDCACHE: ghcr.io/${{ github.repository_owner }}/postgresql-buildcache
    steps:
      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # Keep in sync with the Dockerfile FROM.
      - name: Resolve base image digest
        run: |
          set -euo pipefail
          digest="$(
            docker buildx imagetools inspect postgres:18.6-trixie \
              --format '{{json .Manifest}}' | jq -er '.digest'
          )"
          echo "BASE_DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=PostgreSQL with PostGIS and TimescaleDB
            org.opencontainers.image.description=PostgreSQL 18 with PostGIS 3 and TimescaleDB 2, tuned for high-throughput time-series ingest
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/master/docs/postgresql-image.md
            org.opencontainers.image.base.name=docker.io/library/postgres:18.6-trixie
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}
            org.opencontainers.image.licenses=${{ matrix.edition == 'tsl' && 'PostgreSQL AND GPL-2.0-or-later AND Apache-2.0 AND LicenseRef-Timescale' || 'PostgreSQL AND GPL-2.0-or-later AND Apache-2.0' }}

      # metadata-action has no per-label opt-out.
      - name: Drop the git-derived version label
        id: labels
        env:
          RAW_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          {
            echo 'labels<<LABELS_EOF'
            while IFS= read -r line; do
              case "$line" in
                org.opencontainers.image.version=*) ;;
                *) printf '%s\n' "$line" ;;
              esac
            done <<< "$RAW_LABELS"
            echo 'LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Before the first build: the layer cache lives in the registry, which keeps it out of the Actions cache.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for the settings check
        uses: docker/build-push-action@v7
        with:
          context: docker/images/postgresql
          platforms: ${{ matrix.platform }}
          build-args: |
            TIMESCALEDB_EDITION=${{ matrix.edition }}
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}:${{ matrix.edition }}-${{ env.PLATFORM_SLUG }}
          load: true
          tags: postgresql-settings-check:${{ matrix.edition }}

      - name: Check the tuned settings under container limits
        run: bash docker/images/postgresql/tests/settings-check.sh postgresql-settings-check:${{ matrix.edition }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/images/postgresql
          platforms: ${{ matrix.platform }}
          build-args: |
            TIMESCALEDB_EDITION=${{ matrix.edition }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}:${{ matrix.edition }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=registry,ref=${{ env.BUILDCACHE }}:${{ matrix.edition }}-${{ env.PLATFORM_SLUG }},mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.edition }}-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        edition: [tsl, apache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/postgresql
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digests-${{ matrix.edition }}-*

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag reflects the apt versions actually installed.
      - name: Resolve tags from image contents
        id: tags
        run: |
          set -euo pipefail
          amd64_file="$(ls digests/digests-${{ matrix.edition }}-linux-amd64/*)"
          amd64_digest="$(basename "$amd64_file")"
          ref="${IMAGE}@sha256:${amd64_digest}"

          read -r pg_major pg_version ts_version postgis_version < <(
            docker run --rm --entrypoint bash "$ref" -c '
              set -euo pipefail
              ts="$(dpkg-query -W timescaledb-2-postgresql-18 | cut -f2)"
              gis="$(dpkg-query -W postgresql-18-postgis-3 | cut -f2)"
              printf "%s %s %s %s\n" "$PG_MAJOR" "$PG_VERSION" "$ts" "$gis"
            '
          )

          # "18.6-1.pgdg13+1" -> "18.6"
          pg="${pg_version%%-*}"
          # "2.22.1~debian13" -> "2.22.1"
          ts="${ts_version%%~*}"
          ts="${ts%%-*}"
          # "3.5.3+dfsg-1.pgdg13+1" or "3.5.3-1.pgdg13+1" -> "3.5.3"
          postgis="${postgis_version%%+*}"
          postgis="${postgis%%-*}"

          version="${pg}-timescaledb${ts}-postgis${postgis}-${{ matrix.edition }}"
          {
            echo "version=${version}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

          tags=(
            "${IMAGE}:${version}"
            "${IMAGE}:${pg_major}-${{ matrix.edition }}"
            "${IMAGE}:${{ matrix.edition }}"
          )
          if [ "${{ matrix.edition }}" = tsl ]; then
            tags+=("${IMAGE}:latest")
          fi
          printf '%s\n' "${tags[@]}" > tags.txt
          echo "Resolved version ${version} with tags:"
          cat tags.txt

      - name: Create manifest list and push
        run: |
          set -euo pipefail
          refs=()
          for f in digests/*/*; do
            refs+=("${IMAGE}@sha256:$(basename "$f")")
          done
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < tags.txt
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Resolve manifest list digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(
            docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.version }}" \
              --format '{{json .Manifest}}' | jq -er '.digest'
          )"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.version }}"

      - name: Sign manifest list and per-platform manifests
        run: cosign sign --yes --recursive "${IMAGE}@${{ steps.digest.outputs.digest }}"

      # Attestation API rejects user-owned private repos.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
