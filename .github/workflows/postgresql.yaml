name: postgresql

# Weekly, so the published image picks up the base image's and the apt packages' fixes. ci shellchecks the scripts.
on:
  push:
    branches: [main]
    paths:
      - docker/images/postgresql/**
      - .github/workflows/postgresql.yaml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: postgresql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The build record docker/build-push-action uploads is an artifact, and artifacts count against storage.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [tsl, apache]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
        platform: [linux/amd64, linux/arm64]

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/postgresql
      BUILDCACHE: ghcr.io/${{ github.repository_owner }}/postgresql-buildcache
    steps:
      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # Dependabot bumps the FROM, so the labels follow it.
      - name: Read the base image from the Dockerfile
        run: |
          set -euo pipefail
          base="$(sed -n 's/^FROM //p' docker/images/postgresql/Dockerfile)"
          if [ -z "$base" ]; then
            echo "no FROM line in docker/images/postgresql/Dockerfile" >&2
            exit 1
          fi
          echo "BASE_IMAGE=${base}" >> "$GITHUB_ENV"

      - name: Resolve base image digest
        run: |
          set -euo pipefail
          digest="$(
            docker buildx imagetools inspect "$BASE_IMAGE" \
              --format '{{json .Manifest}}' | jq -er '.digest'
          )"
          echo "BASE_DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=PostgreSQL with PostGIS and TimescaleDB
            org.opencontainers.image.description=PostgreSQL 18 with PostGIS 3 and TimescaleDB 2, tuned for high-throughput time-series ingest
            org.opencontainers.image.documentation=https://andromeda.skvarc.com/docs/deployment/database/postgresql-image
            org.opencontainers.image.base.name=docker.io/library/${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}
            org.opencontainers.image.licenses=${{ matrix.edition == 'tsl' && 'PostgreSQL AND GPL-2.0-or-later AND Apache-2.0 AND LicenseRef-Timescale' || 'PostgreSQL AND GPL-2.0-or-later AND Apache-2.0' }}

      # metadata-action has no per-label opt-out.
      - name: Drop the git-derived version label
        id: labels
        env:
          RAW_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          {
            echo 'labels<<LABELS_EOF'
            while IFS= read -r line; do
              case "$line" in
                org.opencontainers.image.version=*) ;;
                *) printf '%s\n' "$line" ;;
              esac
            done <<< "$RAW_LABELS"
            echo 'LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Before the first build: the layer cache lives in the registry, which keeps it out of the Actions cache.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for the settings check
        uses: docker/build-push-action@v7
        with:
          context: docker/images/postgresql
          platforms: ${{ matrix.platform }}
          build-args: |
            TIMESCALEDB_EDITION=${{ matrix.edition }}
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}:${{ matrix.edition }}-${{ env.PLATFORM_SLUG }}
          load: true
          tags: postgresql-settings-check:${{ matrix.edition }}

      - name: Check the tuned settings under container limits
        run: bash docker/images/postgresql/tests/settings-check.sh postgresql-settings-check:${{ matrix.edition }}

      - name: Build and push the run's platform tag
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/images/postgresql
          platforms: ${{ matrix.platform }}
          build-args: |
            TIMESCALEDB_EDITION=${{ matrix.edition }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}:${{ matrix.edition }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=registry,ref=${{ env.BUILDCACHE }}:${{ matrix.edition }}-${{ env.PLATFORM_SLUG }},mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.IMAGE }}:run-${{ github.run_id }}-${{ matrix.edition }}-${{ env.PLATFORM_SLUG }},push=true

  # One stamp for every edition of a run. The run number keeps two runs on the same day apart, so a dated tag names one build.
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - name: Stamp the run
        id: stamp
        run: echo "stamp=$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, stamp]
    strategy:
      fail-fast: false
      matrix:
        edition: [tsl, apache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/postgresql
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag reflects the apt versions actually installed.
      - name: Resolve tags from image contents
        id: tags
        run: |
          set -euo pipefail
          ref="${IMAGE}:run-${GITHUB_RUN_ID}-${{ matrix.edition }}-linux-amd64"

          read -r pg_major pg_version ts_version postgis_version < <(
            docker run --rm --entrypoint bash "$ref" -c '
              set -euo pipefail
              ts="$(dpkg-query -W timescaledb-2-postgresql-18 | cut -f2)"
              gis="$(dpkg-query -W postgresql-18-postgis-3 | cut -f2)"
              printf "%s %s %s %s\n" "$PG_MAJOR" "$PG_VERSION" "$ts" "$gis"
            '
          )

          # "18.6-1.pgdg13+1" -> "18.6"
          pg="${pg_version%%-*}"
          # "2.22.1~debian13" -> "2.22.1"
          ts="${ts_version%%~*}"
          ts="${ts%%-*}"
          # "3.5.3+dfsg-1.pgdg13+1" or "3.5.3-1.pgdg13+1" -> "3.5.3"
          postgis="${postgis_version%%+*}"
          postgis="${postgis%%-*}"

          version="${pg}-timescaledb${ts}-postgis${postgis}-${{ matrix.edition }}"
          {
            echo "version=${version}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

          tags=(
            "${IMAGE}:${version}-${{ needs.stamp.outputs.stamp }}"
            "${IMAGE}:${version}"
            "${IMAGE}:${pg_major}-${{ matrix.edition }}"
            "${IMAGE}:${{ matrix.edition }}"
          )
          if [ "${{ matrix.edition }}" = tsl ]; then
            tags+=("${IMAGE}:latest")
          fi
          printf '%s\n' "${tags[@]}" > tags.txt
          echo "Resolved version ${version} with tags:"
          cat tags.txt

      - name: Create manifest list and push
        run: |
          set -euo pipefail
          refs=()
          for platform in linux-amd64 linux-arm64; do
            refs+=("${IMAGE}:run-${GITHUB_RUN_ID}-${{ matrix.edition }}-${platform}")
          done
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < tags.txt
          # A registry reads a multi-platform image's description from the index, so the index carries the platform
          # image's labels as annotations.
          annotation_args=()
          while IFS= read -r annotation; do
            annotation_args+=(--annotation "index:${annotation}")
          done < <(docker buildx imagetools inspect "${refs[0]}" --format '{{json .Image.Config.Labels}}' | jq -r '(. // {}) | to_entries[] | "\(.key)=\(.value)"')
          docker buildx imagetools create "${annotation_args[@]}" "${tag_args[@]}" "${refs[@]}"

      - name: Resolve manifest list digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(
            docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.version }}" \
              --format '{{json .Manifest}}' | jq -er '.digest'
          )"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.version }}"

      - name: Sign manifest list and per-platform manifests
        run: cosign sign --yes --recursive "${IMAGE}@${{ steps.digest.outputs.digest }}"

      # Attestation API rejects user-owned private repos.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
