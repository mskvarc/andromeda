name: sql

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  PGFORMATTER_VERSION: "5.11"
  # The release andromeda-sql pins; it refuses any other.
  SQUAWK_VERSION: "2.70.0"

jobs:
  sql:
    name: andromeda-sql
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the seal can be verified against the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      # The canonical layout is the one this pgFormatter release produces.
      - name: Install pgFormatter
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/darold/pgFormatter/archive/refs/tags/v${PGFORMATTER_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/pgFormatter-${PGFORMATTER_VERSION}"
          perl Makefile.PL
          make
          sudo make install
          pg_format --version
      - name: Install Squawk
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/squawk" "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          sudo install -m 0755 "$RUNNER_TEMP/squawk" /usr/local/bin/squawk
          squawk --version
      - name: Build
        run: cargo build --package andromeda-sql --locked
      - name: Check the migration layout
        run: cargo run --package andromeda-sql --locked -- format --check
      - name: Lint the migrations
        run: cargo run --package andromeda-sql --locked -- lint
      - name: Verify the seal
        run: cargo run --package andromeda-sql --locked -- verify
      # A sealed section must be unchanged from the branch a pull request merges into, or from the commit a push builds on.
      - name: Verify the seal against the base
        if: github.event_name == 'pull_request'
        run: cargo run --package andromeda-sql --locked -- verify --against "origin/${{ github.base_ref }}"
      - name: Verify the seal against the parent commit
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet HEAD^ > /dev/null; then
            cargo run --package andromeda-sql --locked -- verify --against HEAD^
          fi
      - name: Test
        run: cargo test --package andromeda-sql --all-features --locked
