name: release

# "-" in the tag = pre-release: only its full version is pushed, with no latest, X.Y or X.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The build record docker/build-push-action uploads is an artifact, and artifacts count against storage.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # The tagged commit must have passed ci, its suite trees included. Nothing runs before this does.
  checks:
    name: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require a passing ci-ok check on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=ci-ok&filter=latest" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "$passed" -eq 0 ]; then
            echo "${GITHUB_SHA} has no passing ci-ok check: let ci pass on the commit before tagging it" >&2
            exit 1
          fi

  # A stable tag needs its own ledger section, last, over a tree where every migration is sealed; a pre-release needs
  # only an unbroken seal. Nothing is built before this passes.
  seal:
    name: seal
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # The whole history and its tags, so the ledger can be read at the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      # Via env: never parsed as shell.
      - name: Verify the seal for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          against=()
          if previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null)"; then
            against=(--against "$previous")
          fi
          cargo run --package andromeda-sql --locked -- verify --release "$TAG" "${against[@]}"

  image:
    name: image (${{ matrix.platform }})
    needs: seal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda
      BUILDCACHE: ghcr.io/${{ github.repository_owner }}/andromeda-buildcache
    steps:
      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dependabot bumps the runtime FROM, so the base labels follow it.
      - name: Resolve the commit-dependent labels
        run: |
          set -euo pipefail
          from="$(sed -n 's/^FROM \(.*\) AS runtime$/\1/p' docker/images/andromeda/Dockerfile)"
          case "$from" in
            *@sha256:*) ;;
            *) echo "no digest-pinned runtime FROM line in docker/images/andromeda/Dockerfile" >&2; exit 1 ;;
          esac
          {
            echo "BASE_NAME=${from%@*}"
            echo "BASE_DIGEST=${from#*@}"
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      # The layer cache lives in the registry, which keeps it out of the Actions cache.
      - name: Build and push the run's platform tag
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/andromeda/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.BUILDCACHE }}:${{ env.PLATFORM_SLUG }}
          cache-to: type=registry,ref=${{ env.BUILDCACHE }}:${{ env.PLATFORM_SLUG }},mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.IMAGE }}:run-${{ github.run_id }}-${{ env.PLATFORM_SLUG }},push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.base.name=${{ env.BASE_NAME }}
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}

  image-merge:
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # X.Y.Z never moves; X.Y follows patch releases, X follows minor and patch releases, latest follows every stable
      # release. A pre-release renders only its full version for each pattern, and latest is left off it. A 0.y.z
      # release gets no X tag, since a 0.y minor release may break.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}

      # Via env: never parsed as shell.
      - name: Create manifest list and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          refs=()
          for platform in linux-amd64 linux-arm64; do
            refs+=("${IMAGE}:run-${GITHUB_RUN_ID}-${platform}")
          done
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          # A registry reads a multi-platform image's description from the index, so the index carries the platform
          # image's labels as annotations.
          annotation_args=()
          while IFS= read -r annotation; do
            annotation_args+=(--annotation "index:${annotation}")
          done < <(docker buildx imagetools inspect "${refs[0]}" --format '{{json .Image.Config.Labels}}' | jq -r '(. // {}) | to_entries[] | "\(.key)=\(.value)"')
          docker buildx imagetools create "${annotation_args[@]}" "${tag_args[@]}" "${refs[@]}"

      - name: Resolve manifest list digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(
            docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}" \
              --format '{{json .Manifest}}' | jq -er '.digest'
          )"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}"

      - name: Sign manifest list and per-platform manifests
        run: cosign sign --yes --recursive "${IMAGE}@${{ steps.digest.outputs.digest }}"

      # Attestation API rejects user-owned private repos.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  release:
    needs: image-merge
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checked-in copies equal what the tagged code generates; the architecture checks refuse a commit where they
      # differ.
      - name: Stage configuration schema and descriptor
        run: |
          set -euo pipefail
          mkdir -p dist
          cp docs/configuration/andromeda.schema.json "dist/andromeda-${{ github.ref_name }}.schema.json"
          cp docs/configuration/andromeda.descriptor.json "dist/andromeda-${{ github.ref_name }}.descriptor.json"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --current --strip all -o RELEASE_NOTES.md

      - name: Compose release body
        env:
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ needs.image-merge.outputs.digest }}
        run: |
          set -euo pipefail
          {
            cat RELEASE_NOTES.md
            printf '\n## Image\n\n```\ndocker pull %s:%s\n```\n\nManifest list digest: `%s`\n' "$IMAGE" "${VERSION#v}" "$DIGEST"
          } > body.md

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}
          artifacts: "dist/andromeda-*"
          bodyFile: body.md
