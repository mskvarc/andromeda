name: release

# "-" in the tag = pre-release: only its full version is pushed, with no latest, X.Y or X.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The build record docker/build-push-action uploads is an artifact, and artifacts count against storage.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # The tagged commit must have passed ci, its suite trees included. Nothing runs before this does.
  checks:
    name: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require a passing ci-ok check on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=ci-ok&filter=latest" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "$passed" -eq 0 ]; then
            echo "${GITHUB_SHA} has no passing ci-ok check: let ci pass on the commit before tagging it" >&2
            exit 1
          fi

  # A stable tag needs its own ledger section, last, over a tree where every migration is sealed; a pre-release needs
  # only an unbroken seal. Nothing is built before this passes.
  seal:
    name: seal
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # The whole history and its tags, so the ledger can be read at the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      # The SQL tool as the sql job of ci compiled it for the newest commit of main. A release saves no build.
      - uses: ./.github/actions/build-cache-restore
        with:
          job: sql
      # Via env: never parsed as shell.
      - name: Verify the seal for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          against=()
          if previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null)"; then
            against=(--against "$previous")
          fi
          cargo run --package andromeda-sql --locked -- verify --release "$TAG" "${against[@]}"

  # The arm64 image is the one ci built and ran the suite trees against for the tagged commit. The amd64 image is the
  # one ci built from the same broker inputs, and is built here only when ci has none.
  image:
    name: image (linux/amd64)
    needs: seal
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: ./.github/actions/keyed-broker-image
        with:
          platform: linux/amd64

  image-merge:
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda
      CI_IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda-ci
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # X.Y.Z never moves; X.Y follows patch releases, X follows minor and patch releases, latest follows every stable
      # release. A pre-release renders only its full version for each pattern, and latest is left off it. A 0.y.z
      # release gets no X tag, since a 0.y minor release may break.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}

      # Via env: never parsed as shell.
      - name: Create manifest list and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          AMD64_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          refs=("${CI_IMAGE}:broker-${GITHUB_SHA}" "$AMD64_IMAGE")
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          # A registry reads a multi-platform image's description from the index, so the index carries the platform
          # image's labels as annotations. Both platform images carry the same labels, and the amd64 one is a single
          # manifest whose labels read directly.
          annotation_args=(
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}"
            --annotation "index:org.opencontainers.image.version=${VERSION}"
            --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          )
          while IFS= read -r annotation; do
            annotation_args+=(--annotation "index:${annotation}")
          done < <(docker buildx imagetools inspect "${refs[1]}" --format '{{json .Image.Config.Labels}}' | jq -r '(. // {}) | to_entries[] | "\(.key)=\(.value)"')
          docker buildx imagetools create "${annotation_args[@]}" "${tag_args[@]}" "${refs[@]}"

      - name: Resolve manifest list digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(
            docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}" \
              --format '{{json .Manifest}}' | jq -er '.digest'
          )"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}"

      - name: Sign manifest list and per-platform manifests
        run: cosign sign --yes --recursive "${IMAGE}@${{ steps.digest.outputs.digest }}"

      # Attestation API rejects user-owned private repos.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  release:
    needs: image-merge
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checked-in copies equal what the tagged code generates; the architecture checks refuse a commit where they
      # differ.
      - name: Stage configuration schema and descriptor
        run: |
          set -euo pipefail
          mkdir -p dist
          cp docs/configuration/andromeda.schema.json "dist/andromeda-${{ github.ref_name }}.schema.json"
          cp docs/configuration/andromeda.descriptor.json "dist/andromeda-${{ github.ref_name }}.descriptor.json"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --current --strip all -o RELEASE_NOTES.md

      - name: Compose release body
        env:
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ needs.image-merge.outputs.digest }}
        run: |
          set -euo pipefail
          {
            cat RELEASE_NOTES.md
            printf '\n## Image\n\n```\ndocker pull %s:%s\n```\n\nManifest list digest: `%s`\n' "$IMAGE" "${VERSION#v}" "$DIGEST"
          } > body.md

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}
          artifacts: "dist/andromeda-*"
          bodyFile: body.md
