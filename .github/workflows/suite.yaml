name: suite

# The trees ci does not run on every commit, weekly, and any single tree on demand. The pgbouncer tree is not offered:
# its fifteen brokers over fifteen PostgreSQL servers are very resource intensive.
on:
  schedule:
    - cron: "17 2 * * 5"
  workflow_dispatch:
    inputs:
      tree:
        description: The tree to run; weekly runs the trees the schedule runs.
        type: choice
        default: weekly
        options:
          - weekly
          - ngsi_ld
          - andromeda
          - etsi
          - annex_c
          - distributed
          - interoperability
      fresh:
        description: Run the trees in full, ignoring the passes runs on main recorded.
        type: boolean
        default: false

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The broker and runner images are built from the checkout. A tree's verdict is keyed as in ci, on the keys of both
# images' inputs, the stack definitions, the runner configuration and the database image's digest, so a weekly run whose
# trees read nothing new passes them without running.
jobs:
  suite:
    name: suite (${{ matrix.tree }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    # The broker and runner images ci pushed for the commit. Built here instead, the release broker alone takes most of
    # the job's time on a runner of two CPUs.
    env:
      ANDROMEDA_IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda-ci:broker-${{ github.sha }}
      ANDROMEDA_TEST_SUITE_RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda-ci:runner-${{ github.sha }}
      ANDROMEDA_POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/postgresql:tsl
    strategy:
      fail-fast: false
      matrix:
        tree: ${{ fromJSON((github.event_name == 'schedule' || inputs.tree == 'weekly') && '["andromeda","distributed","interoperability"]' || format('["{0}"]', inputs.tree)) }}
    steps:
      - uses: actions/checkout@v7
      - id: broker
        uses: ./.github/actions/image-inputs
        with:
          image: broker
      - id: runner
        uses: ./.github/actions/image-inputs
        with:
          image: runner
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/suite-tree
        with:
          tree: ${{ matrix.tree }}
          broker-key: ${{ steps.broker.outputs.key }}
          runner-key: ${{ steps.runner.outputs.key }}
          fresh: ${{ inputs.fresh }}
