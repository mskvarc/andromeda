name: suite

# The trees ci does not run on every commit, weekly, and any single tree on demand. The pgbouncer tree is not offered:
# its fifteen brokers over fifteen PostgreSQL servers are very resource intensive.
on:
  schedule:
    - cron: "17 2 * * 5"
  workflow_dispatch:
    inputs:
      tree:
        description: The tree to run; weekly runs the trees the schedule runs.
        type: choice
        default: weekly
        options:
          - weekly
          - ngsi_ld
          - andromeda
          - etsi
          - annex_c
          - distributed
          - interoperability
          - upgrade
      fresh:
        description: Run the trees in full, ignoring the passes runs on main recorded.
        type: boolean
        default: false

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The images and trees run as in ci. A weekly run of a commit ci already gave its images builds none, and a tree whose
# verdict key a run on main recorded a pass under passes without running.
jobs:
  trees:
    name: trees
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/suite-trees.yaml
    with:
      trees: ${{ (github.event_name == 'schedule' || inputs.tree == 'weekly') && '["andromeda", "distributed", "interoperability"]' || format('["{0}"]', inputs.tree) }}
      fresh: ${{ inputs.fresh == true }}
