name: pgbouncer

# Nightly integration run for the transaction-pooling tier. It is heavy (one
# PostgreSQL, one PgBouncer, four brokers, and hundreds of tenants), so it is
# nightly-only and deliberately NOT part of the release gate matrix. Its status
# badge is per workflow, so like every other stack it is a thin workflow file
# over the shared composite action. The cron is staggered away from the other
# stacks so their broker-image builds do not contend for the gha cache at once.
on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

concurrency:
  group: itest-pgbouncer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  itest:
    name: pgbouncer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/itest
        with:
          stack: pgbouncer
