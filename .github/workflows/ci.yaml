name: ci

# One run per commit. A pull request runs the checks pr-ok gathers, the required status check. A push to main, or a run
# started by hand, also gives the commit its images and runs the suite trees that ci-ok adds, the check a tag requires.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      fresh:
        description: Run every check in full, ignoring the passes runs on main recorded. Images of the same inputs are still reused.
        type: boolean
        default: false

# A newer commit on the same branch or pull request cancels the run before it, so only the newest commit of main
# carries ci-ok, and a tag goes on that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PGFORMATTER_VERSION: "5.11"
  # The release andromeda-sql pins; it refuses any other.
  SQUAWK_VERSION: "2.70.0"

# Every job but deny first looks up its verdict: when a run on main recorded a pass of the job under the key of
# everything the job reads, the job passes without running its checks and names that run. Only a job that runs its
# checks on main and passes records its key. deny always runs, because its advisory check reads the day's advisory
# database rather than the commit.
jobs:
  fmt:
    name: fmt
    if: &ready ${{ !github.event.pull_request.draft }}
    runs-on: &runner ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: verdict
        uses: ./.github/actions/verdict-lookup
        with:
          check: fmt
          fresh: ${{ inputs.fresh }}
      - name: Install pinned toolchain
        if: &unless-reused ${{ steps.verdict.outputs.reused != 'true' }}
        run: rustup toolchain install --profile minimal
      - if: *unless-reused
        run: cargo fmt --all --check
      - if: *unless-reused
        uses: ./.github/actions/verdict-record
        with:
          key: ${{ steps.verdict.outputs.key }}

  taplo:
    name: taplo
    if: *ready
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: verdict
        uses: ./.github/actions/verdict-lookup
        with:
          check: taplo
          fresh: ${{ inputs.fresh }}
      - if: *unless-reused
        uses: taiki-e/install-action@v2
        with:
          tool: taplo@0.10.0
      - if: *unless-reused
        run: taplo fmt --check --diff
      - if: *unless-reused
        uses: ./.github/actions/verdict-record
        with:
          key: ${{ steps.verdict.outputs.key }}

  machete:
    name: machete
    if: *ready
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: verdict
        uses: ./.github/actions/verdict-lookup
        with:
          check: machete
          fresh: ${{ inputs.fresh }}
      - name: Install pinned toolchain
        if: *unless-reused
        run: rustup toolchain install --profile minimal
      - if: *unless-reused
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - if: *unless-reused
        run: cargo machete --with-metadata
      - if: *unless-reused
        uses: ./.github/actions/verdict-record
        with:
          key: ${{ steps.verdict.outputs.key }}

  deny:
    name: deny
    if: *ready
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features --locked check

  shellcheck:
    name: shellcheck
    if: *ready
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: verdict
        uses: ./.github/actions/verdict-lookup
        with:
          check: shellcheck
          fresh: ${{ inputs.fresh }}
      - if: *unless-reused
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck@0.11.0
      - if: *unless-reused
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - if: *unless-reused
        uses: ./.github/actions/verdict-record
        with:
          key: ${{ steps.verdict.outputs.key }}

  # clippy, unit and sql each keep their newest build of main in the Actions cache, workspace crates included, and
  # restore it before building. The save deletes the job's earlier builds through the Actions API.
  clippy:
    name: clippy
    if: *ready
    runs-on: *runner
    timeout-minutes: 90
    permissions: &build-cache-permissions
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - id: verdict
        uses: ./.github/actions/verdict-lookup
        with:
          check: clippy
          fresh: ${{ inputs.fresh }}
      - if: *unless-reused
        uses: ./.github/actions/rust-toolchain
      - id: cache
        if: *unless-reused
        uses: ./.github/actions/build-cache-restore
      - if: *unless-reused
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: *unless-reused
        uses: ./.github/actions/verdict-record
        with:
          key: ${{ steps.verdict.outputs.key }}
      # A failed check leaves what it compiled valid, so only a cancelled job saves nothing.
      - if: &save-build ${{ !cancelled() && steps.cache.outputs.key != '' }}
        uses: ./.github/actions/build-cache-save
        with:
          key: ${{ steps.cache.outputs.key }}
          paths: ${{ steps.cache.outputs.paths }}
          job-status: ${{ job.status }}

  unit:
    name: unit
    if: *ready
    runs-on: *runner
    timeout-minutes: 90
    permissions: *build-cache-permissions
    steps:
      - uses: actions/checkout@v7
      - id: verdict
        uses: ./.github/actions/verdict-lookup
        with:
          check: unit
          fresh: ${{ inputs.fresh }}
      - if: *unless-reused
        uses: ./.github/actions/rust-toolchain
      - id: cache
        if: *unless-reused
        uses: ./.github/actions/build-cache-restore
      - if: *unless-reused
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      # andromeda-sql shells out to pg_format and Squawk and is tested by sql; andromeda-test-suite needs a live stack.
      - name: Workspace unit tests
        if: *unless-reused
        run: cargo nextest run --workspace --exclude andromeda --exclude andromeda-sql --exclude andromeda-test-suite --lib --bins --tests --all-features --locked --no-fail-fast -E 'not test(architecture)'
      # The selection and flags of the step above, so the test binaries it built are run again rather than rebuilt. The
      # architecture checks are generated into every crate; andromeda-sql's run with its tests in sql.
      - name: Architecture checks
        if: &unless-reused-or-cancelled ${{ !cancelled() && steps.verdict.outputs.reused != 'true' }}
        run: cargo nextest run --workspace --exclude andromeda --exclude andromeda-sql --exclude andromeda-test-suite --lib --bins --tests --all-features --locked --no-fail-fast -E 'test(architecture)'
      # The broker's root tests/ need a live stack.
      - name: Broker unit tests
        if: *unless-reused-or-cancelled
        run: cargo nextest run --package andromeda --bins --all-features --locked --no-fail-fast
      - if: *unless-reused
        uses: ./.github/actions/verdict-record
        with:
          key: ${{ steps.verdict.outputs.key }}
      - if: *save-build
        uses: ./.github/actions/build-cache-save
        with:
          key: ${{ steps.cache.outputs.key }}
          paths: ${{ steps.cache.outputs.paths }}
          job-status: ${{ job.status }}

  sql:
    name: sql
    if: *ready
    runs-on: *runner
    timeout-minutes: 60
    permissions: *build-cache-permissions
    steps:
      # The whole history, so the seal can be verified against the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The seal is verified against the branch a pull request merges into, or the commit a push builds on. verify
      # --against reads the ledger there, so the ledger's blob is part of the key, and a tree that passed on main
      # against one ledger isn't taken as passing against another, as a revert of a seal would be.
      - name: Resolve the base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            revision="$(git rev-parse --verify "origin/${BASE_REF}^{commit}")"
          else
            revision="$(git rev-parse --verify --quiet 'HEAD^' || true)"
          fi
          ledger=""
          if [ -n "$revision" ]; then
            ledger="$(git rev-parse --verify --quiet "${revision}:migrations/seal-ledger.toml" || true)"
          fi
          {
            echo "revision=${revision}"
            echo "ledger=${ledger}"
          } >> "$GITHUB_OUTPUT"
      - id: verdict
        uses: ./.github/actions/verdict-lookup
        with:
          check: sql
          parts: base-ledger=${{ steps.base.outputs.ledger }}
          fresh: ${{ inputs.fresh }}
      - if: *unless-reused
        uses: ./.github/actions/rust-toolchain
      - id: cache
        if: *unless-reused
        uses: ./.github/actions/build-cache-restore
      - if: *unless-reused
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      # The canonical migration layout is the one this pgFormatter release produces. Both tools go under the job's
      # temporary directory, so a runner without sudo installs them the same way. pg_format loads its modules from the
      # directory it sits in, so it runs from the extracted release; its Makefile.PL accepts no install prefix.
      - name: Install pgFormatter and Squawk
        if: *unless-reused
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/sql-tools"
          mkdir -p "${tools}/bin"
          curl -fsSL "https://github.com/darold/pgFormatter/archive/refs/tags/v${PGFORMATTER_VERSION}.tar.gz" | tar -xz -C "$tools"
          ln -s "${tools}/pgFormatter-${PGFORMATTER_VERSION}/pg_format" "${tools}/bin/pg_format"
          case "$(uname -m)" in
            x86_64) squawk=squawk-linux-x64 ;;
            aarch64) squawk=squawk-linux-arm64 ;;
            *) echo "no Squawk build for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o "${tools}/bin/squawk" "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/${squawk}"
          chmod 0755 "${tools}/bin/squawk"
          echo "${tools}/bin" >> "$GITHUB_PATH"
          "${tools}/bin/pg_format" --version
          "${tools}/bin/squawk" --version
      # Each check below runs whatever an earlier one reported, so one run lists every failure.
      - name: Migration layout
        if: *unless-reused
        run: cargo run --package andromeda-sql --locked -- format --check
      - name: Migration lint
        if: *unless-reused-or-cancelled
        run: cargo run --package andromeda-sql --locked -- lint
      - name: Migration seal
        if: *unless-reused-or-cancelled
        run: cargo run --package andromeda-sql --locked -- verify
      # A sealed section must be unchanged from the base. A root commit has no base to compare with.
      - name: Migration seal against the base
        if: ${{ !cancelled() && steps.verdict.outputs.reused != 'true' && steps.base.outputs.revision != '' }}
        env:
          REVISION: ${{ steps.base.outputs.revision }}
        run: cargo run --package andromeda-sql --locked -- verify --against "$REVISION"
      - name: andromeda-sql tests
        if: *unless-reused-or-cancelled
        run: cargo nextest run --package andromeda-sql --all-features --locked --no-fail-fast
      - if: *unless-reused
        uses: ./.github/actions/verdict-record
        with:
          key: ${{ steps.verdict.outputs.key }}
      - if: *save-build
        uses: ./.github/actions/build-cache-save
        with:
          key: ${{ steps.cache.outputs.key }}
          paths: ${{ steps.cache.outputs.paths }}
          job-status: ${{ job.status }}

  # The amd64 broker image a release publishes beside the arm64 one, keyed on the same inputs on a native amd64 runner,
  # under broker-amd64-input-<key> and broker-amd64-<sha>. No suite tree runs it and no gate waits for it; it is there
  # so a release of the commit finds it built.
  broker-image-amd64:
    name: broker-image (linux/amd64)
    if: &beyond-pull-request ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/keyed-broker-image
        with:
          platform: linux/amd64

  # The arm64 broker image, the runner image and the trees ci-ok requires, run as the suite workflow runs its trees.
  trees:
    name: trees
    if: *beyond-pull-request
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/suite-trees.yaml
    with:
      trees: '["ngsi_ld", "etsi", "annex_c"]'
      fresh: ${{ inputs.fresh == true }}

  pr-ok:
    name: pr-ok
    # Runs when a job it needs failed or was skipped, so a failure upstream still fails pr-ok; a cancelled run, which a
    # newer commit superseded, reports nothing.
    if: &settled ${{ !cancelled() && !github.event.pull_request.draft }}
    needs: [fmt, taplo, machete, deny, shellcheck, clippy, unit, sql]
    runs-on: *runner
    timeout-minutes: 5
    steps: &require-every-job
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job ended ${result}" >&2
              exit 1
            fi
          done

  ci-ok:
    name: ci-ok
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [pr-ok, trees]
    runs-on: *runner
    timeout-minutes: 5
    steps: *require-every-job
