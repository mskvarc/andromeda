name: ci

# One run per commit. A pull request runs the checks pr-ok gathers, the required status check. A push to main, or a run
# started by hand, also builds the images and runs the suite trees that ci-ok adds, the check a tag requires.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer commit on the same branch or pull request cancels the run before it, so only the newest commit of main
# carries ci-ok, and a tag goes on that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PGFORMATTER_VERSION: "5.11"
  # The release andromeda-sql pins; it refuses any other.
  SQUAWK_VERSION: "2.70.0"

jobs:
  fmt:
    name: fmt
    if: &ready ${{ !github.event.pull_request.draft }}
    runs-on: &runner ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - run: cargo fmt --all --check

  taplo:
    name: taplo
    if: *ready
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo@0.10.0
      - run: taplo fmt --check --diff

  machete:
    name: machete
    if: *ready
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete --with-metadata

  deny:
    name: deny
    if: *ready
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features --locked check

  shellcheck:
    name: shellcheck
    if: *ready
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: shellcheck@0.11.0
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck

  clippy:
    name: clippy
    if: *ready
    runs-on: *runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  unit:
    name: unit
    if: *ready
    runs-on: *runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      # andromeda-sql shells out to pg_format and Squawk and is tested by sql; andromeda-test-suite needs a live stack.
      - name: Workspace unit tests
        run: cargo nextest run --workspace --exclude andromeda --exclude andromeda-sql --exclude andromeda-test-suite --lib --bins --tests --all-features --locked --no-fail-fast -E 'not test(architecture)'
      # The selection and flags of the step above, so the test binaries it built are run again rather than rebuilt. The
      # architecture checks are generated into every crate; andromeda-sql's run with its tests in sql.
      - name: Architecture checks
        if: ${{ !cancelled() }}
        run: cargo nextest run --workspace --exclude andromeda --exclude andromeda-sql --exclude andromeda-test-suite --lib --bins --tests --all-features --locked --no-fail-fast -E 'test(architecture)'
      # The broker's root tests/ need a live stack.
      - name: Broker unit tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --package andromeda --bins --all-features --locked --no-fail-fast

  sql:
    name: sql
    if: *ready
    runs-on: *runner
    timeout-minutes: 60
    steps:
      # The whole history, so the seal can be verified against the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      # The canonical migration layout is the one this pgFormatter release produces. Both tools go under the job's
      # temporary directory, so a runner without sudo installs them the same way. pg_format loads its modules from the
      # directory it sits in, so it runs from the extracted release; its Makefile.PL accepts no install prefix.
      - name: Install pgFormatter and Squawk
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/sql-tools"
          mkdir -p "${tools}/bin"
          curl -fsSL "https://github.com/darold/pgFormatter/archive/refs/tags/v${PGFORMATTER_VERSION}.tar.gz" | tar -xz -C "$tools"
          ln -s "${tools}/pgFormatter-${PGFORMATTER_VERSION}/pg_format" "${tools}/bin/pg_format"
          case "$(uname -m)" in
            x86_64) squawk=squawk-linux-x64 ;;
            aarch64) squawk=squawk-linux-arm64 ;;
            *) echo "no Squawk build for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o "${tools}/bin/squawk" "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/${squawk}"
          chmod 0755 "${tools}/bin/squawk"
          echo "${tools}/bin" >> "$GITHUB_PATH"
          "${tools}/bin/pg_format" --version
          "${tools}/bin/squawk" --version
      # Each check below runs whatever an earlier one reported, so one run lists every failure.
      - name: Migration layout
        run: cargo run --package andromeda-sql --locked -- format --check
      - name: Migration lint
        if: ${{ !cancelled() }}
        run: cargo run --package andromeda-sql --locked -- lint
      - name: Migration seal
        if: ${{ !cancelled() }}
        run: cargo run --package andromeda-sql --locked -- verify
      # A sealed section must be unchanged from the branch a pull request merges into, or from the commit a push builds on.
      - name: Migration seal against the base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo run --package andromeda-sql --locked -- verify --against "origin/${BASE_REF}"
      - name: Migration seal against the parent commit
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet HEAD^ > /dev/null; then
            cargo run --package andromeda-sql --locked -- verify --against HEAD^
          fi
      - name: andromeda-sql tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --package andromeda-sql --all-features --locked --no-fail-fast

  # The broker and runner images every suite tree runs, built once per commit. A release publishes this broker image
  # as its arm64 image.
  images:
    name: images
    if: &beyond-pull-request ${{ github.event_name != 'pull_request' }}
    runs-on: *runner
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      CI_IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda-ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/broker-image
        with:
          platform: linux/arm64
          image: ${{ env.CI_IMAGE }}:broker-${{ github.sha }}
          cache: ghcr.io/${{ github.repository_owner }}/andromeda-buildcache:linux-arm64
      - name: Build and push the runner image
        uses: docker/build-push-action@v7
        with:
          context: tools/andromeda-test-suite/stacks/runner
          platforms: linux/arm64
          provenance: false
          cache-from: type=registry,ref=${{ env.CI_IMAGE }}:runner-buildcache
          cache-to: type=registry,ref=${{ env.CI_IMAGE }}:runner-buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.CI_IMAGE }}:runner-${{ github.sha }},push=true

  # The database image is the published one, which the postgresql workflow rebuilds whenever its directory changes.
  suite:
    name: suite (${{ matrix.tree }})
    needs: images
    if: *beyond-pull-request
    runs-on: *runner
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        tree: [ngsi_ld, etsi, annex_c]
    env:
      ANDROMEDA_IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda-ci:broker-${{ github.sha }}
      ANDROMEDA_TEST_SUITE_RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/andromeda-ci:runner-${{ github.sha }}
      ANDROMEDA_POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/postgresql:tsl
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/suite-tree
        with:
          tree: ${{ matrix.tree }}

  pr-ok:
    name: pr-ok
    # Runs when a job it needs failed or was skipped, so a failure upstream still fails pr-ok; a cancelled run, which a
    # newer commit superseded, reports nothing.
    if: &settled ${{ !cancelled() && !github.event.pull_request.draft }}
    needs: [fmt, taplo, machete, deny, shellcheck, clippy, unit, sql]
    runs-on: *runner
    timeout-minutes: 5
    steps: &require-every-job
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job ended ${result}" >&2
              exit 1
            fi
          done

  ci-ok:
    name: ci-ok
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [pr-ok, suite]
    runs-on: *runner
    timeout-minutes: 5
    steps: *require-every-job
