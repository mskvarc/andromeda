name: clippy

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test binaries are run, not debugged, and full debug info is the single
  # largest consumer of runner disk. Line tables keep backtraces readable at a
  # fraction of the size. Incremental artifacts are pure overhead for a job that
  # compiles each commit exactly once.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      # rust-toolchain.toml pins the nightly and names the components; there is no
      # stable lint run, because `.cargo/config.toml` passes
      # `-Zhigher-ranked-assumptions` on every build.
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
