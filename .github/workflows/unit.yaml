name: unit

on:
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  unit-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      # Covered by architecture.yaml.
      - name: Workspace crates
        run: cargo test --workspace --exclude andromeda --lib --bins --tests --all-features --locked -- --skip architecture
      # Root tests/ need a live stack.
      - name: Broker binary
        run: cargo test --package andromeda --bins --all-features --locked
