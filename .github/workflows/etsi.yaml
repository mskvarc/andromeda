name: etsi

# Single-broker only; distributed conformance is the distributed itest stack.
on:
  workflow_dispatch:

concurrency:
  group: etsi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  etsi:
    name: etsi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space

      - uses: docker/setup-buildx-action@v4

      - name: Install pinned toolchain
        shell: bash
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the ETSI conformance suite
        run: cargo xtask etsi run --scope base --strict --output "$RUNNER_TEMP/etsi-out"

      - name: Upload the ETSI report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: etsi-report
          path: ${{ runner.temp }}/etsi-out/**
          if-no-files-found: warn
