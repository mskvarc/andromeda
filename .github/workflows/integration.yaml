name: integration

on:
  schedule:
    - cron: "3 3 * * 0"
  pull_request:
    paths: &harness
      - .github/actions/itest/**
      - .github/actions/free-disk-space/**
      - .github/workflows/integration.yaml
      - docker/images/andromeda/**
      - docker/compose/test/**
      - crates/andromeda-xtask/**
  push:
    branches: [master]
    paths: *harness
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.plan.outputs.stacks }}
      image-source: ${{ steps.plan.outputs.image-source }}
    steps:
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gate='["base","distributed","federation","snapshot","http3","extensions","tls"]'
          all='["base","distributed","federation","snapshot","http3","extensions","tls","pgbouncer"]'
          case "$EVENT" in
            schedule)
              echo "stacks=$all" >> "$GITHUB_OUTPUT"
              echo "image-source=ghcr" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "stacks=$all" >> "$GITHUB_OUTPUT"
              echo "image-source=preloaded" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "stacks=$gate" >> "$GITHUB_OUTPUT"
              echo "image-source=preloaded" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build-tests:
    needs: setup
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/build-test-suite
        with:
          out: ${{ runner.temp }}/test-suite

  build-broker:
    needs: setup
    if: ${{ needs.setup.outputs.image-source == 'preloaded' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space

      - uses: ./.github/actions/build-broker-image
        with:
          tag: andromeda-ci:broker
          archive: ${{ runner.temp }}/broker/broker.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: broker-image
          path: ${{ runner.temp }}/broker/broker.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # build-broker is skipped in ghcr mode.
  itest:
    needs: [setup, build-tests, build-broker]
    if: ${{ always() && needs.setup.result == 'success' && needs.build-tests.result == 'success' && (needs.build-broker.result == 'success' || needs.build-broker.result == 'skipped') }}
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.setup.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/itest
        with:
          stack: ${{ matrix.stack }}
          image-source: ${{ needs.setup.outputs.image-source }}
