name: Note
description: Capture something to look into later. Triage turns it into a real issue or closes it.
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        A note has no kind yet. It waits in the Untriaged view until triage gives it a kind, an area and a milestone and rewrites the body to that kind's form, or closes it as not planned.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Whatever you know now: links, a hunch, where you saw it."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
