name: Performance report
description: Correct, but too slow or too large.
labels: [performance]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label and a milestone.
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: "What ran: data size, request mix, clients, configuration, commit, and whether the host was shared."
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Measurement
      description: "The figures: latency percentiles, throughput, memory, a plan or profile excerpt."
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target
      description: One checkbox per figure that counts as fixed, with the conditions it holds under. This is the acceptance. Tick a box once the check is verified.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: "How the acceptance is shown: suite tests, a load run, repeated or live runs. Anything long-running keeps the issue in Validating until it passes."
      placeholder: Suite tests only.
    validations:
      required: true
  - type: textarea
    id: leads
    attributes:
      label: Leads
      description: Suspected cause or where to look. A hypothesis, not a plan.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
