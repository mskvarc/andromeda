name: Refactor proposal
description: The structure of the code changes and its behaviour does not.
labels: [refactor]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label and a milestone.
  - type: textarea
    id: current
    attributes:
      label: Current structure
      description: What is shaped wrong now (duplication, misplaced ownership, a god type) and where.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target structure
      description: Which module or crate owns what afterwards.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
      description: What the current structure costs, or what it blocks.
    validations:
      required: false
  - type: checkboxes
    id: behaviour
    attributes:
      label: Behaviour
      options:
        - label: No behaviour change. A change in behaviour belongs in its own issue.
          required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: One checkbox per structural fact that must hold afterwards, such as one owner of a concept or an architecture check that passes. Tick a box once the check is verified.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: "How the acceptance is shown: suite tests, a load run, repeated or live runs. Anything long-running keeps the issue in Validating until it passes."
      placeholder: Suite tests only.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
