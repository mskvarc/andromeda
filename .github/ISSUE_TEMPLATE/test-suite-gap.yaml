name: Test suite gap
description: A gap or defect in the test suite, its stacks or its fixtures.
labels: [testing]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label and a milestone.
  - type: textarea
    id: gap
    attributes:
      label: Gap
      description: What the suite cannot check today, or what a test gets wrong. If the broker is what is wrong, use another form.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Consequence
      description: Which broker defect could pass unnoticed while the gap stays open.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "One checkbox per observable check: the input or situation, and the result that must hold. A reviewer can verify each one without reading the code. Tick a box once the check is verified."
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: "How the acceptance is shown: suite tests, a load run, repeated or live runs. Anything long-running keeps the issue in Validating until it passes."
      placeholder: Suite tests only.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
