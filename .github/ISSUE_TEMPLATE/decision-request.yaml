name: Decision request
description: A question about what the broker should do, which needs a ruling.
labels: [decision]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label and a milestone.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The question in one sentence, and what prompted it.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each candidate answer and what it costs, including which clients or stored data it changes.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Clauses, compatibility promises and earlier rulings the answer must respect.
    validations:
      required: false
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The option you would pick, and why.
    validations:
      required: false
  - type: textarea
    id: ruling
    attributes:
      label: Ruling
      description: "Filled in when decided: the rule, the clause it rests on, and the issues filed to carry it out."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
