name: Feature request
description: A capability the broker lacks, from the specification or as an extension.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label and a milestone.
  - type: dropdown
    id: origin
    attributes:
      label: Origin
      description: Where the capability is defined.
      options:
        - Optional part of the specification
        - Broker extension, off by default
        - Operator tooling outside the API
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Need
      description: "Who gains what: what a client or operator can do afterwards that they cannot do now."
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour
      description: "The visible contract: clauses, configuration keys and their values, wire shapes, defaults."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "One checkbox per observable check: the input or situation, and the result that must hold. A reviewer can verify each one without reading the code. Tick a box once the check is verified."
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: "How the acceptance is shown: suite tests, a load run, repeated or live runs. Anything long-running keeps the issue in Validating until it passes."
      placeholder: Suite tests only.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
