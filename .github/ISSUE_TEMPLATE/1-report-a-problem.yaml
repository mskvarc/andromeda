name: Report a problem
description: Something broke or answered wrong, and you are not sure which form fits. Triage turns it into the right kind of issue.
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        This is the short form. Know the kind already (a bug, a conformance deviation, a performance problem)? Pick its form in the list instead. Either way, triage reads every report.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw, such as the response, the error, a crash or the log lines.
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The request you sent or the steps you took before it happened.
      placeholder: "curl -i http://localhost:1056/ngsi-ld/v1/entities?type=Building"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead, and the specification clause if you know it.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Broker version
      description: The output of `andromeda --version`, or the image tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: How you run the broker, and the database and its version.
      placeholder: Andromeda image on Compose, Andromeda PostgreSQL image
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Broker log lines around the problem.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This is not a security vulnerability. Vulnerabilities are reported privately, as `SECURITY.md` describes.
          required: true
