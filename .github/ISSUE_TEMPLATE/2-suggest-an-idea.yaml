name: Suggest an idea
description: Something you wish the broker did. Triage turns it into a feature request or closes it.
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        This is the short form. Ready to describe the behaviour and how to check it? Pick the Feature request form in the list instead.
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: What you would do with the broker that you cannot do now.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What it would save you or make possible.
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: Where it is defined
      description: The specification clause or option, if it comes from one.
    validations:
      required: false
