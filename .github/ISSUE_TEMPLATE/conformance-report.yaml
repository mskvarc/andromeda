name: Conformance report
description: Behaviour contradicts ETSI GS CIM 009 v1.9.1.
labels: [conformance]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label and a milestone.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The request, trimmed to what shows the deviation, with the protocol versions and configuration it holds for.
      placeholder: "curl -i -X PATCH http://localhost:1056/ngsi-ld/v1/entities -H 'Content-Type: application/json' -d '{}'"
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response
      description: "What the broker answered: status, headers and body that matter."
    validations:
      required: true
  - type: textarea
    id: clause
    attributes:
      label: Clause
      description: The clause that decides the expected behaviour, by number, and what it requires. Quote the sentence when the reading is not obvious.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "One checkbox per observable check: the input or situation, and the result that must hold. A reviewer can verify each one without reading the code. Tick a box once the check is verified."
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: "How the acceptance is shown: suite tests, a load run, repeated or live runs. Anything long-running keeps the issue in Validating until it passes."
      placeholder: Suite tests only.
    validations:
      required: true
  - type: textarea
    id: leads
    attributes:
      label: Leads
      description: Suspected cause or where to look. A hypothesis, not a plan.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
