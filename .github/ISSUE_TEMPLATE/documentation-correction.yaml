name: Documentation correction
description: User or operator documentation is wrong or missing.
labels: [docs]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Report it privately, as `SECURITY.md` describes: open the repository's **Security** tab and choose **Report a vulnerability**.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label and a milestone.
  - type: textarea
    id: passage
    attributes:
      label: Page and passage
      description: The page and the sentence that is wrong, quoted, or the topic no page covers.
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: Correct statement
      description: "What the documentation should say, and what it rests on: a clause, the code, a test. This is the acceptance."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
