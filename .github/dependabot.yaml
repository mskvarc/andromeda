version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /docker/images/*
      - /tools/andromeda-test-suite/stacks/runner
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directories:
      - /docker/compose/dev
      - /tools/andromeda-test-suite/stacks/andromeda
      - /tools/andromeda-test-suite/stacks/base
      - /tools/andromeda-test-suite/stacks/interoperability
      - /tools/andromeda-test-suite/stacks/multi
      - /tools/andromeda-test-suite/stacks/templates
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-compose-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions-minor:
        update-types:
          - minor
          - patch
