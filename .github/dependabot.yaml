version: 2

# Every update pull request runs ci on a hosted runner, so updates are grouped into as few pull requests as possible:
# cargo weekly, the slower-moving ecosystems monthly.

# The tag of every Rust base image names the toolchain rust-toolchain.toml pins, and the toolchain_pin architecture gate
# fails while they differ, so a new Rust version reaches the pin and the images of the broker and the suite runner in
# one pull request. The broker's runtime image travels with them, because a directory belongs to one update entry.
# Each member entry names its labels: an entry without them gets Dependabot's default dependencies and ecosystem labels,
# whatever the group sets.
multi-ecosystem-groups:
  rust-toolchain:
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [build]
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: rust-toolchain
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: rust-toolchain
    labels: [build]

  - package-ecosystem: docker
    directories:
      - /docker/images/andromeda
      - /tools/andromeda-test-suite/stacks/runner
    patterns: ["*"]
    multi-ecosystem-group: rust-toolchain
    labels: [build]

  - package-ecosystem: docker
    directories:
      - /docker/images/postgresql
    schedule:
      interval: monthly
    labels: [build]
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directories:
      - /docker/compose
      - /tools/andromeda-test-suite/stacks/andromeda
      - /tools/andromeda-test-suite/stacks/base
      - /tools/andromeda-test-suite/stacks/interoperability
      - /tools/andromeda-test-suite/stacks/multi
      - /tools/andromeda-test-suite/stacks/pgbouncer
      - /tools/andromeda-test-suite/stacks/templates
      - /tools/andromeda-test-suite/stacks/upgrade
    schedule:
      interval: monthly
    labels: [build]
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-compose-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    labels: [build]
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions-minor:
        update-types:
          - minor
          - patch
