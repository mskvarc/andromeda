name: Free disk space
description: Removes preinstalled SDKs the workspace does not use, so linking has room for its output.

runs:
  using: composite
  steps:
    # A full debug build of this workspace is around 13 GB of target artifacts,
    # against roughly 21 GB free on a stock runner. When the filesystem fills, the
    # linker dies with SIGBUS rather than a disk-full message, because rust-lld
    # writes its output through an mmap. Reclaiming the toolchains no Rust build
    # touches keeps that headroom.
    - name: Remove unused preinstalled toolchains
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}"
        df -h /
