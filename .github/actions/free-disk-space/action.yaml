name: Free disk space
description: Removes preinstalled SDKs the workspace does not use, so linking has room for its output.

runs:
  using: composite
  steps:
    # Full disk kills rust-lld with SIGBUS, not ENOSPC.
    - name: Remove unused preinstalled toolchains
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}"
        df -h /
