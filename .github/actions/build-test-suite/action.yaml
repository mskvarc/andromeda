name: Build integration test suite
description: Compile integration suites once and upload them with the xtask runner.

inputs:
  out:
    description: Directory to assemble the suite binaries, xtask runner, and manifest in.
    required: true

runs:
  using: composite
  steps:
    - name: Build xtask runner
      shell: bash
      run: cargo build --package andromeda-xtask --locked

    - name: Compile and package suites
      shell: bash
      run: cargo run --package andromeda-xtask --locked -- build-tests --out "${{ inputs.out }}"

    - name: Add xtask runner to the suite
      shell: bash
      run: cp target/debug/xtask "${{ inputs.out }}/xtask"

    # Native binaries barely compress.
    - uses: actions/upload-artifact@v7
      with:
        name: test-suite
        path: ${{ inputs.out }}
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
