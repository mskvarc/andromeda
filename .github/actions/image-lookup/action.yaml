name: Image lookup
description: Reports whether the registry holds an image under a reference. A lookup that fails for any reason but the reference being missing fails the step, so a registry error never builds an image again and moves its tag off the manifest commit indexes point at.

inputs:
  image:
    description: The reference to look up, tag included.
    required: true

outputs:
  found:
    description: "`true` when the image exists, `false` otherwise."
    value: ${{ steps.lookup.outputs.found }}

runs:
  using: composite
  steps:
    - name: Look up the image
      id: lookup
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        if error="$(docker buildx imagetools inspect --raw "$IMAGE" 2>&1 > /dev/null)"; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        elif grep -Fqx "ERROR: ${IMAGE}: not found" <<< "$error"; then
          echo "found=false" >> "$GITHUB_OUTPUT"
        else
          echo "$error" >&2
          exit 1
        fi
