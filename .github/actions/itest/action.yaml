name: Integration test stack
description: Run one integration stack against a prebuilt broker image and test suite.

inputs:
  stack:
    description: The xtask stack name (base, distributed, federation, snapshot, http3, extensions, tls, core-write-history, pgbouncer).
    required: true
  image-source:
    description: >
      `preloaded`: build-broker artifact. `ghcr`: published image, built from source if missing.
    required: false
    default: preloaded

runs:
  using: composite
  steps:
    - uses: ./.github/actions/free-disk-space

    # Packages are private.
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Download broker image
      if: ${{ inputs.image-source == 'preloaded' }}
      uses: actions/download-artifact@v8
      with:
        name: broker-image
        path: ${{ runner.temp }}/broker

    # Must match the compose image tag or compose rebuilds.
    - name: Load broker image
      if: ${{ inputs.image-source == 'preloaded' }}
      shell: bash
      env:
        BROKER_ARCHIVE: ${{ runner.temp }}/broker/broker.tar.gz
      run: |
        set -euo pipefail
        docker load -i "$BROKER_ARCHIVE"
        docker tag andromeda-ci:broker "andromeda-${{ inputs.stack }}:latest"

    - name: Pull published broker image
      id: published-broker
      if: ${{ inputs.image-source == 'ghcr' }}
      shell: bash
      run: |
        set -euo pipefail
        published="ghcr.io/${{ github.repository_owner }}/andromeda:latest"
        if docker pull "$published"; then
          docker tag "$published" "andromeda-${{ inputs.stack }}:latest"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "andromeda:latest not published yet; building from source"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build broker image
      if: ${{ inputs.image-source == 'ghcr' && steps.published-broker.outputs.found == 'false' }}
      uses: ./.github/actions/build-broker-image
      with:
        tag: andromeda-${{ inputs.stack }}:latest
        cache-mode: read-only

    - name: Provide PostgreSQL image
      shell: bash
      run: |
        set -euo pipefail
        postgres_tag="andromeda-${{ inputs.stack }}-postgres:latest"
        published="ghcr.io/${{ github.repository_owner }}/postgresql:latest"
        if docker pull "$published"; then
          docker tag "$published" "$postgres_tag"
        else
          echo "postgresql:latest not published yet; building from context"
          docker build -t "$postgres_tag" docker/images/postgresql
        fi

    - name: Download test suite
      uses: actions/download-artifact@v8
      with:
        name: test-suite
        path: ${{ runner.temp }}/test-suite

    # upload-artifact drops the executable bit.
    - name: Restore executable bits
      shell: bash
      run: chmod +x "${{ runner.temp }}/test-suite/xtask" "${{ runner.temp }}/test-suite/bin/"*

    - name: Run integration suites
      shell: bash
      env:
        ANDROMEDA_XTASK_NO_BUILD: "1"
        ANDROMEDA_XTASK_TEST_MANIFEST: ${{ runner.temp }}/test-suite/manifest.json
      run: |
        "${{ runner.temp }}/test-suite/xtask" itest --stack "${{ inputs.stack }}"
