name: Commit tag
description: Tags an image for the commit as an index over it, with the commit as the index's revision annotation, so the tag shares every layer with the image. The index also carries the tag <tag>-<digest hex>, naming the manifest it points at, which the pruning reads instead of fetching the index.

inputs:
  image:
    description: The image to tag, as a reference with its tag.
    required: true
  tag:
    description: The reference the commit's index is pushed as, tag included.
    required: true

runs:
  using: composite
  steps:
    # The index is built from the manifest the image's tag names now, by digest, so the digest its second tag names is
    # the one it points at even when the image's tag moves meanwhile.
    - name: Tag the image for the commit
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er .digest)"
        docker buildx imagetools create \
          --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
          --tag "${TAG}-${digest#sha256:}" \
          --tag "$TAG" \
          "${IMAGE%:*}@${digest}"
