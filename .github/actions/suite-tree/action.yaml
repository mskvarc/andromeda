name: Suite tree
description: Runs one tree of andromeda-test-suite against its stack, built from the working tree.

inputs:
  tree:
    description: The tree to run, as run-suite.sh names it.
    required: true

runs:
  using: composite
  steps:
    - name: Run the tree
      shell: bash
      env:
        TREE: ${{ inputs.tree }}
      run: tools/andromeda-test-suite/run-suite.sh "$TREE"
