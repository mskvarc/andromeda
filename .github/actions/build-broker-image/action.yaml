name: Build broker image
description: Build and load the broker image, optionally saving a tarball.

inputs:
  tag:
    description: Tag the built image is loaded under.
    required: true
  cache-mode:
    description: >
      `read-write` (default) also exports the build's layers to the `broker`
      scope; `read-only` only imports them, for one-off fallback builds that
      should not churn the shared scope.
    required: false
    default: read-write
  archive:
    description: When set, the loaded image is also saved as a gzip tarball at this path.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    # Exposes GHA cache creds to buildx and sccache.
    - uses: crazy-max/ghaction-github-runtime@v4

    - name: Build broker image
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        CACHE_MODE: ${{ inputs.cache-mode }}
        ARCHIVE: ${{ inputs.archive }}
      run: |
        set -euo pipefail
        cache_args=(--cache-from type=gha,scope=broker)
        case "$CACHE_MODE" in
          read-write) cache_args+=(--cache-to type=gha,mode=max,scope=broker) ;;
          read-only) ;;
          *) echo "cache-mode must be read-write or read-only, got '$CACHE_MODE'" >&2; exit 1 ;;
        esac
        docker buildx build --load -t "$TAG" \
          -f docker/images/andromeda/Dockerfile \
          "${cache_args[@]}" \
          --secret id=ACTIONS_RESULTS_URL,env=ACTIONS_RESULTS_URL \
          --secret id=ACTIONS_RUNTIME_TOKEN,env=ACTIONS_RUNTIME_TOKEN \
          .
        if [ -n "$ARCHIVE" ]; then
          mkdir -p "$(dirname "$ARCHIVE")"
          docker save "$TAG" | gzip > "$ARCHIVE"
        fi
