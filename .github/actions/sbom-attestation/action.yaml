name: SBOM attestation
description: Generates an SPDX and a CycloneDX SBOM of each platform image a published image index points at, and attests each to its platform image, pushing the attestations to the registry. The job checks out the commit, logs in to the registry, sets up buildx and holds attestations, id-token and packages write permission.

inputs:
  image:
    description: The image's repository, without a tag, such as ghcr.io/<owner>/andromeda.
    required: true
  digest:
    description: The digest of the image's index.
    required: true

outputs:
  directory:
    description: The directory holding the SBOMs, as <name>-linux-<architecture>.spdx.json and <name>-linux-<architecture>.cdx.json, where <name> is the last segment of the image's repository, such as andromeda.
    value: ${{ steps.sboms.outputs.directory }}

runs:
  using: composite
  steps:
    - id: platforms
      uses: ./.github/actions/platform-digests
      with:
        image: ${{ inputs.image }}
        digest: ${{ inputs.digest }}

    - id: syft
      uses: anchore/sbom-action/download-syft@v0.24.3
      with:
        syft-version: v1.57.2

    # Syft names an SBOM's subject after the reference it scans, digest included. The last segment of the repository
    # names it the same in every SBOM of the image, whatever registry and owner publish it.
    - name: Name the SBOMs
      id: sboms
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        name="${IMAGE##*/}"
        directory="${RUNNER_TEMP}/sboms"
        mkdir -p "$directory"
        {
          echo "name=${name}"
          echo "directory=${directory}"
          echo "amd64=${directory}/${name}-linux-amd64"
          echo "arm64=${directory}/${name}-linux-arm64"
        } >> "$GITHUB_OUTPUT"

    # Pulled from the registry by its own digest, a platform image is scanned as it is, whatever the runner's
    # platform. One scan writes both formats, since some SBOM consumers read only CycloneDX. CycloneDX is held at 1.6,
    # so a Syft upgrade, whose default is 1.7, hands no consumer a version its older releases cannot import.
    - name: Generate the linux/amd64 SBOMs
      shell: bash
      env:
        SYFT: ${{ steps.syft.outputs.cmd }}
        SYFT_CHECK_FOR_APP_UPDATE: "false"
        SOURCE: registry:${{ inputs.image }}@${{ steps.platforms.outputs.amd64 }}
        NAME: ${{ steps.sboms.outputs.name }}
        SBOM: ${{ steps.sboms.outputs.amd64 }}
      run: |
        "$SYFT" scan "$SOURCE" --source-name "$NAME" -o "spdx-json=${SBOM}.spdx.json" -o "cyclonedx-json@1.6=${SBOM}.cdx.json"

    - name: Generate the linux/arm64 SBOMs
      shell: bash
      env:
        SYFT: ${{ steps.syft.outputs.cmd }}
        SYFT_CHECK_FOR_APP_UPDATE: "false"
        SOURCE: registry:${{ inputs.image }}@${{ steps.platforms.outputs.arm64 }}
        NAME: ${{ steps.sboms.outputs.name }}
        SBOM: ${{ steps.sboms.outputs.arm64 }}
      run: |
        "$SYFT" scan "$SOURCE" --source-name "$NAME" -o "spdx-json=${SBOM}.spdx.json" -o "cyclonedx-json@1.6=${SBOM}.cdx.json"

    # An SBOM describes one platform image, so it is attested to that image alone. A lookup names the platform image,
    # by its digest or through a tool's platform option, and finds that image's SBOMs and no other's.
    - name: Attest the linux/amd64 SPDX SBOM
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.platforms.outputs.amd64 }}
        sbom-path: ${{ steps.sboms.outputs.amd64 }}.spdx.json
        push-to-registry: true

    - name: Attest the linux/amd64 CycloneDX SBOM
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.platforms.outputs.amd64 }}
        sbom-path: ${{ steps.sboms.outputs.amd64 }}.cdx.json
        push-to-registry: true

    - name: Attest the linux/arm64 SPDX SBOM
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.platforms.outputs.arm64 }}
        sbom-path: ${{ steps.sboms.outputs.arm64 }}.spdx.json
        push-to-registry: true

    - name: Attest the linux/arm64 CycloneDX SBOM
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ steps.platforms.outputs.arm64 }}
        sbom-path: ${{ steps.sboms.outputs.arm64 }}.cdx.json
        push-to-registry: true
