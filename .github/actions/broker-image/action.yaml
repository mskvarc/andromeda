name: Broker image
description: Builds the broker image for one platform from a build context and pushes it under one tag. The image carries no commit.

inputs:
  platform:
    description: The platform to build, such as linux/arm64.
    required: true
  context:
    description: The build context, as the image-inputs action assembles it for the broker.
    required: true
  image:
    description: The reference the image is pushed as, tag included.
    required: true
  cache:
    description: The registry reference holding the layer cache for the platform.
    required: true

runs:
  using: composite
  steps:
    # Dependabot bumps the runtime FROM, so the base labels follow it. The revision, version and creation time are known
    # only when a commit or a release tags the image, so they go on the index that tag points at.
    - name: Resolve the base image labels
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.context }}/docker/images/andromeda/Dockerfile
      run: |
        set -euo pipefail
        from="$(sed -n 's/^FROM \(.*\) AS runtime$/\1/p' "$DOCKERFILE")"
        case "$from" in
          *@sha256:*) ;;
          *) echo "no digest-pinned runtime FROM line in docker/images/andromeda/Dockerfile" >&2; exit 1 ;;
        esac
        {
          echo "BASE_NAME=${from%@*}"
          echo "BASE_DIGEST=${from#*@}"
        } >> "$GITHUB_ENV"

    # The compiler cache keeps compiled crates in the Actions cache. Its credentials reach only actions, so they are
    # exported here and handed to the build as secrets, which stay out of every layer.
    - name: Export the Actions cache credentials
      uses: actions/github-script@v9
      with:
        script: |
          core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN || '');
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    # The layer cache lives in the registry, so only the compiler cache uses the Actions cache.
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/docker/images/andromeda/Dockerfile
        platforms: ${{ inputs.platform }}
        # One manifest per image, with no attestation manifests beside it, so every untagged version is one the
        # pruning may delete.
        provenance: false
        cache-from: type=registry,ref=${{ inputs.cache }}
        cache-to: type=registry,ref=${{ inputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true
        outputs: type=image,name=${{ inputs.image }},push=true
        secrets: |
          ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
          ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.base.name=${{ env.BASE_NAME }}
          org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}
